<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>siikk-guide – WoW: Forever Klassen-Guide</title>
<meta name="description" content="Deutscher Einsteiger-Guide für alle Klassen in WoW: Forever – Talente, Rotationen, Berufe und das siikkUI-Addon.">
<link rel="icon" href="favicon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
@font-face{font-family:"Cinzel";src:url(fonts/cinzel.woff) format("woff");font-weight:400 900;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-400i.woff) format("woff");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-600.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrainsmono.woff) format("woff");font-weight:100 800;font-display:swap}
.site-foot{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--f-mono);font-size:.75rem;padding:1rem max(16px,env(safe-area-inset-left,0px)) calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:center}
.site-foot a{color:var(--muted)}
</style>
</head>
<body>
<style>
/* Layout: Zauberbuch mit Lesezeichen – links eine feste Kategorienleiste, rechts die Seite. Farben aus dem Logo: Waldgrün, Altgold, Amethyst. */
:root{
  --bg:#efebdf; --surface:#f9f6ee; --sunk:#e6e1d2; --ink:#1d241d; --muted:#5b665b; --line:#d3ccb9;
  --gold:#8f6a1f; --gold-soft:#f0e5c6; --green:#2c6232; --green-soft:#dde8d6; --ame:#653b98; --ame-soft:#ebe2f4; --ember:#a3501c; --ember-soft:#f6e5d6;
  --mx:62%; --clsmx:58%; --clsraw:#2c6232; --cls:color-mix(in srgb,var(--clsraw) var(--clsmx),#1d241d);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111510; --surface:#191f18; --sunk:#0c0f0b; --ink:#ebe7da; --muted:#a2ab9b; --line:#323a2f;
  --gold:#d9b45e; --gold-soft:#2b2514; --green:#8cc77e; --green-soft:#1d2a1b; --ame:#c3a3e6; --ame-soft:#2a2137; --ember:#e59a62; --ember-soft:#372417; --cls:var(--clsraw); --mx:100%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111510; --surface:#191f18; --sunk:#0c0f0b; --ink:#ebe7da; --muted:#a2ab9b; --line:#323a2f;
  --gold:#d9b45e; --gold-soft:#2b2514; --green:#8cc77e; --green-soft:#1d2a1b; --ame:#c3a3e6; --ame-soft:#2a2137; --ember:#e59a62; --ember-soft:#372417; --cls:var(--clsraw); --mx:100%; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--ame)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;color:inherit}

/* Kopfzeile */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.45rem;display:flex;align-items:center;gap:.8rem}
.bar .home{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.bar .home img{height:2.1rem;width:auto}
.bar .home b{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;color:var(--green)}
.crumb{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.crumb{display:none}}
.menu-btn{display:none;margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.35rem .7rem;font-family:var(--f-mono);font-size:.75rem;cursor:pointer}

/* Addon-Werbung */
.bar-ad{margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;border:1px solid #6b3fa0;background:#6b3fa0;color:#fff;border-radius:8px;padding:.32rem .7rem;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.bar-ad:hover{filter:brightness(1.1)}
.bar-ad svg{width:1rem;height:1rem}
.bar-ad + .menu-btn{margin-left:0}
@media (max-width:420px){.bar-ad .t{display:none}}
.promo{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:1rem;align-items:center;margin:1.4rem 0;padding:.9rem;border-radius:12px;border:1px solid color-mix(in srgb,var(--ame) 45%,var(--line));background:linear-gradient(135deg,var(--ame-soft),var(--surface) 70%)}
.promo img{width:100%;height:auto;border-radius:8px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.promo h3{margin:0 0 .25rem;font-family:var(--f-display)}
.promo p{margin:.2rem 0 .6rem;color:var(--muted)}
.promo.small{grid-template-columns:minmax(0,9rem) minmax(0,1fr);padding:.7rem}
@media (max-width:620px){.promo,.promo.small{grid-template-columns:minmax(0,1fr)}.promo img{max-width:20rem}}
.btn.ame{background:#6b3fa0;border-color:#6b3fa0;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.nav-i.ad{color:var(--ame);font-weight:600}
.nav-i.ad .new{margin-left:auto;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;background:#6b3fa0;color:#fff;border-radius:4px;padding:.08rem .35rem}
.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem;margin:1rem 0}
.dl{display:grid;gap:.45rem;align-content:start;padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.dl.top{border:2px solid var(--ame)}
.dl h3{margin:0;font-family:var(--f-display)}
.dl .sz{overflow-wrap:anywhere;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.dl ul{margin:.1rem 0;padding-left:1.1rem;font-size:.92rem}
.dl .btn{justify-self:start;margin-top:.3rem}
.dl-msg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin:0}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.7rem;margin:.8rem 0}
.feat .card h3{font-size:1rem}
.feat .card p{margin:.2rem 0;font-size:.93rem}
.cmd{font-family:var(--f-mono);font-size:.82rem;background:var(--sunk);border-radius:4px;padding:.05rem .3rem;white-space:nowrap}
.addon-hero{display:grid;gap:.6rem;justify-items:center;text-align:center;margin-bottom:1rem}
.addon-hero img{width:min(36rem,100%);height:auto;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.3)}

/* Zwei Spalten */
.layout{display:grid;grid-template-columns:18rem minmax(0,1fr);min-height:calc(100vh - 3rem)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.05rem);align-self:start;height:calc(100vh - 3.05rem - env(safe-area-inset-top,0px));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--surface);padding:1rem .8rem 2rem max(.8rem,env(safe-area-inset-left,0px));scrollbar-width:thin}
.side h4{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.4rem .5rem .45rem;font-weight:500}
.side h4:first-child{margin-top:0}
.nav-i{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;border:0;background:none;padding:.5rem .6rem;border-radius:8px;cursor:pointer;font-size:1.12rem;color:var(--ink)}
.nav-i svg{width:1.7rem;height:1.7rem;flex:0 0 auto}
.nav-i:hover{background:var(--sunk)}
.nav-i[aria-current="page"]{background:var(--gold-soft);color:var(--ink);font-weight:600}
.nav-sub .nav-i{font-size:1.02rem;padding:.38rem .6rem .38rem .9rem;color:var(--muted)}
.nav-sub .nav-i:hover{color:var(--ink)}
.nav-sub .nav-i::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--line);flex:0 0 auto}
.nav-sub .nav-i.on{color:var(--ink)}
.nav-sub .nav-i.on::before{background:var(--cls)}

main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1.5rem 4rem}
.page{max-width:52rem;margin:0 auto}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 3.05rem) auto 0 0;width:min(19rem,86vw);height:auto;z-index:25;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .menu-btn{display:block}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* Typo */
h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,2.9rem)}
h2{font-size:1.65rem;color:var(--green);margin-bottom:.2rem}
h3{font-family:var(--f-body);font-weight:600;font-size:1.12rem;margin:1.5rem 0 .4rem}
p{margin:.55rem 0;max-width:68ch}
ul,ol{padding-left:1.25rem;max-width:68ch}
li{margin:.25rem 0}
.kap{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.en{font-family:var(--f-mono);font-size:.74em;color:var(--muted)}
.lvl{font-family:var(--f-mono);font-size:.85em;font-variant-numeric:tabular-nums;color:var(--green);font-weight:500;white-space:nowrap}
section.sec{padding-block:1.8rem .3rem;scroll-margin-top:4rem;border-top:1px solid var(--line);margin-top:1.4rem}
section.sec:first-of-type{border-top:0;margin-top:0}

.chip{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:.3rem;font-family:var(--f-mono);font-size:.72rem;padding:.22rem .6rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);max-width:100%}
.chip b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.tag{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:.12rem .45rem;border-radius:4px;background:var(--ame-soft);color:var(--ame);white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)} .tag.o{background:var(--gold-soft);color:var(--gold)} .tag.r{background:var(--ember-soft);color:var(--ember)}

.tip,.warn,.grp{border-radius:8px;padding:.75rem 1rem;margin:1rem 0;max-width:68ch}
.tip{background:var(--green-soft)} .warn{background:var(--ember-soft)} .grp{background:var(--ame-soft)}
.tip>b:first-child,.warn>b:first-child,.grp>b:first-child{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.15rem}
.tip>b:first-child{color:var(--green)} .warn>b:first-child{color:var(--ember)} .grp>b:first-child{color:var(--ame)}

.tbl{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--bg)}
tr:last-child td{border-bottom:0}

/* Startseite */
.hero{display:grid;justify-items:center;text-align:center;gap:.6rem;padding-block:.5rem 1rem}
.hero img{width:min(34rem,100%);height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.28))}
.hero p{margin-inline:auto;color:var(--muted)}
.grid-btn{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.7rem;margin:1rem 0}
@media (min-width:640px){.grid-btn.g3{grid-template-columns:repeat(3,1fr)}.grid-btn.g5{grid-template-columns:repeat(5,1fr)}}
.cbtn{display:grid;justify-items:center;gap:.35rem;padding:.9rem .5rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:center;transition:transform .12s ease,border-color .12s ease}
.cbtn:hover{transform:translateY(-2px);border-color:var(--c,var(--gold))}
.cbtn .medal{width:4.2rem;height:4.2rem}
.cbtn b{font-family:var(--f-display);font-size:1rem;color:color-mix(in srgb,var(--c,var(--ink)) var(--cm,var(--mx)),var(--ink))}
.cbtn span{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);letter-spacing:.04em;line-height:1.35}
@media (prefers-reduced-motion:reduce){.cbtn{transition:none}.cbtn:hover{transform:none}}

/* Klassenkopf */
.chead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center;padding:1.1rem 1.2rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--cls)}
.chead .medal{width:5rem;height:5rem}
.chead h1{color:var(--cls)}
.chead p{margin:.3rem 0 .6rem}
@media (max-width:520px){.chead{grid-template-columns:1fr}.chead .medal{width:4rem;height:4rem}}
.medal{display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem;margin:1rem 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;min-width:0}
.card h3{margin:0 0 .3rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.45rem}
.card ul{margin:.3rem 0;padding-left:1.1rem}

/* Fähigkeiten */
.filter{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.8rem 0}
.filter input[type=search]{font:inherit;font-size:.95rem;padding:.45rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1 1 14rem;min-width:0}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.22rem .65rem;font-family:var(--f-mono);font-size:.7rem;cursor:pointer;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--cls);border-color:var(--cls);color:var(--surface)}
.abil{display:grid;grid-template-columns:3rem 2.2rem minmax(0,1fr);gap:.2rem .6rem;padding:.55rem .2rem;border-bottom:1px dashed var(--line);align-items:start}
.abil .ico{width:2.2rem;height:2.2rem}
.abil b{font-weight:600}
.abil p{margin:.1rem 0 0;font-size:.93rem}
.star{color:var(--gold);font-size:.8rem}

ol.steps{counter-reset:r;list-style:none;padding:0}
ol.steps li{counter-increment:r;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.5rem;align-items:baseline;padding:.32rem 0;border-bottom:1px dashed var(--line)}
ol.steps li::before{content:counter(r);font-family:var(--f-mono);font-size:.78rem;color:var(--surface);background:var(--cls);border-radius:50%;width:1.5rem;height:1.5rem;display:grid;place-items:center}

/* Talentbaum */
.tt{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:1.2rem 0;overflow:hidden}
.tt-head{display:grid;gap:.8rem;padding:1rem;border-bottom:1px solid var(--line)}
.tt-level{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.2rem .8rem}
.tt-level label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tt-level output{font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--cls);justify-self:end;font-weight:700}
.tt-lvl-row{grid-column:1/-1;display:flex;align-items:center;gap:.6rem}
.tt-lvl-row input{flex:1 1 auto;min-width:0;accent-color:var(--cls)}
.tt-step{width:2.5rem;height:2.5rem;padding:0;font-size:1.3rem;line-height:1;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.tt-sum{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem}
.tt-sum div{display:flex;flex-direction:column}
.tt-k{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tt-sum b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:500}
.tt-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{font-size:.9rem;cursor:pointer;border-radius:8px;border:1px solid var(--cls);background:var(--cls);color:var(--surface);padding:.42rem .8rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.tt-warn{margin:0;color:var(--ember);font-size:.92rem}
.tt-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tt-tabs button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:.65rem .3rem;font-family:var(--f-mono);font-size:.74rem;border-bottom:2px solid transparent;cursor:pointer}
.tt-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cls)}
.tt-tabs span{display:inline-block;min-width:1.4em;padding:0 .3em;margin-left:.25em;border-radius:4px;background:var(--sunk);color:var(--ink)}
.tt-grid{position:relative;display:grid;grid-template-columns:2.6rem repeat(4,minmax(0,1fr));gap:.5rem .3rem;padding:1rem .6rem 1rem .4rem;max-width:31rem;margin:0 auto}
.tt-req{grid-column:1;font-family:var(--f-mono);font-size:.58rem;color:var(--muted);padding-top:.9rem;line-height:1.2}
.tal{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.22rem;padding:.4rem .15rem .45rem;border-radius:8px;background:transparent;border:1px solid transparent;cursor:pointer;min-width:0}
.tal .ico{width:2.6rem;height:2.6rem;border-radius:9px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden}
.tal .ico svg{width:100%;height:100%}
.tal .nm{font-size:.66rem;line-height:1.15;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.tal .rk{position:absolute;top:2.25rem;right:calc(50% - 1.8rem);font-family:var(--f-mono);font-size:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 .2rem;font-variant-numeric:tabular-nums}
.tal.locked{opacity:.38}
.tal.part .ico{border-color:var(--ame)}
.tal.max .ico{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.tal.max .rk{color:var(--green);border-color:var(--green)}
.tal.sel{border-color:var(--cls);background:var(--sunk)}
.tal .rec{position:absolute;top:.3rem;left:calc(50% - 1.65rem);width:.5rem;height:.5rem;border-radius:50%;background:var(--gold)}
@keyframes ttblink{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--gold),0 0 16px var(--gold)}}
.tal.next .ico{animation:ttblink .8s ease-in-out 4}
@media (prefers-reduced-motion:reduce){.tal.next .ico{animation:none;box-shadow:0 0 0 3px var(--gold)}}
.arw{position:absolute;width:2px;background:var(--line);z-index:0;pointer-events:none;transform:translateX(-1px)}
.arw::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--line);border-bottom:0}
.arw.ok{background:var(--green)} .arw.ok::after{border-top-color:var(--green)}
.arw.h::after{left:auto;right:-6px;top:50%;bottom:auto;transform:translateY(-50%);border:5px solid transparent;border-left-color:var(--line);border-right:0}
.arw.h.ok::after{border-left-color:var(--green)}
.tt-tip{position:absolute;z-index:20;width:min(17rem,calc(100% - 1rem));background:var(--surface);border:1px solid var(--cls);border-radius:8px;padding:.6rem .75rem;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:.85rem;line-height:1.45;pointer-events:none}
.tt-tip h4{margin:0;font-size:.95rem}
.tt-tip .m{font-family:var(--f-mono);font-size:.66rem;color:var(--muted);margin:.1rem 0 .35rem}
.tt-tip p{margin:.25rem 0}
.tt-tip .no{color:var(--ember)}
.tt-detail{border-top:1px solid var(--line);padding:1rem;background:var(--bg)}
.tt-d-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center}
.tt-d-ico{width:3rem;height:3rem;border-radius:10px;border:2px solid var(--line);overflow:hidden;background:var(--surface)}
.tt-d-ico svg{width:100%;height:100%}
.tt-d-name{display:flex;flex-direction:column;min-width:0}
.tt-d-name b{font-size:1.05rem}
.tt-d-name span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.tt-d-btns{display:flex;gap:.4rem}
.tt-d-btns .btn{width:2.5rem;height:2.5rem;font-size:1.25rem;padding:0;line-height:1}
.tt-detail p{margin:.5rem 0 0;font-size:.95rem}
.tt-d-why{color:var(--ember)}
.tt-legend{margin:0;padding:.75rem 1rem .9rem;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}
.builds{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.6rem;margin:.8rem 0 1rem}
.sk-btn{display:grid;gap:.3rem;text-align:left;padding:.75rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;transition:border-color .12s ease,background .12s ease}
.sk-btn:hover{border-color:var(--cls)}
.sk-btn[aria-pressed="true"]{border:2px solid var(--cls);background:color-mix(in srgb,var(--cls) 10%,var(--surface));padding:calc(.75rem - 1px) calc(.85rem - 1px)}
.sk-btn b{font-family:var(--f-display);font-size:.98rem;line-height:1.25}
.sk-btn .sk-meta{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.sk-btn .pts{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.sk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.4rem 0 .9rem;padding:.5rem .7rem;border:1px solid var(--line);border-left:3px solid var(--cls);border-radius:8px;background:var(--surface)}
.sk-bar label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sk-bar select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem;max-width:100%;min-width:0}
.sk-kern{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.sk-kern .chip{cursor:default}
.tal.kern .rec{width:.7rem;height:.7rem;top:.2rem;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--gold)}

.order{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.45rem;margin:1rem 0}
.ord{text-align:left;cursor:pointer;overflow-wrap:anywhere;hyphens:auto;display:grid;grid-template-columns:3.4rem 1.8rem minmax(0,1fr);gap:.45rem;align-items:center;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.88rem}
.ord .ico{width:1.8rem;height:1.8rem;border-radius:6px;overflow:hidden}
.ord .ico svg{width:100%;height:100%}
.ord small{font-family:var(--f-mono);color:var(--muted);font-size:.68rem}

.src{columns:2 16rem;column-gap:2rem;font-size:.9rem}
footer.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);font-style:italic}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:24;display:none}
.scrim.on{display:block}
@media (min-width:861px){.scrim{display:none!important}}

.dl-stand{margin:.2rem 0 0;font-size:.85rem;color:var(--muted)}
.dl-neu{margin:.3rem 0 .4rem;font-size:.88rem}
.dl-neu summary{cursor:pointer;color:var(--ame,#b266ff);font-weight:600}
.dl-neu ul{margin:.4rem 0 .3rem 1rem;padding:0}
.dl-neu li{margin:.2rem 0}
.linkbtn{background:none;border:0;padding:0;color:var(--ame,#b266ff);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem}
.neu-eintrag{border-left:3px solid color-mix(in srgb,var(--ame,#b266ff) 45%,transparent);padding:.35rem 0 .35rem .8rem;margin:.6rem 0}

.neu-kopf{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.neu-kopf span{color:var(--muted);font-size:.85rem}
.neu-eintrag ul{margin:.3rem 0 0 1rem;padding:0}

.nav-g{margin:.15rem 0}
.nav-gk{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;border:0;background:none;padding:.5rem .6rem;border-radius:8px;cursor:pointer;font-size:1.12rem;color:var(--ink);font-weight:600}
.nav-gk:hover{background:var(--sunk)}
.nav-gk > svg:first-child{width:1.7rem;height:1.7rem;flex:0 0 auto}
.nav-gk .pfeil{width:.9rem;height:.9rem;margin-left:auto;color:var(--muted);transition:transform .15s ease}
.nav-g.auf > .nav-gk .pfeil{transform:rotate(90deg)}
.nav-g.akt > .nav-gk{color:var(--gold)}
.nav-gi{display:none;margin:.1rem 0 .35rem .9rem;padding-left:.55rem;border-left:1px solid var(--line)}
.nav-g.auf > .nav-gi{display:block}
.nav-u{font-size:1rem;padding:.36rem .55rem}
.nav-u svg{width:1.35rem;height:1.35rem}
.nav-gi .nav-sub{margin:.1rem 0 .3rem .4rem}
@media (prefers-reduced-motion:reduce){.nav-gk .pfeil{transition:none}}

sische Tank und starke Nahkämpfer.", "einleitung": ["Der Krieger ist ein reiner Nahkämpfer in schwerer Rüstung. Statt Mana hat er Wut: Sie steigt, wenn du zuschlägst oder getroffen wirst, und sinkt außerhalb des Kampfes wieder. Mit Wut bezahlst du deine Angriffe.", "Du wechselst zwischen drei Haltungen (Kampf-, Verteidigungs- und Berserkerhaltung), die jeweils andere Fähigkeiten freischalten. Der Krieger kann tanken oder viel Schaden machen, ist beim Leveln aber stark von seiner Waffe abhängig und kann sich kaum selbst heilen – in Forever hilft dabei die neue Fähigkeit Siegesrausch."], "staerken": ["Bester Tank für Dungeons und Raids, viele Tank-Talente", "Sehr hoher Schaden mit guter Ausrüstung, starker Flächenschaden (Wirbelwind, Weitreichende Stöße, Spalten)", "Kann alle Waffen außer Zauberstäben tragen, ab Stufe 40 Platte", "Schlachtruf wirkt in Forever auf den ganzen Schlachtzug", "Starke Notfall-Fähigkeiten: Drohruf, Gegenschlag, Schildwall"], "schwaechen": ["Kaum Selbstheilung (nur Siegesrausch, Talente und Verbände)", "Wenig Kontrolle über Gegner", "Stark abhängig von der Waffe und von Ausrüstung", "Schwer gegen höherstufige Gegner; Kämpfe beginnen mit 0 Wut", "In Forever ist die Wuterzeugung laut Warcraft Tavern deutlich niedriger als in Classic (Beta-Stand)"], "forever_neu": ["Wut aus verursachtem Schaden ist auf das Waffentempo normalisiert (nicht mehr vom Waffenschaden abhängig); kritische Treffer erzeugen 100 % mehr Wut (Beta-Build 70205).", "Rüstung und Absorption verringern die Wut aus erlittenem Schaden nicht mehr; Blocken, Ausweichen und Parieren können über Talente Wut erzeugen.", "Neue Grundfähigkeit Siegesrausch* (Stufe 20): Sofortangriff nach einem Kill, heilt 10 % der maximalen Gesundheit, 30 Sek. Abklingzeit.", "Taktiker ist jetzt eine Grundfähigkeit ab Stufe 14 (10 Wut bleiben beim Haltungswechsel erhalten); Berserkerwut schon ab Stufe 30 statt 32.", "Donnerknall skaliert stärker mit Angriffskraft, ist auch in Verteidigungshaltung nutzbar und hat 6 Sek. Abklingzeit; Zerschmettern wird nicht mehr durch Zauberrückstoß verzögert.", "Tollkühnheit, Schildwall und Gegenschlag teilen sich keine Abklingzeit mehr (Schildwall und Gegenschlag je 15 Min.).", "Schlachtruf gibt weniger Angriffskraft, wirkt aber auf den ganzen Schlachtzug.", "Talente stark umgebaut: Waffenmeister* ersetzt die vier Waffenspezialisierungen; neu sind u. a. Aufspießender Stoß*, Rausch des Blutes*, Anhaltende Wut*, Wütende Präzision*, Wütende Schläge*, Bluttrinker*, Meister der Verteidigung*, Frontkämpfer*, Fokussierte Wut* und Bastion*.", "Neue Talentstufe bei 16 Punkten (Aufspießender Stoß*, Wütende Schläge*, Frontkämpfer*); Schlaghagel benötigt jetzt Todeswunsch, Blutdurst heilt nicht mehr und gibt stattdessen Lauftempo.", "Doppelte Talentspezialisierung ab Stufe 40; Legacy-Punkte (‚Talented‘) können Talente bis zu 5 Stufen früher freischalten.", "Neue Klassenquest-Belohnungen: Wirbelwindschwert* und Wirbelwindkriegshammer* zusätzlich zur Wirbelwindaxt."], "voelker": [{"volk": "Orc", "fraktion": "Horde", "bewertung": "sehr gut", "warum": "Kochendes Blut: +10 % Angriffskraft für 15 Sek. (3 Min. Abklingzeit); Wildheit*: +1 % kritische Trefferchance mit jeder Waffe; Zähigkeit: Betäubungen 20 % kürzer."}, {"volk": "Mensch", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Gnadenlos*: +2 % kritische Trefferchance mit jeder Waffe; Überlebenswille* entfernt Betäubungen."}, {"volk": "Zwerg", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Steingestalt: immun gegen Blutungen, Gifte und Krankheiten und weniger körperlicher Schaden für 8 Sek. – stark zum Tanken; Erdzorn*: +2 % kritischer Schaden."}, {"volk": "Tauren", "fraktion": "Horde", "bewertung": "gut", "warum": "Durchhaltevermögen: +5 % Gesundheit und +2 % kritischer Schaden; Kriegsdonner betäubt bis zu 5 Gegner für 2 Sek. – gut zum Tanken."}, {"volk": "Troll", "fraktion": "Horde", "bewertung": "gut", "warum": "Berserker: +10 % Angriffstempo für 10 Sek.; Regeneration (20 % im Kampf) und Rasche Regeneration helfen beim Leveln."}, {"volk": "Untoter", "fraktion": "Horde", "bewertung": "gut", "warum": "Wille der Verlassenen entfernt Furcht, Bezauberung und Schlaf; Berührung des Grabes entzieht bei Kriegern mit 20 % Chance Leben (25 Sek. interne Abklingzeit)."}, {"volk": "Nachtelf", "fraktion": "Allianz", "bewertung": "gut", "warum": "Elunes Licht*: +10 % kritische Trefferchance für 15 Sek.; Schattenmimik kann Bedrohung abwerfen; Flinkheit: +1 % Ausweichen."}, {"volk": "Gnom", "fraktion": "Allianz", "bewertung": "möglich", "warum": "Heureka!*: 8 Sek. lang 10 % weniger Wutkosten und 10 % mehr Schaden; Wacher Geist: +5 % maximale Wut; Entfesselungskünstler gegen Verlangsamungen."}, {"volk": "Himmelsgeborene* (Hoher Orden / Windformer)", "fraktion": "beide", "bewertung": "möglich", "warum": "Windgesegnet*: +3 % Nahkampftempo (seit Beta-Änderung vom 15.10.2026, vorher 1 %); sonst vor allem Komfort (Luftwandeln*)."}], "specs": [{"name": "Waffen", "rolle": "Nahkampf-Schaden", "beschreibung": "Große Zweihandwaffe, Verwunden und Überwältigen, später Tödlicher Stoß. Wenige, kräftige Schläge – gut für Anfänger.", "leveln": "empfohlen", "endspiel": "Schaden in Dungeons; Tödlicher Stoß senkt die Heilung des Ziels um 50 % und ist besonders im PvP stark."}, {"name": "Furor", "rolle": "Nahkampf-Schaden", "beschreibung": "Zwei Einhandwaffen, viele kritische Treffer, Schlaghagel und Blutdurst. Schneller und wutintensiver, braucht gute Ausrüstung.", "leveln": "gut", "endspiel": "Schadens-Spezialisierung für Dungeons und Raids mit zwei Einhandwaffen (Todeswunsch, Blutdurst, Wirbelwind)."}, {"name": "Schutz", "rolle": "Tank", "beschreibung": "Einhandwaffe und Schild, hält Gegner mit Bedrohung bei sich. In Forever erzeugen Blocken, Ausweichen und Parieren Wut.", "leveln": "gut", "endspiel": "Haupttank in Dungeons und Raids (Schildschlag, Trotz, Rüstung zerreißen)."}], "leveling_spec": "Waffen", "talente": {"baeume": [{"id": "arms", "name": "Waffen", "en": "Arms", "talente": [{"id": "arms_1", "name": "Verbesserter Heldenhafter Stoß", "en": "Improved Heroic Strike", "reihe": 1, "spalte": 1, "max": 3, "vor": null, "text": "Senkt die Wutkosten von Heldenhafter Stoß um 1/2/3."}, {"id": "arms_2", "name": "Abwehr", "en": "Deflection", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Erhöht deine Parierchance um 1/2/3/4/5 %."}, {"id": "arms_3", "name": "Verbessertes Verwunden", "en": "Improved Rend", "reihe": 1, "spalte": 3, "max": 3, "vor": null, "text": "Erhöht den Blutungsschaden von Verwunden um 12/24/36 %."}, {"id": "arms_4", "name": "Verbesserter Sturmangriff", "en": "Improved Charge", "reihe": 2, "spalte": 1, "max": 2, "vor": null, "text": "Sturmangriff erzeugt 3/6 zusätzliche Wut."}, {"id": "arms_5", "name": "Verbesserter Taktiker*", "en": "Improved Tactical Mastery", "reihe": 2, "spalte": 2, "max": 5, "vor": null, "text": "Beim Haltungswechsel behältst du zusätzlich bis zu 3/6/9/12/15 Wut (zusätzlich zu den 10 Wut der Grundfähigkeit Taktiker)."}, {"id": "arms_6", "name": "Verbessertes Überwältigen", "en": "Improved Overpower", "reihe": 2, "spalte": 4, "max": 2, "vor": null, "text": "Erhöht die kritische Trefferchance von Überwältigen um 25/50 %."}, {"id": "arms_7", "name": "Aggressionskontrolle", "en": "Anger Management", "reihe": 3, "spalte": 2, "max": 1, "vor": "arms_5", "text": "Erzeugt im Kampf alle 3 Sek. 1 Wut und verringert den Wutverlust außerhalb des Kampfes um 30 %."}, {"id": "arms_8", "name": "Tiefe Wunden", "en": "Deep Wounds", "reihe": 3, "spalte": 3, "max": 3, "vor": "arms_3", "text": "Deine kritischen Treffer lösen eine Blutung aus, die über 12 Sek. 20/40/60 % deines durchschnittlichen Waffenschadens verursacht."}, {"id": "arms_9", "name": "Aufspießender Stoß*", "en": "Spearing Strike", "reihe": 4, "spalte": 1, "max": 1, "vor": null, "text": "Neue Forever-Fähigkeit: Sofortangriff mit 40 % Waffenschaden, gegen Riesen, Drachkin und berittene Ziele 80 % mehr Schaden; berittene Ziele werden vom Reittier geworfen. Laut MMONerds 15 Wut, 20 Sek. Abklingzeit, nur in Kampfhaltung (vorläufig)."}, {"id": "arms_10", "name": "Zweihandwaffen-Spezialisierung", "en": "Two-Handed Weapon Specialization", "reihe": 4, "spalte": 2, "max": 3, "vor": null, "text": "Erhöht den Schaden mit Zweihand-Nahkampfwaffen um 1/2/3 %."}, {"id": "arms_11", "name": "Durchbohren", "en": "Impale", "reihe": 4, "spalte": 3, "max": 2, "vor": "arms_8", "text": "Erhöht den kritischen Schadensbonus deiner Fähigkeiten um 10/20 %."}, {"id": "arms_12", "name": "Rausch des Blutes*", "en": "Bloodthrill", "reihe": 5, "spalte": 1, "max": 5, "vor": null, "text": "Neu in Forever: Nahkampfangriffe gegen Ziele mit Verwunden haben eine Chance, Überwältigen für 6 Sek. (1 Einsatz) freizuschalten. Die Chance pro Rang ist in den Quellen uneinheitlich (2 % bzw. 4 % je Rang, maximal 10–20 %; vorläufig)."}, {"id": "arms_13", "name": "Weitreichende Stöße", "en": "Sweeping Strikes", "reihe": 5, "spalte": 2, "max": 1, "vor": null, "text": "Deine nächsten 5 Nahkampfangriffe treffen zusätzlich einen weiteren Gegner in der Nähe."}, {"id": "arms_14", "name": "Waffenmeister*", "en": "Weaponmaster", "reihe": 5, "spalte": 3, "max": 5, "vor": null, "text": "Neu in Forever, ersetzt die vier Waffenspezialisierungen. Je nach Waffe: Äxte/Stangenwaffen +1/2/3/4/5 % kritische Trefferchance; Streitkolben/Stäbe ignorieren 3/6/9/12/15 % Rüstung des Ziels; Schwerter 1–5 % Chance auf einen Extraangriff."}, {"id": "arms_15", "name": "Verbessertes Zerschmettern", "en": "Improved Slam", "reihe": 6, "spalte": 1, "max": 2, "vor": null, "text": "Verkürzt globale Abklingzeit und Zauberzeit von Zerschmettern um 0,25/0,5 Sek.; Zerschmettern setzt deinen Schwungtimer nicht mehr zurück. Laut zwei Quellen zusätzlich −3 Sek. Abklingzeit (vorläufig)."}, {"id": "arms_16", "name": "Verbesserte Kniesehne", "en": "Improved Hamstring", "reihe": 6, "spalte": 3, "max": 3, "vor": null, "text": "Kniesehne hat eine Chance von 5/10/15 %, das Ziel 5 Sek. lang bewegungsunfähig zu machen."}, {"id": "arms_17", "name": "Tödlicher Stoß", "en": "Mortal Strike", "reihe": 7, "spalte": 2, "max": 1, "vor": "arms_13", "text": "Sofortangriff: Waffenschaden plus 85 und verringert die Heilung auf dem Ziel 10 Sek. lang um 50 %."}]}, {"id": "fury", "name": "Furor", "en": "Fury", "talente": [{"id": "fury_1", "name": "Donnernde Stimme", "en": "Booming Voice", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Vergrößert den Wirkungsbereich deiner Rufe um 10/20/30/40/50 % und senkt ihre Wutkosten um 5/10/15/20/25 %."}, {"id": "fury_2", "name": "Grausamkeit", "en": "Cruelty", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht deine kritische Trefferchance im Nahkampf um 1/2/3/4/5 %."}, {"id": "fury_3", "name": "Anhaltende Wut*", "en": "Lingering Rage", "reihe": 2, "spalte": 2, "max": 5, "vor": null, "text": "Neu in Forever: Nach dem Kampf beginnt deine Wut erst 2/4/6/8/10 Sek. später zu verfallen."}, {"id": "fury_4", "name": "Entfesselter Zorn", "en": "Unbridled Wrath", "reihe": 2, "spalte": 3, "max": 5, "vor": null, "text": "Nahkampf-Waffenschaden hat eine Chance von 12/24/36/48/60 %, 1 zusätzliche Wut zu erzeugen. Verdoppelt die Wut mit Zweihandwaffen nicht mehr."}, {"id": "fury_5", "name": "Wütende Präzision*", "en": "Furious Precision", "reihe": 3, "spalte": 1, "max": 3, "vor": null, "text": "Neu in Forever: Erhöht die Trefferchance deiner Schildhand-Waffe um 4/7/10 %."}, {"id": "fury_6", "name": "Durchdringendes Heulen", "en": "Piercing Howl", "reihe": 3, "spalte": 2, "max": 1, "vor": null, "text": "Gegner im Umkreis von 10 Metern werden benommen: Bewegungstempo 6 Sek. lang um 50 % verringert."}, {"id": "fury_7", "name": "Blutwahnsinn", "en": "Blood Craze", "reihe": 3, "spalte": 3, "max": 3, "vor": null, "text": "Nach einem kritischen Treffer oder einem einzelnen Treffer über 20 % deiner maximalen Gesundheit regenerierst du über 6 Sek. 1/2/3 % deiner maximalen Gesundheit. Wird nicht mehr von Blutdurst ausgelöst."}, {"id": "fury_8", "name": "Beidhändigkeits-Spezialisierung", "en": "Dual Wield Specialization", "reihe": 4, "spalte": 1, "max": 5, "vor": null, "text": "Erhöht den Schaden deiner Schildhand-Waffe um 5/10/15/20/25 %, und Schildhand-Angriffe erzeugen mehr Wut (genauer Wert in den Quellen uneinheitlich, vorläufig). Gibt keine Trefferchance mehr."}, {"id": "fury_9", "name": "Wütende Schläge*", "en": "Raging Blows", "reihe": 4, "spalte": 2, "max": 1, "vor": null, "text": "Neu in Forever: Senkt die Wutkosten von Spalten und Wirbelwind um 3."}, {"id": "fury_10", "name": "Wutanfall", "en": "Enrage", "reihe": 4, "spalte": 3, "max": 5, "vor": null, "text": "Wenn du von einem schadensverursachenden Angriff getroffen wirst, hast du eine Chance von 30 %, 12 Sek. lang 2/4/6/8/10 % mehr körperlichen Schaden zu verursachen."}, {"id": "fury_11", "name": "Verbessertes Hinrichten", "en": "Improved Execute", "reihe": 4, "spalte": 4, "max": 2, "vor": null, "text": "Senkt die Wutkosten von Hinrichten (Rang 1: −3 Wut; Wert für Rang 2 noch nicht bekannt)."}, {"id": "fury_12", "name": "Verbesserte Berserkerwut", "en": "Improved Berserker Rage", "reihe": 5, "spalte": 1, "max": 2, "vor": null, "text": "Berserkerwut erzeugt sofort 5/10 Wut und hat eine Chance von 50/100 %, bewegungseinschränkende Effekte zu entfernen."}, {"id": "fury_13", "name": "Todeswunsch", "en": "Death Wish", "reihe": 5, "spalte": 2, "max": 1, "vor": null, "text": "30 Sek. lang +20 % körperlicher Schaden und Immunität gegen Furcht, aber du erleidest 5 % mehr Schaden."}, {"id": "fury_14", "name": "Verbessertes Abfangen", "en": "Improved Intercept", "reihe": 5, "spalte": 4, "max": 2, "vor": null, "text": "Verringert die Abklingzeit von Abfangen um 5/10 Sek."}, {"id": "fury_15", "name": "Schlaghagel", "en": "Flurry", "reihe": 6, "spalte": 2, "max": 5, "vor": "fury_13", "text": "Nach einem kritischen Nahkampftreffer ist dein Angriffstempo für die nächsten 3 Schwünge um 5/10/15/20/25 % erhöht. Benötigt in Forever Todeswunsch (statt Wut rit und Wut.", "Alternative: Viele Guides (Method, ConquestCapped) empfehlen Schutz mit Einhandwaffe und Schild zum Solo-Leveln ab etwa Stufe 16 – sicherer, aber langsamer. Ab Stufe 40 gibt es eine zweite Talentverteilung (Dual-Spec), dann kann man Schaden und Tank parallel haben.", "Wer Legacy-Punkte in ‚Talented‘ hat, bekommt Talente bis zu 5 Stufen früher.", "Die Spalten-Positionen sind teils aus Talentrechner-Links (wowforevertalent.com) und den Pfeil-Voraussetzungen abgeleitet; Reihen, Ränge und Voraussetzungen stammen aus mehreren Talentrechnern (Beta-Stand, kann sich bis zum Start ändern).", "Mit * markierte Namen sind neue Forever-Inhalte ohne gesicherte offizielle deutsche Übersetzung."], "faehigkeiten": [{"name": "Kampfhaltung", "en": "Battle Stance", "stufe": 1, "art": "Haltung", "text": "Ausgewogene Grundhaltung ohne Bonus. Nötig für Sturmangriff und Überwältigen – deine Haltung zum Leveln.", "wichtig": true}, {"name": "Heldenhafter Stoß", "en": "Heroic Strike", "stufe": 1, "art": "Angriff", "text": "Ersetzt deinen nächsten Schlag durch einen stärkeren mit hoher Bedrohung. Nutze ihn, wenn du überschüssige Wut hast.", "wichtig": true}, {"name": "Schlachtruf", "en": "Battle Shout", "stufe": 1, "art": "Buff", "text": "Erhöht die Angriffskraft deiner Gruppe; wirkt in Forever auf den ganzen Schlachtzug. Immer aktiv halten.", "wichtig": true}, {"name": "Sturmangriff", "en": "Charge", "stufe": 4, "art": "Bewegung", "text": "Stürmt außerhalb des Kampfes auf ein Ziel zu, erzeugt Wut und betäubt es kurz. Eröffne damit jeden Kampf.", "wichtig": true}, {"name": "Verwunden", "en": "Rend", "stufe": 4, "art": "Angriff", "text": "Lässt das Ziel über Zeit bluten. Zu Kampfbeginn einsetzen, wenn der Gegner lange genug lebt; mit Rausch des Blutes* schaltet es Überwältigen frei.", "wichtig": true}, {"name": "Donnerknall", "en": "Thunder Clap", "stufe": 6, "art": "Angriff", "text": "Schadet bis zu vier Gegnern in der Nähe und verlangsamt ihr Angriffstempo. In Forever auch in ehr stark.", "wichtig": true}, {"name": "Herausforderungsruf", "en": "Challenging Shout", "stufe": 26, "art": "Schutz", "text": "Zwingt alle Gegner in der Nähe kurz, dich anzugreifen. Notfall für Tanks.", "wichtig": false}, {"name": "Schildwall", "en": "Shield Wall", "stufe": 28, "art": "Schutz", "text": "Verringert erlittenen Schaden 12 Sek. lang um 60 %. Großer Notfall-Knopf; 15 Min. Abklingzeit.", "wichtig": true}, {"name": "Berserkerhaltung", "en": "Berserker Stance", "stufe": 30, "art": "Haltung", "text": "Mehr kritische Trefferchance, aber mehr erlittener Schaden. Nötig für Wirbelwind; per Klassenquest.", "wichtig": true}, {"name": "Berserkerwut", "en": "Berserker Rage", "stufe": 30, "art": "Sonstiges", "text": "Immun gegen Furcht und Handlungsunfähigkeit, erzeugt mehr Wut durch erlittenen Schaden. Gegen Furcht und für Wut.", "wichtig": true}, {"name": "Abfangen", "en": "Intercept", "stufe": 30, "art": "Bewegung", "text": "Stürmt auch im Kampf auf ein Ziel zu und betäubt es kurz.", "wichtig": false}, {"name": "Wirbelwind", "en": "Whirlwind", "stufe": 36, "art": "Angriff", "text": "Trifft bis zu 4 Gegner in der Nähe mit beiden Waffen (nur in Berserkerhaltung). Starker Flächenangriff.", "wichtig": true}, {"name": "Zuschlagen", "en": "Pummel", "stufe": 38, "art": "Kontrolle", "text": "Unterbricht einen Zauber und sperrt die Zauberschule kurz. Unterbrechen ohne Schild.", "wichtig": true}, {"name": "Tollkühnheit", "en": "Recklessness", "stufe": 50, "art": "Buff", "text": "Stark erhöhte kritische Trefferchance und Furchtimmunität, aber mehr erlittener Schaden. Stärkste Schadens-Abklingzeit, bei Bossen nutzen.", "wichtig": false}, {"name": "Aufspießender Stoß*", "en": "Spearing Strike", "stufe": 25, "art": "Angriff", "text": "Talent (Waffen, 16 Punkte): Sofortangriff mit viel Zusatzschaden gegen Riesen, Drachkin und Berittene, wirft Reiter ab. Sehr situationsabhängig.", "wichtig": false}, {"name": "Weitreichende Stöße", "en": "Sweeping Strikes", "stufe": 30, "art": " le).", "Überwältigen sofort nutzen, sobald es aufleuchtet.", "Ab Stufe 40 Tödlicher Stoß auf Abklingzeit.", "Überschüssige Wut in Heldenhafter Stoß (oder Zerschmettern mit Verbessertes Zerschmettern) stecken.", "Nach jedem Kill Siegesrausch* für Heilung.", "Gegen Ende des Kampfes keine Wut mehr verschwenden – Wut für den nächsten Gegner aufheben."]}, {"titel": "Leveln: mehrere Gegner", "schritte": ["Demoralisierender Ruf und Donnerknall senken den Schaden der Gegner.", "Weitreichende Stöße und danach Wirbelwind (Berserkerhaltung) bzw. Spalten statt Heldenhafter Stoß.", "Wird es gefährlich: Drohruf, Gegenschlag oder Schildwall – diese Abklingzeiten nicht aufheben, sondern nutzen.", "Kniesehne gegen fliehende Gegner."]}, {"titel": "Dungeon/Raid: Schaden (Furor, Berserkerhaltung)", "schritte": ["Schlachtruf aktiv halten, Rüstung zerreißen auf 5 Stapel halten (falls kein Tank es tut).", "Hinrichten bei Zielen unter 20 % Gesundheit.", "Blutdurst auf Abklingzeit, danach Wirbelwind.", "Überschüssige Wut in Heldenhafter Stoß (ein Ziel) oder Spalten (mehrere Ziele).", "Todeswunsch, Tollkühnheit und Kochendes Blut/Berserker gemeinsam nutzen, am besten in der Hinrichten-Phase; Blutrausch und Berserkerwut für Wut.", "Laut Simulationen kann sich Haltungswechsel für Verwunden und Überwältigen lohnen (vorläufig)."]}, {"titel": "Dungeon/Raid: Tank (Schutz, Verteidigungshaltung)", "schritte": ["Mit Sturmangriff eröffnen (mit Frontkämpfer* direkt aus der Verteidigungshaltung).", "Schildblock auf Abklingzeit, Rache immer wenn verfügbar.", "Schildschlag auf Abklingzeit (ab Stufe 40).", "Rüstung zerreißen für Bedrohung; Donnerknall und Demoralisierender Ruf bei Gruppen.", "Überschüssige Wut in Heldenhafter Stoß; Schildhieb zum Unterbrechen.", "Spott, wenn ein Gegner einen Mitspieler angreift; Schildwall/Letztes Gefecht in Notfällen."]}], "werte": [{"phase": "1-29 Leveln", "reihenfolge": "Waffenschaden/DPS der Waffe > Stärke (Angriffskraft) > Ausdauer > Beweglichkeit > Rüstung"}, {"phase": "30-59 Leveln", "reihenfolge": "Waffenschaden > Stärke > Beweglichkeit > Ausdauer; als Schutz: Ausdauer > Stärke > Beweglichkeit"}, {"phase": "60 Raid (Schaden)", "reihenfolge": "Noch nicht endgültig bekannt (vorläufig): Waffenschaden > Trefferchance > kritische Trefferchance > Stärke > Beweglichkeit"}, {"phase": "60 Tank", "reihenfolge": "Noch nicht endgültig bekannt (vorläufig): Ausdauer > Verteidigung/Rüstung > Stärke > Beweglichkeit"}], "werte_info": [{"wert": "Waffenschaden", "stufe": "BiS 1", "warum": "Beim Leveln macht die Waffe laut Method etwa 95–100 % deines Schadens aus. Langsame, schwere Waffen stärken Sofortangriffe wie Tödlicher Stoß und Wirbelwind."}, {"wert": "Stärke", "stufe": "gut", "warum": "1 Stärke = 2 Angriffskraft; mehr Schaden und mehr Blockwert."}, {"wert": "Trefferchance", "stufe": "gut", "warum": "Im Endspiel sehr wertvoll, weil verfehlte Schläge Schaden und Wut kosten."}, {"wert": "Kritische Trefferchance", "stufe": "gut", "warum": "Kritische Treffer erzeugen in Forever 100 % mehr Wut und lösen Tiefe Wunden und Schlaghagel aus."}, {"wert": "Beweglichkeit", "stufe": "gut", "warum": "Etwas kritische Trefferchance, Ausweichen und Rüstung."}, {"wert": "Ausdauer", "stufe": "gut", "warum": "Mehr Gesundheit – für Tanks der wichtigste Wert, beim Leveln angenehm."}, {"wert": "Rüstung", "stufe": "gut", "warum": "Für Tanks wichtig; in Forever kostet Rüstung keine Wut mehr."}, {"wert": "Willenskraft", "stufe": "schwach", "warum": "Nur etwas Regeneration außerhalb des Kampfes, vor allem auf niedrigen Stufen."}, {"wert": "Intelligenz", "stufe": "nutzlos", "warum": "Krieger haben kein Mana."}], "ausruestung": {"leveln": [{"name": "Cruel Barb", "stufe": 17, "platz": "Einhand", "woher": "Dungeon: Die Todesminen, Edwin VanCleef (Allianz-Gebiet, Westfall)", "warum": "Starke Einhandwaffe für Schutz und Furor (Stufe 17–20)."}, {"name": "Wingblade", "stufe": 18, "platz": "Einhand", "woher": "Horde-Quest „Leaders of the Fang“, Höhlen des Wehklagens", "warum" ", "wo": "Kriegerlehrer im Startgebiet"}, {"stufe": "10", "was": "Klassenquest: Verteidigungshaltung, Spott und Rüstung zerreißen; dazu Blutrausch beim Lehrer und erster Talentpunkt", "wo": "Je nach Volk vom Kriegerlehrer, z. B. Mensch „Bartleby's Mug“, Zwerg Vejrek, Nachtelf Vorlus Vilehoof, Tauren „Path of Defense“, Untoter Ulag the Cleaver, Himmelsgeborene „The Skybreaker Bulwark“"}, {"stufe": "14", "was": "Taktiker (neu als Grundfähigkeit), Demoralisierender Ruf, Rache", "wo": "Kriegerlehrer"}, {"stufe": "20", "was": "Siegesrausch*, Spalten, Zerschmettern, Gegenschlag; Stangenwaffen und Beidhändigkeit lernbar; Klassenquest für eine Brustrüstung", "wo": "Kriegerlehrer; Stangenwaffen in Sturmwind (Woo Ping) bzw. Unterstadt (Archibald)"}, {"stufe": "30", "was": "Klassenquest Berserkerhaltung und Abfangen („The Affray“), danach Wirbelwindwaffe; Berserkerwut beim Lehrer", "wo": "Start beim Kriegerlehrer, Kampf auf Fray Island bei Ratschet (Brachland), dann Alterac-Gebirge (schwer auf 30 – Gruppe suchen)"}, {"stufe": "36", "was": "Wirbelwind", "wo": "Kriegerlehrer"}, {"stufe": "40", "was": "Plattenrüstung, Reiten (Lehrling), zweite Talentverteilung; Tödlicher Stoß / Blutdurst / Schildschlag möglich", "wo": "Kriegerlehrer und Reitlehrer deines Volkes"}, {"stufe": "50", "was": "Tollkühnheit", "wo": "Kriegerlehrer"}, {"stufe": "60", "was": "Maximalstufe: Pre-BiS in Schwarzfelsspitze, Stratholme, Scholomance und Düsterbruch sammeln", "wo": "Dungeons und Berufe"}], "gruppe": ["Als Tank: Mit Sturmangriff (Frontkämpfer*) oder Fernkampfschuss ziehen, dann Rüstung zerreißen, Rache und Schildblock; bei Gruppen Donnerknall und Demoralisierender Ruf.", "Als Tank Ziele markieren und Spott bereithalten; Trotz und Verteidigungshaltung sorgen für Bedrohung.", "Als Schadensmacher: Warte, bis der Tank genug Bedrohung hat, bevor du Vollgas gibst.", "Schlachtruf hilft der ganzen Gruppe (in Forever dem ganzen Schlachtzug), Rüstung zerreißen erhöht den körperlichen Schaden aller.", "Donner
