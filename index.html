nicht spielbar."}, {"name": "Gebrechen mit Dämonischer Opferung (Leveln/Solo, Icy Veins)", "punkte": "40/11/0", "verteilung": {"affliction_2": 4, "affliction_3": 5, "affliction_5": 5, "affliction_1": 2, "affliction_12": 2, "affliction_7": 2, "affliction_14": 1, "affliction_15": 3, "affliction_11": 5, "affliction_16": 5, "affliction_17": 1, "affliction_6": 3, "affliction_10": 2, "demonology_3": 5, "demonology_7": 3, "demonology_5": 2, "demonology_10": 1}, "hinweis": "Endstand der Icy-Veins-Reihenfolge: Teufelsjäger opfern (3 % Leben alle 4 Sek.), dazu Peinigung* und starke Entzüge. Sehr selbstständig, gut für die offene Welt und Farmen."}, {"name": "Voller Gebrechen-Baum (DoT-Raid, vorläufig)", "punkte": "49/2/0", "verteilung": {"affliction_1": 2, "affliction_2": 5, "affliction_3": 5, "affliction_4": 2, "affliction_5": 5, "affliction_6": 3, "affliction_7": 2, "affliction_8": 3, "affliction_9": 1, "affliction_10": 3, "affliction_11": 5, "affliction_12": 2, "affliction_13": 1, "affliction_14": 1, "affliction_15": 3, "affliction_16": 5, "affliction_17": 1, "demonology_4": 2}, "hinweis": "wow.gg beschreibt eine Verteilung mit 49 Punkten in Gebrechen (also alle Gebrechen-Talente). Die genannte Katastrophe liegt aber in Reihe 2 und ist mit 2 Punkten nicht erreichbar, deshalb hier 2 Punkte in Unheilige Macht. Vorläufig."}], "talent_hinweise": ["Icy Veins, Warcraft Tavern und Method empfehlen zum Leveln Gebrechen. Diese Reihenfolge geht bis Stufe 40 komplett in Gebrechen, danach ein paar nützliche Punkte in Dämonologie.", "Verbesserte Verderbnis zuerst: Mit 5/5 ist Verderbnis ein Sofortzauber, du kannst aus der Bewegung zaubern.", "Jede Reihe braucht 5 Punkte mehr im selben Baum. Deshalb kommt Verbesserter Aderlass vor Verbessertem Omen der Pein und Teufelskonzentration (Reihe 3), und vor Schattenbeherrschung (Reihe 6) steht ein Punkt in Bösartigkeit*.", "Alternative ab Stufe 30 (Warcraft Tavern): Entzugs-Tanken mit Verbesserten Entzügen*, Teufelskonzentration, Verbessertem Aderlass und Seelenabsaugung* – du nimmst Treffer selbst und heilst dich mit Blutsauger, der Dämon macht Schaden.", "Alternative von Icy Veins: Unterdrückung zuerst, ab 31 Dämonische Opferung (Teufelsjäger opfern) und Peinigung* erst auf 51 (siehe Endspiel-Build 40/11/0).", "Ab Stufe 40 kannst du laut Warcraft Tavern beim Lehrer eine zweite Talentverteilung freischalten und so ohne Neuverteilen zwischen Leveln und Gruppe wechseln.", "Die Beta ging nur bis Stufe 30. Alles ab Stufe 31 und die Endspiel-Builds sind vorläufig."], "faehigkeiten": [{"name": "Schattenblitz", "en": "Shadow Bolt", "stufe": 1, "art": "Angriff", "text": "Schattenschaden auf ein Ziel mit Zauberzeit. Am Anfang dein Hauptzauber, später vor allem bei Einbruch der Nacht (sofort).", "wichtig": true}, {"name": "Feuerbrand", "en": "Immolate", "stufe": 1, "art": "Angriff", "text": "Feuerschaden plus Feuerschaden über Zeit. Nur auf Gegner, die lange genug leben; für Zerstörung die Grundlage von Feuersbrunst.", "wichtig": true}, {"name": "Dämonenhaut", "en": "Demon Skin", "stufe": 1, "art": "Buff", "text": "Mehr Rüstung und Lebensregeneration. Immer aktiv halten, ab Stufe 20 durch Dämonenrüstung ersetzt.", "wichtig": false}, {"name": "Wichtel beschwören", "en": "Summon Imp", "stufe": 1, "art": "Begleiter", "text": "Ruft den Wichtel: Fernkampf-Feuerschaden und Blutpakt (mehr Ausdauer für die Gruppe). Kostet keinen Seelensplitter.", "wichtig": true}, {"name": "Verderbnis", "en": "Corruption", "stufe": 4, "art": "Angriff", "text": "Schattenschaden über Zeit. Mit Verbesserter Verderbnis sofort gewirkt, auf jeden Gegner setzen.", "wichtig": true}, {"name": "Fluch der Schwäche", "en": "Curse of Weakness", "stufe": 4, "art": "Kontrolle", "text": "Senkt die Angriffskraft des Ziels. Nützlich gegen starke Nahkämpfer, wenn kein anderer Fluch nötig ist.", "wichtig": false}, {"name": "Aderlass", "en": "Life Tap", "stufe": 6, "art": "Sonstiges", "text": "Wandelt Leben in Mana um; in Forever stärker mit Willenskraft. Nutzen, wenn du viel Leben und wenig Mana hast.", "wichtig": true}, {"name": "Omen der Pein", "en": "Bane of Agony", "stufe": 8, "art": "Angriff", "text": "Schatten-DoT, der langsam anfängt und stärker wird. Gut zum Anlocken. Ein Omen und ein Fluch dürfen gleichzeitig auf dem Ziel sein.", "wichtig": true}, {"name": "Furcht", "en": "Fear", "stufe": 8, "art": "Kontrolle", "text": "Lässt einen Gegner bis zu 20 Sek. fliehen. Gegen einen zweiten Gegner nutzen; Untote und Maschinen sind oft immun.", "wichtig": true}, {"name": "Seelendieb", "en": "Drain Soul", "stufe": 10, "art": "Angriff", "text": "Kanalisierter Schattenschaden. Stirbt das Ziel dabei, bekommst du einen Seelensplitter; in Forever steigende Chance pro Tick.", "wichtig": true}, {"name": "Gesundheitsstein herstellen", "en": "Create Healthstone", "stufe": 10, "art": "Heilung", "text": "Erzeugt einen Gesundheitsstein (1 Seelensplitter). Vor jedem Dungeon an alle verteilen.", "wichtig": true}, {"name": "Leerwandler beschwören", "en": "Summon Voidwalker", "stufe": 10, "art": "Begleiter", "text": "Ruft den Leerwandler (Klassenquest), einen Tank-Dämon. Sicherste Wahl allein gegen mehrere oder harte Gegner.", "wichtig": true}, {"name": "Lebenslinie", "en": "Health Funnel", "stufe": 12, "art": "Heilung", "text": "Überträgt dein Leben auf deinen Dämon. Wenn der Dämon fast stirbt und eine Neubeschwörung teurer wäre.", "wichtig": false}, {"name": "Blutsauger", "en": "Drain Life", "stufe": 14, "art": "Angriff", "text": "Kanalisiert: Schaden am Ziel und heilt dich um denselben Wert. Nutzen, wenn du viel Mana, aber wenig Leben hast.", "wichtig": true}, {"name": "Fluch der Tollkühnheit", "en": "Curse of Recklessness", "stufe": 14, "art": "Kontrolle", "text": "Senkt die Rüstung des Ziels (gut für Nahkampf-Gruppen), es kann aber nicht mehr fliehen.", "wichtig": false}, {"name": "Unendlicher Atem", "en": "Unending Breath", "stufe": 16, "art": "Buff", "text": "Lange Unterwasseratmung für ein Gruppenmitglied. Vor Unterwasser-Quests auf alle wirken.", "wichtig": false}, {"name": "Seelenstein herstellen", "en": "Create Soulstone", "stufe": 18, "art": "Heilung", "text": "Seelenstein auf einen Verbündeten: Stirbt er, kann er sich wiederbeleben. Allein auf dich, in der Gruppe auf den Heiler.", "wichtig": true}, {"name": "Sengender Schmerz", "en": "Searing Pain", "stufe": 18, "art": "Angriff", "text": "Schneller Feuerzauber mit viel Bedrohung. Eher für Zerstörung oder zum Abschließen.", "wichtig": false}, {"name": "Dämonenrüstung", "en": "Demon Armor", "stufe": 20, "art": "Buff", "text": "Ersetzt Dämonenhaut: mehr Rüstung, Schattenwiderstand und Lebensregeneration. Immer aktiv halten.", "wichtig": true}, {"name": "Sukkubus / Inkubus beschwören", "en": "Summon Succubus / Incubus", "stufe": 20, "art": "Begleiter", "text": "Klassenquest. Starker Nahkampfschaden, Verführung gegen Humanoide. Beide haben dieselben Fähigkeiten.", "wichtig": true}, {"name": "Ritual der Beschwörung", "en": "Ritual of Summoning", "stufe": 20, "art": "Sonstiges", "text": "Holt einen Mitspieler zu dir; zwei weitere Spieler klicken das Portal an. In Forever der einzige Weg, Mitspieler zu beschwören.", "wichtig": true}, {"name": "Feuerregen", "en": "Rain of Fire", "stufe": 20, "art": "Angriff", "text": "Kanalisierter Flächen-Feuerschaden. Für gesammelte Gegnergruppen im Dungeon.", "wichtig": false}, {"name": "Fluch der Elemente", "en": "Curse of the Elements", "stufe": 20, "art": "Kontrolle", "text": "Das Ziel erleidet mehr Magieschaden aller Schulen (in Forever ersetzt er auch den entfernten Fluch der Schatten). Bei Bossen Standard-Fluch.", "wichtig": true}, {"name": "Auge von Kilrogg", "en": "Eye of Kilrogg", "stufe": 22, "art": "Sonstiges", "text": "Ein steuerbares Auge zum Auskundschaften.", "wichtig": false}, {"name": "Dämonen spüren", "en": "Sense Demons", "stufe": 24, "art": "Sonstiges", "text": "Zeigt Dämonen in der Nähe auf der Minikarte.", "wichtig": false}, {"name": "Mana entziehen", "en": "Drain Mana", "stufe": 24, "art": "Angriff", "text": "Entzieht dem Ziel Mana und gibt es dir. Stufe wie im alten Classic (vorläufig).", "wichtig": false}, {"name": "Unsichtbarkeit entdecken", "en": "Detect Invisibility", "stufe": 26, "art": "Buff", "text": "Lässt ein Gruppenmitglied unsichtbare Gegner sehen.", "wichtig": false}, {"name": "Fluch der Sprachen", "en": "Curse of Tongues", "stufe": 26, "art": "Kontrolle", "text": "Verlangsamt das Zaubern des Ziels. Gegen gegnerische Zauberer. Stufe wie im alten Classic (vorläufig).", "wichtig": false}, {"name": "Verbannen", "en": "Banish", "stufe": 28, "art": "Kontrolle", "text": "Schaltet einen Dämon oder Elementar aus dem Kampf aus. Wichtige Gruppenkontrolle im Dungeon.", "wichtig": true}, {"name": "Feuerstein herstellen", "en": "Create Firestone", "stufe": 28, "art": "Buff", "text": "In Forever ein Waffen-Öl mit Feuerschaden und Zauberkrit, eher für Zerstörung.", "wichtig": false}, {"name": "Teufelsjäger beschwören", "en": "Summon Felhunter", "stufe": 30, "art": "Begleiter", "text": "Klassenquest. Teufelsjäger frisst Magie und kann ab 36 mit Zaubersperre unterbrechen. Gut gegen Zauberer.", "wichtig": true}, {"name": "Dämon unterwerfen", "en": "Subjugate Demon", "stufe": 30, "art": "Kontrolle", "text": "Bringt einen Dämon für eine Zeit unter deine Kontrolle (früher Dämonensklave).", "wichtig": false}, {"name": "Höllenfeuer", "en": "Hellfire", "stufe": 30, "art": "Angriff", "text": "Flächenschaden um dich herum, schadet auch dir selbst. Nur in organisierten Gruppen-Pulls.", "wichtig": false}, {"name": "Schattenzauberschutz", "en": "Shadow Ward", "stufe": 32, "art": "Schutz", "text": "Absorbiert Schattenschaden. Gegen Schattenzauberer und Bosse mit Schattenschaden.", "wichtig": false}, {"name": "Zauberstein herstellen", "en": "Create Spellstone", "stufe": 36, "art": "Buff", "text": "In Forever ein Waffen-Öl mit Schattenschaden und Tempo, das beste Öl für Gebrechen.", "wichtig": true}, {"name": "Teufelsross beschwören", "en": "Summon Felsteed", "stufe": 40, "art": "Bewegung", "text": "Klassenquest: dein eigenes Reittier, ohne Reittier zu kaufen.", "wichtig": true}, {"name": "Schreckensgeheul", "en": "Howl of Terror", "stufe": 40, "art": "Kontrolle", "text": "Lässt mehrere Gegner um dich herum fliehen. Notfall, wenn zu viele Gegner bei dir sind.", "wichtig": false}, {"name": "Todesmantel", "en": "Death Coil", "stufe": 42, "art": "Kontrolle", "text": "Sofortiger Schattenschaden, heilt dich und lässt das Ziel 3 Sek. fliehen. Notfallknopf.", "wichtig": true}, {"name": "Seelenfeuer", "en": "Soul Fire", "stufe": 48, "art": "Angriff", "text": "Sehr starker, langsamer Feuerzauber gegen einen Seelensplitter. Zum Eröffnen oder mit Dezimierung.", "wichtig": false}, {"name": "Inferno", "en": "Inferno", "stufe": 50, "art": "Begleiter", "text": "Ruft eine Höllenbestie vom Himmel, die kämpft und Gegner betäubt. Kostet Reagenzien.", "wichtig": false}, {"name": "Ritual der Verdammnis", "en": "Ritual of Doom", "stufe": 60, "art": "Begleiter", "text": "Ruft mit Hilfe der Gruppe eine Verdammniswache. Selten gebraucht.", "wichtig": false}, {"name": "Omen der Verdammnis", "en": "Bane of Doom", "stufe": 60, "art": "Angriff", "text": "Sehr starker Schatten-DoT nach langer Zeit. Nur auf Bossen. Stufe wie im alten Classic (vorläufig).", "wichtig": false}, {"name": "Portal der Beschwörung", "en": "Portal of Summoning", "stufe": 60, "art": "Sonstiges", "text": "Neuer Beschwörungszauber auf Stufe 60 (laut Talentrechner). Details noch nicht bekannt.", "wichtig": false}, {"name": "Lebensentzug (Talent)", "en": "Siphon Life", "stufe": 30, "art": "Angriff", "text": "Gebrechen-Talent: Schattenschaden über Zeit, der dich heilt. Auf jeden zähen Gegner setzen.", "wichtig": true}, {"name": "Peinigung* (Talent)", "en": "Wrack", "stufe": 40, "art": "Angriff", "text": "Gebrechen-Abschlusstalent: 6-Sek.-Kanal, verstärkt deine anderen Schatten-DoTs um 10 %. Füllzauber am Boss.", "wichtig": true}, {"name": "Schattenbrand (Talent)", "en": "Shadowburn", "stufe": 24, "art": "Angriff", "text": "Zerstörungs-Talent: sofortiger Schattenschaden, gibt einen Splitter, wenn das Ziel stirbt.", "wichtig": false}, {"name": "Feuersbrunst (Talent)", "en": "Conflagrate", "stufe": 32, "art": "Angriff", "text": "Zerstörungs-Talent: verbraucht deinen Feuerbrand für sofortigen Feuerschaden.", "wichtig": false}, {"name": "Verbrennen (Talent)", "en": "Incinerate", "stufe": 50, "art": "Angriff", "text": "Zerstörungs-Abschlusstalent: Feuer-Füllzauber, stärker gegen Ziele mit Feuerbrand.", "wichtig": false}], "rotation": [{"titel": "Leveln: ein Gegner", "schritte": ["Dämon losschicken, damit er die Aufmerksamkeit des Gegners bekommt.", "Mit Omen der Pein anlocken (startet schwach, der Gegner bleibt beim Dämon).", "Verderbnis drauf, ab Stufe 30 Lebensentzug bei zähen Gegnern.", "Feuerbrand nur, wenn der Gegner lange genug lebt.", "Bis ca. Stufe 29 mit dem Zauberstab beenden, danach Blutsauger, wenn dir Leben fehlt.", "Leuchtet Einbruch der Nacht auf: sofortigen Schattenblitz nutzen.", "Nach dem Kampf Aderlass, wenn du viel Leben, aber wenig Mana hast – dann direkt weiter."]}, {"titel": "Leveln: zwei Gegner", "schritte": ["DoTs auf Gegner 1 setzen, dann Furcht auf ihn.", "Mit dem Dämon und Blutsauger Gegner 2 bekämpfen.", "Kommt Gegner 1 zurück: erneut Furcht, DoTs auffrischen.", "Aufpassen, wohin er flieht – sonst bringt er weitere Gegner mit. Untote und Maschinen sind gegen Furcht oft immun."]}, {"titel": "Dungeon", "schritte": ["2–3 Sekunden warten, bis der Tank den Gegner fest hat.", "Fluch der Elemente auf den Boss (bei vielen Nahkämpfern Fluch der Tollkühnheit).", "DoTs nur auf Gegner, die länger als ca. 12 Sekunden leben.", "Blutsauger oder Schattenblitz auf das Ziel des Tanks, Aderlass wenn Leben höher als Mana ist.", "Verbannen auf Dämonen/Elementare, Verführung auf Humanoide; Furcht nur mit genug Platz."]}, {"titel": "Raid (Stufe 60, vorläufig)", "schritte": ["Vor dem Kampf Zauberstein-Öl auf die Waffe; im Schattenblitz-Build den Wichtel opfern (Dämonische Opferung).", "Zugewiesenen Fluch aufrechterhalten (meist Fluch der Elemente).", "Fluch verstärken + Omen der Pein, Schmuckstücke und Kochendes Blut (Orc) zusammen nutzen.", "Verderbnis, Omen der Pein, Lebensentzug (und Feuerbrand im Schattenblitz-Build) aufrechterhalten.", "Einbruch der Nacht: sofortigen Schattenblitz.", "Als Füllzauber Peinigung* (DoT-Gebrechen) bzw. Schattenblitz (Schattenblitz-Build).", "Aderlass möglichst während du laufen musst."]}], "werte": [{"phase": "1-29 Leveln", "reihenfolge": "Zauberstab-Schaden pro Sek. > Schattenschaden/Zaubermacht > Intelligenz = Willenskraft > Ausdauer"}, {"phase": "30-59 Leveln", "reihenfolge": "Schattenschaden/Zaubermacht > Willenskraft > Ausdauer > Intelligenz > Krit"}, {"phase": "60 Dungeon", "reihenfolge": "Schattenschaden/Zaubermacht > Krit > Trefferchance > Ausdauer > Intelligenz > Willenskraft (vorläufig)"}, {"phase": "60 Raid", "reihenfolge": "Trefferchance bis zur Grenze > Schattenschaden/Zaubermacht > Krit > Ausdauer > Intelligenz (vorläufig)"}], "werte_info": [{"wert": "Schattenschaden / Zaubermacht", "stufe": "BiS 1", "warum": "Erhöht direkt den Schaden von Verderbnis, Omen der Pein, Blutsauger und Schattenblitz. Allgemeine Zaubermacht hilft auch Feuerzaubern."}, {"wert": "Kritische Trefferchance (Zauber)", "stufe": "BiS 2", "warum": "In Forever können DoTs kritisch treffen. Mit Pandemie und Bösartigkeit* sehr stark ab ca. Stufe 50."}, {"wert": "Trefferchance (Zauber)", "stufe": "BiS 3", "warum": "Beim Leveln reicht Unterdrückung. Im Raid wichtig, die genaue Grenze für Forever ist noch nicht bekannt."}, {"wert": "Willenskraft", "stufe": "gut", "warum": "In Forever gibt Aderlass mehr Mana, je mehr Willenskraft du hast."}, {"wert": "Ausdauer", "stufe": "gut", "warum": "Mehr Leben heißt mehr Aderlass und mehr Sicherheit beim Entzugs-Tanken."}, {"wert": "Intelligenz", "stufe": "gut", "warum": "Mehr maximales Mana und etwas Krit."}, {"wert": "Tempo", "stufe": "schwach", "warum": "Laut Beta-Tests beschleunigt Tempo DoTs und Entzüge nicht, nur Schattenblitz. Für Gebrechen wenig wert."}, {"wert": "Feuerschaden", "stufe": "schwach", "warum": "Hilft nur Feuerzaubern; für Zerstörung dagegen wichtig."}, {"wert": "Stärke, Beweglichkeit, Angriffskraft, Verteidigung", "stufe": "nutzlos", "warum": "Werte für Nahkämpfer. Verkaufen oder entzaubern."}], "ausruestung": {"leveln": [{"name": "Übungszauberstab des Novizen*", "stufe": 1, "platz": "Zauberstab", "woher": "Verzauberkunst (ab Fertigkeit 1)", "warum": "Erster Zauberstab, kostet beim Leveln kein Mana."}, {"name": "Geringer Zauberstab", "stufe": 5, "platz": "Zauberstab", "woher": "Verzauberkunst", "warum": "11,3 Schaden pro Sek.; in Forever auch mit Zaubermacht."}, {"name": "Großer Zauberstab", "stufe": 13, "platz": "Zauberstab", "woher": "Verzauberkunst", "warum": "17,5 Schaden pro Sek."}, {"name": "Stab von Orgrimmar", "stufe": 13, "platz": "Zweihand", "woher": "Quest im Flammenschlund (nur Horde; Stufe ungefähr)", "warum": "Guter früher Wertestab."}, {"name": "Halbmondstab", "stufe": 17, "platz": "Zweihand", "woher": "Quest in den Höhlen des Wehklagens (Horde; Stufe ungefähr)", "warum": "Guter Stab mit Zauberwerten."}, {"name": "Grabsteinszepter", "stufe": 18, "platz": "Zauberstab", "woher": "Quest in der Tiefschwarzen Grotte (beide Fraktionen)", "warum": "29 Schaden pro Sek., bester Zauberstab vor Stufe 30."}, {"name": "Stab von Soran'ruk", "stufe": 20, "platz": "Zweihand", "woher": "Hexer-Quest „Die Kugel von Soran'ruk“ bei Doan Karhan im Brachland; braucht Bruchstücke aus Tiefschwarzer Grotte und Burg Schattenfang", "warum": "+34 Schatten- und Feuerschaden, 14 Ausdauer."}, {"name": "Kugel von Soran'ruk", "stufe": 20, "platz": "Nebenhand", "woher": "Dieselbe Quest (Stab oder Kugel wählen)", "warum": "+9 Schatten- und Feuerschaden, falls du lieber Einhand + Nebenhand trägst."}], "pre_bis": [{"platz": "Kopf", "name": "Turban des Zauberwebers*", "woher": "General Drakkisath, Obere Schwarzfelsspitze. Vorläufig: Classic-Vorschlag (Warcraft Tavern), Forever-Liste noch nicht veröffentlicht; dt. Name ungeprüft"}, {"platz": "Hals", "name": "Anhänger des dunklen Beraters*", "woher": "Vectus, Scholomance. Vorläufig (Classic-Vorschlag, auch in der Forever-Simulation von Kami Labs); dt. Name ungeprüft"}, {"platz": "Schultern", "name": "Teufelsstoffschultern", "woher": "Schneiderei. Vorläufig (Classic-Vorschlag)"}, {"platz": "Rücken", "name": "Verstärkender Umhang*", "woher": "Magister Kalendris, Düsterbruch West. Vorläufig (Classic-Vorschlag); dt. Name ungeprüft"}, {"platz": "Brust", "name": "Robe der Leere*", "woher": "In der Forever-Simulation von Kami Labs genutzt; Quelle in Forever noch nicht bekannt. Vorläufig; dt. Name ungeprüft"}, {"platz": "Handgelenk", "name": "noch nicht bekannt", "woher": "Classic-Vorschlag (Felsenwut-Armschienen, Zirkel des Cenarius) hängt von späteren Inhalten ab; für Forever noch offen"}, {"platz": "Hände", "name": "Teufelsstoffhandschuhe", "woher": "Schneiderei, Muster aus der Truhe in Düsterbruch Nord. Vorläufig (Classic-Vorschlag)"}, {"platz": "Taille", "name": "Ban'thok-Schärpe*", "woher": "Laut Icy Veins Ok'thor der Brecher; auch in der Forever-Simulation von Kami Labs. Vorläufig; dt. Name ungeprüft"}, {"platz": "Beine", "name": "noch nicht bekannt", "woher": "Classic-Vorschlag (Blutrebengamaschen) braucht Zul'Gurub-Inhalte; für Forever noch offen"}, {"platz": "Füße", "name": "Malekis Fußwickel*", "woher": "Maleki der Bleiche, Stratholme. Vorläufig (Forever-Simulation von Kami Labs); dt. Name ungeprüft"}, {"platz": "Ring", "name": "noch nicht bekannt", "woher": "Forever-Ringe ab Stufe 60 noch nicht bekannt (Classic: Ring von Lord Valthalak, Obere Schwarzfelsspitze)"}, {"platz": "Schmuck 1", "name": "Briarwood-Schilfrohr*", "woher": "Jed Runewatcher (seltener Gegner), Obere Schwarzfelsspitze. Vorläufig (Classic-Vorschlag und Forever-Simulation); dt. Name ungeprüft"}, {"platz": "Schmuck 2", "name": "Königliches Siegel von Eldre'Thalas*", "woher": "Classic: Quest in Düsterbruch; in der Forever-Simulation von Kami Labs genutzt, Quelle in Forever unbestätigt. Vorläufig; dt. Name ungeprüft"}, {"platz": "Waffe", "name": "noch nicht bekannt", "woher": "Forever-Waffen für Stufe 60 noch nicht bekannt; neue Stäbe und Kugeln gibt es über Verzauberkunst-Händlerrezepte"}, {"platz": "Zauberstab", "name": "Skuls geisterhafte Berührung*", "woher": "Skul (seltener Gegner), Stratholme. Vorläufig (Classic-Vorschlag und Forever-Simulation); dt. Name ungeprüft"}], "crafts": [{"name": "Leinen-Reagenzientasche*", "beruf": "Schneiderei", "ab": 5, "warum": "Neue Tasche für den Reagenzien-Platz – ideal für Seelensplitter. Später Woll-Reagenzientasche*."}, {"name": "Geringer Zauberstab", "beruf": "Verzauberkunst", "ab": 5, "warum": "Früher Zauberstab mit Zaubermacht; Großer Zauberstab folgt ab Stufe 13."}, {"name": "Filigranes Schattengewand*", "beruf": "Schneiderei", "ab": 20, "warum": "Neues Muster aus frühen Dungeons: viel Intelligenz und Schattenschaden (Method). Stufe ungefähr."}, {"name": "Schattenhandschuhe", "beruf": "Schneiderei", "ab": 20, "warum": "Teil des Schatten-Sets mit Schattenschaden; Muster beim Händler der Handelsbehörde von Azeroth* gegen Händlergunst*. Gebunden, nur der Schneider kann es tragen. Stufe ungefähr."}, {"name": "Geringes Arkanes Elixier*", "beruf": "Alchemie", "ab": 20, "warum": "Mehr Zaubermacht (Warcraft Tavern). Stufe ungefähr."}, {"name": "Teufelsstoffhandschuhe", "beruf": "Schneiderei", "ab": 58, "warum": "Classic-Pre-BiS für die Hände; vorläufig."}]}, "berufe": [{"name": "Schneiderei + Verzauberkunst", "bewertung": "empfohlen", "warum": "Von Method, Warcraft Tavern und Icy Veins empfohlen: Schneiderei liefert Stoffausrüstung und Taschen, Verzauberkunst zerlegt die grünen Teile und macht Zauberstäbe.", "vorteile": ["Gebundenes Schatten-Set mit Schattenschaden nur für Schneider", "Eigene Zauberstäbe, Stäbe und Kugeln", "Leinen- und Woll-Reagenzientasche* für Seelensplitter", "Lager-Buff "stufe": "18", "was": "Seelenstein, Sengender Schmerz", "wo": "Klassenlehrer"}, {"stufe": "20", "was": "Klassenquest Sukkubus oder Inkubus, Dämonenrüstung, Ritual der Beschwörung, Fluch der Elemente, Feuerregen", "wo": "Horde: Orgrimmar; die Kette führt durch Brachland und Steinkrallengebirge, vorher Flugpunkte sammeln. Allianz: Hexer-Lehrer in Sturmwind/Eisenschmiede (Questverlauf noch nicht bestätigt)."}, {"stufe": "20+", "was": "Quest „Die Kugel von Soran'ruk“", "wo": "Doan Karhan im Brachland; Bruchstücke aus Tiefschwarzer Grotte und Burg Schattenfang. Belohnung: Stab oder Kugel."}, {"stufe": "28", "was": "Verbannen, Feuerstein", "wo": "Klassenlehrer"}, {"stufe": "30", "was": "Klassenquest Teufelsjäger, Höllenfeuer, Dämon unterwerfen", "wo": "Horde: „Auf der Suche nach Strahad“ in Orgrimmar. Allianz: beim Hexer-Lehrer."}, {"stufe": "35", "was": "Berufe: Fachmann", "wo": "Berufslehrer"}, {"stufe": "36", "was": "Zauberstein (bestes Öl für Gebrechen), Zaubersperre für den Teufelsjäger", "wo": "Klassenlehrer bzw. Dämonenlehrer (Grimoire)"}, {"stufe": "40", "was": "Reiten, Klassenquest Teufelsross, Schreckensgeheul, zweite Talentverteilung", "wo": "Reit- und Klassenlehrer"}, {"stufe": "42", "was": "Todesmantel", "wo": "Klassenlehrer"}, {"stufe": "50", "was": "Inferno, Verbrennen (mit Talent)", "wo": "Klassenlehrer"}, {"stufe": "60", "was": "Ritual der Verdammnis, Omen der Verdammnis, Portal der Beschwörung; Endspiel am Berg Hyjal", "wo": "Klassenlehrer (vorläufig)"}], "gruppe": ["Vor dem Dungeon Gesundheitssteine für alle herstellen und den Seelenstein auf den Heiler legen.", "Mit dem Ritual der Beschwörung Nachzügler holen; zwei Mitspieler klicken das Portal an. Ein paar Seelensplitter dafür aufheben.", "2–3 Sekunden warten, bis der Tank den Gegner fest hat; kommt ein Gegner zu dir, kurz aufhören.", "Dämon: Wichtel für den Ausdauerbuff (Blutpakt), Sukkubus/Inkubus für Schaden. Beim Leerwandler Qual ausschalten, sonst klaut er dem Tank die Gegner.", "Bei Bossen Fluch machen, als Mondkin zaubern oder heilen – alles in einer Klasse.", "einleitung": ["Der Druide ist ein Naturhüter, der seine Gestalt wechseln kann. Als Bär hält er viel aus und tankt, als Katze schleicht er und kämpft im Nahkampf, in Zauberergestalt heilt er oder schießt mit Natur- und Arkanzaubern.", "Für Anfänger ist der Druide vielseitig, aber anspruchsvoll: Jede Gestalt hat eine eigene Leiste und eigene Ressource. Dafür kann er sich fast immer selbst helfen – heilen, fliehen, schleichen oder schnell reisen.", "In WoW: Forever wurde der Druide stark überarbeitet: Tiergestalten können Tränke nutzen, Feral-Schaden hängt von der Waffe ab, und jeder Talentbaum hat neue Talente wie Berserker, Finsternis oder Wildwuchs."], "staerken": ["Kann alle vier Rollen übernehmen: Tank, Nahkampf, Fernkampf, Heiler", "Sehr schnelles und sicheres Leveln als Katze (Schleichen, Spurt, Selbstheilung)", "Kampf-Wiederbelebung (Wiedergeburt) und normale Wiederbelebung (Wiederbelebung)", "Entfernt Flüche und Gifte", "Viel Mobilität: Reisegestalt ab 30, Wassergestalt, Teleportieren: Mondlichtung", "Starke Buffs: Mal der Wildnis, Dornen, Anregen, Rudelführer bzw. Mondkin-Aura"], "schwaechen": ["Hohe Komplexität: verschiedene Leisten und Ressourcen je Gestalt", "Gestaltwechsel kosten Mana; zum Heilen muss man die Tiergestalt verlassen", "Bär hat kein Blocken und Parieren, schützt sich nur über Rüstung, Leben und Ausweichen", "Kein Schild; Feral-Schaden hängt stark von der Waffe ab", "Gleichgewicht ist beim Leveln langsam und manahungrig"], "forever_neu": ["Neues Volk: Himmelsgeborene* (Skyborne) können auf Allianz- und Hordenseite Druiden werden.", "In Tiergestalt nutzbar: Tränke und die meisten Verbrauchsgüter, Waffenverzauberungen, Volksfähigkeiten (z. B. Kriegsdonner, Schattenhaftigkeit) sowie Baumrinde, Griff der Natur und Feenfeuer.", "Feral-Schaden skaliert mit der ausgerüsteten Waffe (auch Wetzsteine); Druiden können ab Stufe 20 Stangenwaffen lernen.", "Bärengestalt (10), Wassergestalt (16) und Katzengestalt (20) gibt es per Klassenquest.", "Neue Grundfähigkeiten: Wiederbelebung (12), Aufschlitzen (42), Omen der Klarsicht (20, kein Talent mehr), Griff der Natur (10, jetzt Grundfähigkeit).", "Tigerfuror wurde entfernt und durch das Talent Wandlungskraft* ersetzt; Powershiften funktioniert nicht mehr (laut ConquestCapped, Oktober-Beta).", "Neue bzw. zurückgekehrte Talente: Genesis, Finsternis, Überwucherung*, Urbiss*, Zerfleischen*, Natürliche Reaktion, Berserker, Gabe der Erdenmutter, Lebendiger Geist, Wildwuchs.", "Rasche Heilung verbraucht den HoT nicht mehr; HoTs und DoTs können kritisch treffen.", "Reflexion lässt bis zu 50 % der Manaregeneration beim Zaubern weiterlaufen (statt 15 %).", "Zorn kostet sehr wenig Mana, Hurrikan hat keine Abklingzeit, Wucherwurzeln wirkt in Gebäuden, Dornen skaliert mit Zaubermacht.", "Bär: 100 % mehr Wut durch kritische Treffer, Bedrohungsbonus 50 % statt 30 % (letzte Beta-Änderung, vorläufig).", "Mondkingestalt und Rudelführer schließen sich laut ConquestCapped (Okt. 2026) nicht mehr aus; der Talentrechner von GuildOrder führt sie noch als exklusiv – vorläufig."], "voelker": [{"volk": "Nachtelf", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Elunes Licht* (+10 % kritische Trefferchance für 15 Sek.), Schattenhaftigkeit auch im Kampf, Flinkheit (Ausweichen, Tempo). Empfohlen für Katze und PvP."}, {"volk": "Hochorden-Himmelsgeborene*", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Windgesegnet* (+3 % Tempo) und Leylinien lesen* (Regeneration nahe Leylinien). Gut für Gleichgewicht und Wiederherstellung."}, {"volk": "Tauren", "fraktion": "Horde", "bewertung": "sehr gut", "warum": "Kriegsdonner (Flächenbetäubung, auch in Tiergestalt), Ausdauer (+5 % Leben, +2 % kritischer Schaden/Heilung). Empfohlen für Bär-Tank und Heiler."}, {"volk": "Windformer-Himmelsgeborene*", "fraktion": "Horde", "bewertung": "gut", "warum": "Windgesegnet* (+3 % Tempo), Himmelssicht* (+10 % Tempo außerhalb von Gestalten alance_5": 2, "balance_6": 2, "feral_1": 5, "feral_2": 5, "feral_3": 2, "feral_4": 3, "feral_6": 3, "feral_8": 2, "feral_9": 1, "feral_10": 2, "feral_14": 2, "feral_13": 3, "feral_12": 1, "feral_16": 1, "feral_17": 2, "feral_19": 5, "feral_20": 1, "feral_18": 4}, "hinweis": "Build 'Bear Tank' von Warcraft Tavern (9/42/0) mit Dickes Fell, Urbiss* und Natürliche Reaktion."}, {"name": "Wiederherstellung (Heiler)", "punkte": "11/0/40", "verteilung": {"balance_1": 1, "balance_2": 5, "balance_5": 2, "balance_6": 2, "balance_8": 1, "resto_1": 5, "resto_3": 5, "resto_6": 3, "resto_7": 5, "resto_8": 1, "resto_9": 5, "resto_10": 3, "resto_11": 1, "resto_12": 1, "resto_13": 3, "resto_14": 2, "resto_15": 5, "resto_16": 1}, "hinweis": "Vorläufig: Es gibt noch keinen veröffentlichten 60er-Heilerbuild. Zusammengestellt aus den Schlüsseltalenten des Warcraft-Tavern-Heilerguides (Beta, Stufe 30) plus Wildwuchs und Pracht der Natur."}], "talent_hinweise": ["Zum Leveln Wilder Kampf (Katze): erst Wildheit für günstigere Angriffe, ab 20 Wilde Attacke, ab 25 Wandlungskraft*, ab 30 Rudelführer und mit 40 Berserker.", "Die Reihenfolge ist eine eigene Zusammenstellung aus Method (Wildheit zuerst, später Genesis, Reichweite der Natur, Furor) und dem Warcraft-Tavern-Leveling-Build (Stufe 10-30). Leveling-Builds bis 60 wurden für den Start angekündigt – vorläufig.", "Mit 51 Punkten nach Zerfleischen und Berserker: Furor für 10 Wut beim Bärwechsel, dann Genesis, Reichweite der Natur (+4 % Treffer) und Majestät der Natur (+4 % kritisch).", "Wer in Dungeons tankt, kann früher Dickes Fell, Urbiss* und Natürliche Reaktion nehmen (siehe Bär-Build).", "Spalten der Talente wurden aus den Talentrechner-Links von Warcraft Tavern abgeleitet; nicht bestätigt ist die Spalte bei Rache, Brutaler Hieb, Feingefühl, Gelassener Geist, Verbesserte Gelassenheit, Verbessertes Nachwachsen und den 31-Punkte-Talenten (vorläufig).", "Talenttexte: Werte für Rang 1 laut GuildOrder; höhere Ränge wurden linear hochgerechnet und, wo möglich, mit Kami-Labs/Warcraft Tavern abgeglichen – vorläufig (Beta).", "Bekannte Voraussetzungen: Majestät der Natur benötigt Genesis; Verbesserte Wandlungskraft* setzt Wandlungskraft* voraus. Weitere Pfeile sind noch nicht bestätigt.", "Duale Talentspezialisierung gibt es in Forever – z. B. Katze zum Leveln und Bär oder Heiler für Dungeons."], "faehigkeiten": [{"name": "Zorn", "en": "Wrath", "stufe": 1, "art": "Angriff", "text": "Naturgeschoss mit kurzer Zauberzeit und in Forever sehr geringen Manakosten. Zum Anlocken und als Füller.", "wichtig": true}, {"name": "Heilende Berührung", "en": "Healing Touch", "stufe": 1, "art": "Heilung", "text": "Große Einzelheilung mit langer Zauberzeit. Zwischen Kämpfen oder für großen Schaden nutzen; als Heiler passenden Rang wählen.", "wichtig": true}, {"name": "Mal der Wildnis", "en": "Mark of the Wild", "stufe": 1, "art": "Buff", "text": "Erhöht Rüstung, Werte und Widerstände eines Ziels. Der frühere Bonus von 'Verbessertes Mal' ist in Forever bereits eingebaut. Immer aktiv halten.", "wichtig": true}, {"name": "Mondfeuer", "en": "Moonfire", "stufe": 4, "art": "Angriff", "text": "Sofortiger Arkanschaden plus Schaden über Zeit; kann in Forever kritisch treffen. Gut im Laufen.", "wichtig": true}, {"name": "Verjüngung", "en": "Rejuvenation", "stufe": 4, "art": "Heilung", "text": "Heilung über Zeit (HoT), sofort wirkbar, kann kritisch treffen. Wichtigster Heilzauber des Druiden.", "wichtig": true}, {"name": "Dornen", "en": "Thorns", "stufe": 6, "art": "Buff", "text": "Gegner, die das Ziel im Nahkampf treffen, erleiden Naturschaden. Skaliert in Forever mit Zaubermacht. Beim Leveln immer auf sich selbst.", "wichtig": true}, {"name": "Wucherwurzeln", "en": "Entangling Roots", "stufe": 8, "art": "Kontrolle", "text": "Fesselt einen Gegner am Boden und verursacht Schaden. Funktioniert in Forever auch in Gebäuden. Zum Flüchten oder um Gegner auf Abstand zu halten.", "wichtig": true}, {"name": "Bärengestalt", "en": "Bear Form", "stufe": 10, "art": "Haltung", "text": "Tank-Gestalt mit Wut, mehr Rüstung und Leben. In Forever per Klassenquest ab Stufe 10. Auch als Nicht-Tank im Notfall nutzen.", "wichtig": true}, {"name": "Zermalmen", "en": "Maul", "stufe": 10, "art": "Angriff", "text": "Bär: verstärkt den nächsten Nahkampfangriff, erzeugt zusätzliche Bedrohung. Mit überschüssiger Wut nutzen.", "wichtig": false}, {"name": "Knurren", "en": "Growl", "stufe": 10, "art": "Kontrolle", "text": "Bär: zwingt einen Gegner, euch anzugreifen (Spott). Abklingzeit wie bei der Kriegerfähigkeit Spott.", "wichtig": true}, {"name": "Demoralisierendes Gebrüll", "en": "Demoralizing Roar", "stufe": 10, "art": "Kontrolle", "text": "Bär: senkt die Angriffskraft aller Gegner in der Nähe (so stark wie Demoralisierender Ruf des Kriegers). Als Tank immer aufrechterhalten.", "wichtig": true}, {"name": "Griff der Natur", "en": "Nature's Grasp", "stufe": 10, "art": "Kontrolle", "text": "Gegner, die euch treffen, werden festgewurzelt. In Forever Grundfähigkeit, auch in Tiergestalt und in Gebäuden nutzbar – gutes Fluchtwerkzeug.", "wichtig": false}, {"name": "Teleportieren: Mondlichtung", "en": "Teleport: Moonglade", "stufe": 10, "art": "Bewegung", "text": "Teleportiert euch zur Mondlichtung (Druidenlehrer). Spart Reisezeit.", "wichtig": false}, {"name": "Nachwachsen", "en": "Regrowth", "stufe": 12, "art": "Heilung", "text": "Direkte Heilung plus HoT. In Forever günstiger. Für Ziele, die viel Leben verloren haben.", "wichtig": true}, {"name": "Wutanfall", "en": "Enrage", "stufe": 12, "art": "Buff", "text": "Bär: gibt sofort 10 Wut und weitere Wut über Zeit, senkt aber die Rüstung. Zum Kampfbeginn nutzen.", "wichtig": false}, {"name": "Wiederbelebung", "en": "Revive", "stufe": 12, "art": "Heilung", "text": "Neu in Forever: belebt einen toten Mitspieler außerhalb des Kampfes wieder.", "wichtig": true}, {"name": "Hieb", "en": "Bash", "stufe": 14, "art": "Kontrolle", "text": "Bär: betäubt das Ziel kurz. Zum Unterbrechen gefährlicher Zauber.", "wichtig": false}, {"name": "Vergiftung heilen", "en": "Cure Poison", "stufe": 14, "art": "Heilung", "text": "Entfernt eine Vergiftung. Per Klassenquest 'Neue Lektionen*' bzw. Lehrer.", "wichtig": false}, {"name": "Wassergestalt", "en": "Aquatic Form", "stufe": 16, "art": "Bewegung", "text": "Schneller schwimmen (+50 %) und unter Wasser atmen. Per Klassenquest ab Stufe 16.", "wichtig": false}, {"name": "Prankenhieb", "en": "Swipe", "stufe": 16, "art": "Angriff", "text": "Bär: trifft mehrere Gegner vor euch. Wichtig für Bedrohung gegen Gruppen.", "wichtig": true}, {"name": "Feenfeuer", "en": "Faerie Fire", "stufe": 18, "art": "Kontrolle", "text": "Senkt die Rüstung des Ziels und verhindert Unsichtbarkeit. In Bär- und Katzengestalt in Forever als kostenlose Variante (6 Sek. Abklingzeit) nutzbar. Immer auf dem Boss halten.", "wichtig": true}, {"name": "Winterschlaf", "en": "Hibernate", "stufe": 18, "art": "Kontrolle", "text": "Lässt ein Tier oder einen Drachkin einschlafen. Kontrolle im Dungeon.", "wichtig": false}, {"name": "Katzengestalt", "en": "Cat Form", "stufe": 20, "art": "Haltung", "text": "Nahkampf-Gestalt mit Energie und Combopunkten. Per Klassenquest ab Stufe 20. Hauptgestalt beim Leveln.", "wichtig": true}, {"name": "Klaue", "en": "Claw", "stufe": 20, "art": "Angriff", "text": "Katze: Angriff, der einen Combopunkt gibt. In Forever deutlich stärker. Nutzen, wenn ihr nicht hinter dem Ziel steht.", "wichtig": true}, {"name": "Schleichen", "en": "Prowl", "stufe": 20, "art": "Bewegung", "text": "Katze: Verstohlenheit. Für Eröffnungsangriffe und um Gegnern auszuweichen.", "wichtig": true}, {"name": "Zerfetzen", "en": "Rip", "stufe": 20, "art": "Angriff", "text": "Katze: Abschlussangriff, Blutung über Zeit. Bei 4-5 Combopunkten gegen Ziele, die lange genug leben.", "wichtig": true}, {"name": "Schreddern", "en": "Shred", "stufe": 20, "art": "Angriff", "text": "Katze: starker Angriff von hinten, gibt einen Combopunkt. In Forever schon ab 20 lernbar.", "wichtig": true}, {"name": "Sternenfeuer", "en": "Starfire", "stufe": 20, "art": "Angriff", "text": "Langsamer, starker Arkanzauber. Mit dem Talent Finsternis im Wechsel mit Zorn.", "wichtig": false}, {"name": "Wiedergeburt", "en": "Rebirth", "stufe": 20, "art": "Heilung", "text": "Belebt einen Mitspieler im Kampf wieder (lange Abklingzeit, braucht ein Reagenz).", "wichtig": true}, {"name": "Omen der Klarsicht", "en": "Omen of Clarity", "stufe": 20, "art": "Buff", "text": "In Forever kein Talent mehr, sondern Grundfähigkeit: Angriffe und Zauber (auch HoT-/DoT-Ticks) können den nächsten Zauber/Angriff kostenlos machen.", "wichtig": true}, {"name": "Tier besänftigen", "en": "Soothe Animal", "stufe": 22, "art": "Kontrolle", "text": "Verringert die Aggroreichweite eines Tieres. Um an Tieren vorbeizuschleichen.", "wichtig": false}, {"name": "Krallenhieb", "en": "Rake", "stufe": 24, "art": "Angriff", "text": "Katze: Blutung über Zeit, gibt einen Combopunkt. Skaliert in Forever mit Angriffskraft.", "wichtig": true}, {"name": "Fluch aufheben", "en": "Remove Curse", "stufe": 24, "art": "Heilung", "text": "Entfernt einen Fluch. Im Dungeon/Raid sehr wichtig.", "wichtig": true}, {"name": "Spurt", "en": "Dash", "stufe": 26, "art": "Bewegung", "text": "Katze: kurzzeitig deutlich schneller laufen. Zum Flüchten oder Aufholen.", "wichtig": false}, {"name": "Vergiftung aufheben", "en": "Abolish Poison", "stufe": 26, "art": "Heilung", "text": "Entfernt über einige Sekunden wiederholt Gifte.", "wichtig": false}, {"name": "Herausforderndes Gebrüll", "en": "Challenging Roar", "stufe": 28, "art": "Kontrolle", "text": "Bär: zwingt alle Gegner in der Nähe kurz, euch anzugreifen (Flächenspott, lange Abklingzeit).", "wichtig": false}, {"name": "Ducken", "en": "Cower", "stufe": 28, "art": "Schutz", "text": "Katze: senkt eure Bedrohung. Wenn ihr dem Tank die Aggro klaut.", "wichtig": false}, {"name": "Reisegestalt", "en": "Travel Form", "stufe": 30, "art": "Bewegung", "text": "Im Freien 40 % schneller, sofort wirkbar. Ersetzt bis Stufe 40 ein Reittier; Kräutersammeln geht darin.", "wichtig": true}, {"name": "Gelassenheit", "en": "Tranquility", "stufe": 30, "art": "Heilung", "text": "Kanalisierte Gruppenheilung mit langer Abklingzeit. Nur starten, wenn ihr sie ganz durchziehen könnt.", "wichtig": false}, {"name": "Wilder Biss", "en": "Ferocious Bite", "stufe": 32, "art": "Angriff", "text": "Katze: Abschlussangriff mit direktem Schaden. Bei 5 Combopunkten, wenn Zerfetzen noch lange läuft oder der Gegner bald stirbt.", "wichtig": true}, {"name": "Verheeren", "en": "Ravage", "stufe": 32, "art": "Angriff", "text": "Katze: sehr starker Eröffnungsangriff aus Schleichen von hinten.", "wichtig": false}, {"name": "Humanoide aufspüren", "en": "Track Humanoids", "stufe": 32, "art": "Sonstiges", "text": "Katze: zeigt Humanoide auf der Minikarte. Praktisch beim Questen.", "wichtig": false}, {"name": "Rasende Regeneration", "en": "Frenzied Regeneration", "stufe": 36, "art": "Schutz", "text": "Bär: wandelt Wut in Leben um; in Forever bis zu 100 % des maximalen Lebens. Notfall-Fähigkeit.", "wichtig": true}, {"name": "Anspringen", "en": "Pounce", "stufe": 36, "art": "Kontrolle", "text": "Katze: betäubender Eröffnungsangriff aus Schleichen mit Blutung.", "wichtig": false}, {"name": "Terrorbärengestalt", "en": "Dire Bear Form", "stufe": 40, "art": "Haltung", "text": "Verbesserte Bärengestalt (360 % Rüstungsbonus) vom Lehrer. Ersetzt die Bärengestalt.", "wichtig": true}, {"name": "Hurrikan", "en": "Hurricane", "stufe": 40, "art": "Angriff", "text": "Kanalisierter Flächenschaden; in Forever ohne Abklingzeit.", "wichtig": false}, {"name": "Anregen", "en": "Innervate", "stufe": 40, "art": "Buff", "text": "Stellt dem Ziel stark Mana wieder her. Auf euch oder einen Heiler mit viel Willenskraft.", "wichtig": true}, {"name": "Aufschlitzen", "en": "Lacerate", "stufe": 42, "art": "Angriff", "text": "Neu in Forever: stapelbare Blutung für Bären (bis 5x) mit hoher Bedrohung. Kern der Tank-Rotation.", "wichtig": true}, {"name": "Baumrinde", "en": "Barkskin", "stufe": 44, "art": "Schutz", "text": "Verringert erlittenen Schaden kurzzeitig; in Forever auch in Tiergestalt nutzbar.", "wichtig": true}, {"name": "Gabe der Wildnis", "en": "Gift of the Wild", "stufe": 50, "art": "Buff", "text": "Gruppenversion von Mal der Wildnis (benötigt ein Reagenz).", "wichtig": false}, {"name": "Insektenschwarm", "en": "Insect Swarm", "stufe": 30, "art": "Angriff", "text": "Talent (Gleichgewicht, jetzt dort statt in Wiederherstellung): Naturschaden über Zeit und weniger Trefferchance des Ziels.", "wichtig": false}, {"name": "Wilde Attacke", "en": "Feral Charge", "stufe": 20, "art": "Bewegung", "text": "Talent: Bär stürmt zum Ziel und unterbricht; Katze springt hinter das Ziel. Einzige Unterbrechung neben Hieb.", "wichtig": true}, {"name": "Wandlungskraft*", "en": "Shifting Power", "stufe": 25, "art": "Buff", "text": "Talent: wandelt Mana in 40 Energie (Katze, 16 Sek. Abklingzeit). Nutzen, wenn Energie unter ca. 50-60 fällt.", "wichtig": true}, {"name": "Urbiss*", "en": "Primal Bite", "stufe": 25, "art": "Angriff", "text": "Talent: Bär-Angriff mit hoher Bedrohung. In der Tank-Rotation bei Abklingzeit nutzen.", "wichtig": true}, {"name": "Rudelführer", "en": "Leader of the Pack", "stufe": 30, "art": "Buff", "text": "Talent: +3 % kritische Trefferchance (Nah- und Fernkampf) für den Schlachtzug in Katzen-/Bärengestalt.", "wichtig": true}, {"name": "Berserker", "en": "Berserk", "stufe": 40, "art": "Buff", "text": "Talent (31 Punkte Wildheit): 15 Sek. Schadensphase, Furcht-Immunität. Bei Bossen und gefährlichen Kämpfen zünden.", "wichtig": true}, {"name": "Rasche Heilung", "en": "Swiftmend", "stufe": 35, "art": "Heilung", "text": "Talent: sofortige Heilung auf einem Ziel mit Verjüngung/Nachwachsen; der HoT bleibt erhalten.", "wichtig": true}, {"name": "Schnelligkeit der Natur", "en": "Nature's Swiftness", "stufe": 40, "art": "Heilung", "text": "Talent: nächster Naturzauber sofort – meist mit Heilende Berührung als Notfallheilung.", "wichtig": false}, {"name": "Mondkingestalt", "en": "Moonkin Form", "stufe": 40, "art": "Haltung", "text": "Talent (31 Punkte Gleichgewicht): Zauberer-Gestalt mit viel Rüstung und Schlachtzugs-Buff für kritische Zaubertreffer.", "wichtig": false}, {"name": "Wildwuchs", "en": "Wild Growth", "stufe": 40, "art": "Heilung", "text": "Talent (31 Punkte Wiederherstellung): Gruppen-HoT. Wichtigster Gruppenheilzauber des Wiederherstellungs-Druiden.", "wichtig": false}], "rotation": [{"titel": "Stufe 1-10 (Zauberergestalt)", "schritte": ["Mit Zorn anlocken, Mondfeuer auf das Ziel.", "Weiter Zorn wirken; ohne Mana im Nahkampf zuschlagen.", "Mit Verjüngung heilen, Dornen und Mal der Wildnis immer aktiv halten."]}, {"titel": "Stufe 10-20 (Bär)", "schritte": ["2x Zorn und Mondfeuer aus der Ferne.", "Kurz vor dem Gegner in Bärengestalt wechseln.", "Wutanfall, dann Demoralisierendes Gebrüll.", "Zermalmen mit Wut; bei mehreren Gegnern Prankenhieb."]}, {"titel": "Leveln: Katze (ab 20)", "schritte": ["Dornen auf sich selbst halten.", "Mit Schleichen anschleichen, aus Schleichen Verheeren (ab 32) oder Schreddern von hinten.", "Feenfeuer auf das Ziel.", "Krallenhieb für die Blutung, dann Schreddern (von hinten) oder Klaue für Combopunkte.", "Bei 4-5 Combopunkten Zerfetzen; stirbt der Gegner bald, lieber Wilder Biss oder weiter Klaue.", "Wandlungskraft*, sobald die Energie unter ca. 50 fällt; Berserker, wenn verfügbar."]}, {"titel": "Dungeon/Raid: Katze", "schritte": ["Feenfeuer aufrechterhalten.", "Berserker und Schmuckstücke zünden.", "Omen der Klarsicht (Freizauber) für Schreddern nutzen.", "Wandlungskraft* unter ca. 60 Energie.", "Zerfetzen bei 5 Combopunkten aufrechterhalten, Krallenhieb aufrechterhalten.", "Schreddern als Aufbauer; Wilder Biss nur, wenn Zerfetzen noch lange läuft."]}, {"titel": "Dungeon/Raid: Bär (Tank)", "schritte": ["Dornen auf sich, mit Feenfeuer anlocken.", "Demoralisierendes Gebrüll aufrechterhalten.", "Urbiss* bei Abklingzeit auf das Hauptziel.", "Aufschlitzen auf 5 Stapel bringen und halten.", "Prankenhieb ab 3 Gegnern, sonst Zermalmen mit überschüssiger Wut.", "Im Notfall Baumrinde und Rasende Regeneration; Berserker gegen Furcht."]}, {"titel": "Gleichgewicht (Finsternis)", "schritte": ["Mit Zorn anlocken, Mondfeuer und Insektenschwarm.", "Ab 30: 1x Zorn, dann 2x Sternenfeuer (Finsternis verkürzt die Zauberzeit).", "Beim Leveln Gegner mit Wucherwurzeln festhalten (Überwucherung*: bis 3 Ziele).", "DoTs nicht vorzeitig erneuern."]}, {"titel": "Heilen (Wiederherstellung)", "schritte": ["Verjüngung auf den Tank und alle, die leicht Schaden nehmen.", "Rasche Heilung auf ein Ziel mit HoT, das schnell Leben braucht.", "Wildwuchs, wenn mehrere Gruppenmitglieder Schaden nehmen.", "Nachwachsen für Ziele mit viel fehlendem Leben, Heilende Berührung (passender Rang) für den Rest.", "Flüche und Gifte entfernen; Anregen und Gelassenheit gezielt einsetzen."]}], "werte": [{"phase": "Leveln (Katze)", "reihenfolge": "Stärke / Beweglichkeit / Angriffskraft > Ausdauer / Intelligenz / Willenskraft > Rüstung; Waffenschaden zählt"}, {"phase": "60 Katze", "reihenfolge": "Trefferwertung (9 % Cap, 4 % aus Talent) > Waffenkunde > kritische Trefferchance > Tempo > Beweglichkeit > Stärke > Angriffskraft"}, {"phase": "60 Bär (Tank)", "reihenfolge": "Verteidigung (Cap 440) > Ausweichen > Rüstung > Ausdauer > danach Bedrohungswerte wie bei der Katze"}, {"phase": "60 Wiederherstellung", "reihenfolge": "Heilung/Zaubermacht > Willenskraft > Tempo > kritische Trefferchance > Intelligenz (vorläufig)"}, {"phase": "60 Gleichgewicht", "reihenfolge": "Zauberschaden > Trefferwertung > kritische Trefferchance > Tempo > Intelligenz > Willenskraft (vorläufig)"}], "werte_info": [{"wert": "Trefferwertung", "stufe": "BiS 1", "warum": "Für Katze und Eule bis zum Cap (9 % gegen Raidbosse) am wichtigsten; Reichweite der Natur gibt 4 %."}, {"wert": "Stärke", "stufe": "gut", "warum": "Gibt Katze und Bär doppe function zuAbschnitt(id){
  var el = document.getElementById('s-' + id); if (!el) return false;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); return true;
}
side.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('nav-gk')) {
    var g = b.parentNode, auf = !g.classList.contains('auf');
    g.classList.toggle('auf', auf); b.setAttribute('aria-expanded', auf ? 'true' : 'false');
    navOffen[g.dataset.g] = auf; navMerken(); return;
  }
  if (b.dataset.go) {
    var ziel = b.dataset.sec2;
    if (location.hash.replace('#', '') === b.dataset.go) { if (ziel) zuAbschnitt(ziel); else window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else { location.hash = b.dataset.go; if (ziel) setTimeout(function(){ zuAbschnitt(ziel); }, 120); }
    closeMenu();
  }
  else if (b.dataset.sec) { zuAbschnitt(b.dataset.sec); closeMenu(); }
});
var menuBtn = document.getElementById('menu-btn'), scrim = document.getElementById('scrim');

  h += sec('qh', 'Addon 3', 'siikk-Questhilfe – Quests mit Pfeil und Meterzahl', '<p>Die siikk-Questhilfe zeigt dir alle Questgeber, Questziele und Abgabe-NPCs auf Weltkarte und Minimap – mit eigenen Symbolen im siikk-Design. Sie bringt ihre eigene Questdatenbank mit und läuft in <b>TBC Anniversary, Classic und WoW: Forever</b>.</p>' +
    feats([
      ['Questfenster mit Meterzahl', 'Alle Quests nummeriert, hinter jeder Quest steht, wie weit das Ziel entfernt ist. Fenster frei verschiebbar und in der Größe änderbar, mit Horde- oder Allianz-Logo.'],
      ['Questpfeil', 'Ein eigenes, verschiebbares Feld mit Pfeil und Meterzahl. Groß mit Questname und Ziel oder klein nur mit Nummer, Pfeil und Metern. Mausrad = Größe.'],
      ['Diese Quest verfolgen', 'Rechtsklick auf eine Quest im Fenster → „Diese Quest verfolgen“. Sonst führt der Pfeil automatisch zur nächstgelegenen Quest.'],
      ['Eigene Symbole', 'Ausrufe- und Fragezeichen, Ziele zum Töten, Sammeln und Benutzen – alles im siikk-Stil.'],
      ['Alles einstellbar', 'Zahnrad oben rechts im Fenster → Reiter „siikk-Design“: Farben, Logo, Deckkraft, Pfeil, Meterzahl.'],
      ['Mit siikkUI abgestimmt', 'In siikkUI wählst du, welche Questanzeige läuft: die Questhilfe mit Pfeil oder die schlichte siikkUI-Anzeige. Immer nur eine.']
    ]) + table(['Befehl','Was er macht'], [[c('/qh'), 'Einstellungen öffnen'], [c('/qh intro'), 'Einführung öffnen'], [c('/th quests hilfe'), 'In siikkUI auf die Questhilfe umschalten'], [c('/qhdiag'), 'Prüfbericht, falls etwas fehlt']]));

  h += sec('ah', 'Addon 4', 'siikk-Auktionshaus – dein Auktionshaus-Helfer', '<p>Das siikk-Auktionshaus erscheint direkt neben dem Auktionshaus, mit vier Reitern. Es merkt sich die Preise und zeigt den Marktwert jedes Gegenstands im Tooltip – auch wenn du nicht am Auktionshaus stehst. Läuft in <b>TBC Anniversary, Classic und WoW: Forever</b>.</p>' +
    feats([
      ['Preise', 'Komplett-Scan liest alle Angebote auf einmal (laut Blizzard alle 15 Minuten), sonst der Seiten-Scan. Danach siehst du Marktwert und günstigstes Angebot für jeden Gegenstand.'],
      ['Verkaufen', 'Alle verkaufbaren Gegenstände aus deinen Taschen. Ein Klick, und der Preis steht 1 Kupfer unter dem günstigsten Angebot. Stapelgröße, Anzahl und Dauer wählen, „Einstellen“ – fertig.'],
      ['Kaufen', 'Suchen, nach Preis pro Stück sortiert. Schnäppchen unter 80 % des Marktwerts sind grün. Einkaufsliste für Dinge, die du oft brauchst.'],
      ['Übersicht', 'Was du heute, in 7 und 30 Tagen verkauft hast – mit Gewinn nach AH-Gebühr und Kaution.'],
      ['Marktwert im Tooltip', 'Maus über einen Gegenstand: Marktwert, günstigstes Angebot und wie alt der Preis ist. Abschalten mit '+c('/ah tooltip')+'.'],
      ['Preise im Tooltip', 'Fährst du mit der Maus über einen Gegenstand, zeigt das Infofenster den niedrigsten und 2. Preis pro Stück, den Preis für den ganzen Stapel, den Marktwert, die Anzahl der Angebote und wie alt der Scan ist. Wer zusätzlich Preise direkt auf den Taschenfeldern möchte: '+c('/ah taschen')+'.']
    ]) + table(['Befehl','Was er macht'], [[c('/ah'), 'Fenster am Auktionshaus ein/aus'], [c('/ah scan'), 'Komplett-Scan starten'], [c('/ah tooltip'), 'Marktwert im Tooltip an/aus'], [c('/ah intro'), 'Einführung öffnen']]));
  h += sec('sz', 'Addon 5', 'siikk-Schadenszahlen – schönere Zahlen über dem Gegner', '<p>Statt der schlichten Blizzard-Zahlen fliegen deine Treffer im siikk-Stil über den Gegner: fette, kursive Schrift mit dunkler Kontur, Farben je Magieschule und goldene Krits, die groß ins Bild springen und kurz aufleuchten. Volle Funktion in <b>TBC Anniversary, Classic und WoW: Forever</b>. In <b>Midnight</b> lässt Blizzard Addons nicht an den Kampflog – dort ersetzt das Addon nur die Schrift der Blizzard-Zahlen.</p><img src="data:image/webp;base64,UklGRvI3AABXRUJQVlA4IOY3AAAQGgGdASoJA90BPm02lkkkIqKmInNo4MANiWdu/CgJqlxmS4FHJ/a4/it37n8ougc6L8afJPoW+Ect/8H/FfkN8uv+j6uPMG/q39u/2/pkftH77vMR+uP7We63/sf1391P9X/z/7D/7T5AP6P/Yf/H653si/ul7Af7I+mp+4Hwl/1j/ofuZ8Dn7Kf+v2AP//wWXqP/Bek/xV+9/k5+Mvt3+LfPv3f+xftb/dPbc/vumm/w/Q3+Tfa38l/df3U/tnuH/rvtA9MfhX/afaf8hH45/Kv8Z9sXxvfaf4vvD9p/2P+X9Qj2P+gf53/B/5b/yf470Xv7f+4erX5z/dP9J7gH8l/pv+r/On/OfOf+q8KD8D/qP2M+AL+gf2v/z/5b8xfpj/oP+//qf9t+7Xt3/Qf8z/5v9T8BX86/tH/T/yHtl//////Bf9uf///9Phd/c///h+/+6JLDRQGrdqN7Gqc8jVzY5GYtjERbjJNGoq+ICcvBOXgnLwTl4Jy8EsZ7MRFuLFHKInMp5byl/w9hpi0Zl/J97gQDLBmEw8ItP88zcya+TAm8jiVHelouzhwr8PDtytdV0cGrBdO0q+F03FMsfoOffENg75B5g0UCOBhGMps52n6d889TM3pYSNeWL8N9C0pDrfa7Kxowf850kcJ3qAwl+YYoYUJRowUq7kEUbWAln9PAbG2WUMnCAdh39OMsXvFgkxkYUqIznXwYXmLH+v/wuEI/+/D6oMBFyxrmB+NXUDgwKfMQjbmlA3vH1BK07oCXqVtwb1aWD0vjRgkn0GTED+itEmUFOn5vRLrc7+rAk21/pWmSsIwCryRE8PqJW39sH+exkTaSq41+cp1i+jIapGgqLS8yotLu0fIJBnlKbwjFgi0zfMFT2VrECmXzlkN7oTNKHfGjfJHsR0JbH+ylXxUM9zFV6WsYKmVbf+35yFEVj/tvbfCg1J4p8h5M3FzAU8NlHMyjkE0zixbbF0l+FkosxWF2A5YlMwVg7IPsGn12fnztdPUJZRk2RxGGtZ+cuc1QAXv419YOZmVUGH8+ZdH1/EpkMZmPS5Lk+IowL3jpDkpYx65ngBTv9Bf4Metx4zKefbmuaec5NkkSoyQzSJPQkDXAyaaHh2PC4Ao/7t2ES5AiTxsUZr1gld2N/slpWpnqQKCP1lnwjvD5RB9YvZVoVpy0MoI17i1FAqblgbW8e3F8y1kfo9J0e0bIlqbCihSH1OVAxvAyr7uQvPJv368bKlVXDXej1qg2TppVwYRoHg9PsQ6mSxPbfaNVzCn0cqKADD8y5Hh8CzDTj+hW99/SAc7U9ITvs+YvNS+UzZlHXXCDqrFZaqsqHnjxRDxm2DNhk7s8TeGw1QdEPdOjzBwnFX6utKuDAhT+FEbX4knrzyqcaS4iksbq4/7IKCQR+plXBcIcUaFtoLbxqx   h += sec('il', 'Addon 6', 'siikk-Infoleiste – alles Wichtige auf einen Blick', '<p>Eine kleine, dunkle Leiste ohne Rand, nur so breit wie ihr Inhalt und frei verschiebbar. Jeder Eintrag zeigt beim Drüberfahren ein Infofenster mit allen Details. Läuft in <b>allen Spielversionen</b>.</p>' +

      ['Erfahrung & Zeit bis zur Stufe', 'Fortschritt in % und Erholungsbonus. Im Infofenster: Spielzeit gesamt, auf dieser Stufe und in dieser Sitzung, EP pro Stunde, Kills und Quests bis zur Stufe und wie lange du bei deinem Tempo noch brauchst.'],
      ['Ort & Koordinaten', 'Gebiet mit Koordinaten, farbig nach Gebietsart (freundlich, feindlich, umkämpft). Klick öffnet die Weltkarte.'],

function talentIndex(k){
  var by = {}, trees = (k.talente && k.talente.baeume) || [];
  trees.forEach(function(t, ti){ (t.talente||[]).forEach(function(x){ x._tree = ti; by[x.id] = x; }); });

}
function orderHtml(k, order){
  var by = talentIndex(k), cnt = {}, h = '<div class="order">';
  var runs = [];
  (order||[]).forEach(function(o){
    var t = by[o.talent]; if (!t) return;
    cnt[o.talent] = (cnt[o.talent] || 0) + 1;
    var last = runs[runs.length - 1];
    if (last && last.t === t && o.stufe === last.bis + 1) { last.bis = o.stufe; last.rang = cnt[o.talent]; }
    else runs.push({ t: t, von: o.stufe, bis: o.stufe, rang: cnt[o.talent] });
  });
  runs.forEach(function(r){
    var t = r.t, tr = k.talente.baeume[t._tree];
    h += '<button type="button" class="ord" data-lvl="'+r.bis+'"><span class="lvl">'+(r.von === r.bis ? r.von : r.von + '–' + r.bis)+'</span><span class="ico">'+icon(t.name, TREE_COL[t._tree], CLS_SVG[k.id])+'</span><span><b>'+esc(t.name)+'</b> <small>'+r.rang+'/'+t.max+' · '+esc(tr.name)+'</small></span></button>';
  });
  return h + '</div>';
}

function abilities(k){

/* Seitenleiste markiert das sichtbare Kapitel */
var spyObs = null;
function spy(){
  if (spyObs) spyObs.disconnect();
  if (!('IntersectionObserver' in window)) return;
  spyObs = new IntersectionObserver(function(ents){ ents.forEach(function(e){ if (e.isIntersecting) {
    var id = e.target.id.slice(2); side.querySelectorAll('[data-sec]').forEach(function(b){ b.classList.toggle('on', b.dataset.sec === id); }); } }); }, { rootMargin: '-30% 0px -60% 0px' });
  view.querySelectorAll('section.sec').forEach(function(s){ spyObs.observe(s); });
}

  var grid = $('tt-grid'), tip = $('tt-tip'), rng = $('tt-lvl');

  function r(id){ return st.pts[id] || 0; }
  function treeSum(ti, belowRow){ var s = 0; trees[ti].talente.forEach(function(t){ if (belowRow == null || t.reihe < belowRow) s += r(t.id); }); return s; }
  function spent(){ var s = 0; for (var id in st.pts) s += st.pts[id]; return s; }
  function avail(){ return Math.max(0, st.lvl - 9); }
  function free(){ return avail() - spent(); }
  function reqPts(t){ return (t.reihe - 1) * 5; }
  function whyNot(t){
    var w = [];
    if (r(t.id) >= t.max) return ['Schon voll ausgebaut.'];
    if (free() <= 0) w.push('Keine freien Punkte: Stufe erhöhen oder einen Punkt entfernen.');
    if (treeSum(t._tree) < reqPts(t)) w.push('Braucht ' + reqPts(t) + ' Punkte in ' + trees[t._tree].name + ' (jetzt ' + treeSum(t._tree) + ').');
    if (t.vor && BY[t.vor] && r(t.vor) < BY[t.vor].max) w.push('Erst ' + BY[t.vor].name + ' voll ausbauen.');
    return w;
  }
  function canAdd(t){ return !whyNot(t).length; }
  function valid(pts){
    var tot = 0; for (var id in pts) tot += pts[id]; if (tot > avail()) return false;
    for (var id2 in pts) { var t = BY[id2]; if (!t || !pts[id2]) continue;
      var below = 0; trees[t._tree].talente.forEach(function(x){ if (x.reihe < t.reihe) below += pts[x.id] || 0; });
      if (below < reqPts(t)) return false;
      if (t.vor && BY[t.vor] && (pts[t.vor] || 0) < BY[t.vor].max) return false; }
    return true;
  }
  function canRemove(t){ if (!r(t.id)) return false; var p = Object.assign({}, st.pts); p[t.id]--; if (!p[t.id]) delete p[t.id]; return valid(p); }
  function add(t){ if (!canAdd(t)) return; st.pts[t.id] = r(t.id) + 1; persist(); render(); }
  function rem(t){ if (!canRemove(t)) { warn('Erst Talente weiter unten im Baum entfernen, die diesen Punkt brauchen.'); return; } st.pts[t.id]--; if (!st.pts[t.id]) delete st.pts[t.id]; persist(); render(); }
  function warn(m){ var el = $('tt-warn'); el.textContent = m; el.hidden = !m; }
  function persist(){ st.sel = sel; save(KEY, st); }
  function recFor(lvl){ var p = {}; ORDER.forEach(function(o){ if (o.stufe <= lvl && BY[o.talent]) p[o.talent] = (p[o.talent] || 0) + 1; }); return p; }
  function nextRec(){ var p = {}; for (var i = 0; i < ORDER.length; i++) { var o = ORDER[i]; if (o.stufe > st.lvl) return null; p[o.talent] = (p[o.talent]||0) + 1; if (p[o.talent] > r(o.talent)) return o.talent; } return null; }

  function render(){
    rng.value = st.lvl; $('tt-lvl-out').textContent = st.lvl;
    $('tt-free').textContent = free(); $('tt-spent').textContent = spent();
    $('tt-split').textContent = trees.map(function(t, i){ return treeSum(i); }).join(' / ');
    trees.forEach(function(t, i){ $('tt-cnt-' + i).textContent = treeSum(i); });
    host.querySelectorAll('[data-tree]').forEach(function(b){ b.setAttribute('aria-selected', String(+b.dataset.tree === st.tree)); });
    if (free() < 0) warn('Mehr Punkte verteilt als auf dieser Stufe möglich. Entferne Punkte oder erhöhe die Stufe.'); else warn('');
    var nr = nextRec(), html = '', rows = 0;
    trees[st.tree].talente.forEach(function(t){ rows = Math.max(rows, t.reihe); });
    for (var row = 1; row <= rows; row++) {
      var cells = trees[st.tree].talente.filter(function(t){ return t.reihe === row; });
      html += '<div class="tt-req" style="grid-row:'+row+'">'+(row === 1 ? 'Start' : 'ab '+((row-1)*5))+'</div>';
      cells.forEach(function(t){
        var v = r(t.id), cls = 'tal' + (v >= t.max ? ' max' : (v ? ' part' : '')) + (!v && !canAdd(t) ? ' locked' : '') + (sel === t.id ? ' sel' : '') + (nr === t.id ? ' next' : '') + (KERN[t.id] ? ' kern' : '');
        html += '<button type="button" class="'+cls+'" style="grid-row:'+row+';grid-column:'+(t.spalte+1)+'" data-id="'+t.id+'" aria-label="'+esc(t.name)+', '+v+' von '+t.max+'">' +
          (RECSET[t.id] ? '<span class="rec" aria-hidden="true"></span>' : '') + '<span class="ico">'+icon(t.name, TREE_COL[st.tree], CLS_SVG[k.id])+'</span><span class="rk">'+v+'/'+t.max+'</span><span class="nm">'+esc(t.name)+'</span></button>';
      });
    }
    grid.innerHTML = html;
    arrows(); detail();
  }
  function arrows(){
    var g = grid.getBoundingClientRect();
    trees[st.tree].talente.forEach(function(t){ if (!t.vor || !BY[t.vor]) return;
      var a = grid.querySelector('[data-id="'+t.vor+'"] .ico'), b = grid.querySelector('[data-id="'+t.id+'"] .ico'); if (!a || !b) return;
      var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), d = document.createElement('div');
      d.className = 'arw' + (r(t.vor) >= BY[t.vor].max ? ' ok' : '');
      if (Math.abs((ra.left + ra.width/2) - (rb.left + rb.width/2)) < 4) {
        d.style.left = (ra.left + ra.width/2 - g.left) + 'px'; d.style.top = (ra.bottom - g.top + 2) + 'px'; d.style.height = Math.max(6, rb.top - ra.bottom - 4) + 'px';
      } else { /* waagrecht (gleiche Reihe) */
        d.style.width = Math.max(6, Math.abs(rb.left - ra.right) - 4) + 'px'; d.style.height = '2px'; d.style.transform = 'none';
        d.style.left = (Math.min(ra.right, rb.right) - g.left + 2) + 'px'; d.style.top = (ra.top + ra.height/2 - g.top) + 'px'; d.className += ' h';
      }
      grid.appendChild(d); });
  }
  function rankText(t){ return t.text || ''; }
  function detail(){
    var t = sel && BY[sel];
    if (!t) { $('tt-d-name').textContent = 'Talent antippen'; $('tt-d-meta').textContent = 'Tippe ein Talent an, um es zu sehen und Punkte zu setzen.'; $('tt-d-ico').innerHTML = ''; $('tt-d-text').textContent = ''; $('tt-d-why').textContent = ''; $('tt-plus').disabled = $('tt-minus').disabled = true; return; }
    $('tt-d-ico').innerHTML = icon(t.name, TREE_COL[t._tree], CLS_SVG[k.id]);
    $('tt-d-name').textContent = t.name;
    $('tt-d-meta').textContent = trees[t._tree].name + ' · Rang ' + r(t.id) + '/' + t.max + (t.en ? ' · ' + t.en : '') + (t.vor && BY[t.vor] ? ' · braucht ' + BY[t.vor].name : '');
    $('tt-d-text').textContent = rankText(t);
    var w = whyNot(t); $('tt-d-why').textContent = r(t.id) < t.max ? w.join(' ') : '';
    $('tt-plus').disabled = !canAdd(t); $('tt-minus').disabled = !canRemove(t);
  }
  function showTip(btn){
    var t = BY[btn.dataset.id]; if (!t) return;
    var w = whyNot(t);
    tip.innerHTML = '<h4>'+esc(t.name)+'</h4><div class="m">Rang '+r(t.id)+'/'+t.max+' · '+esc(trees[t._tree].name)+'</div><p>'+esc(rankText(t))+'</p>'+(r(t.id) < t.max && w.length ? '<p class="no">'+esc(w.join(' '))+'</p>' : '');
    tip.hidden = false;
    var hb = host.querySelector('.tt').getBoundingClientRect(), bb = btn.getBoundingClientRect();
    var left = Math.min(Math.max(8, bb.left - hb.left + bb.width/2 - tip.offsetWidth/2), hb.width - tip.offsetWidth - 8);
    var top = bb.top - hb.top - tip.offsetHeight - 6; if (top < 8) top = bb.bottom - hb.top + 6;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  grid.addEventListener('click', function(e){ var b = e.target.closest('.tal'); if (!b) return; var t = BY[b.dataset.id];
    if (sel === t.id && matchMedia('(hover:hover)').matches) add(t); else { sel = t.id; persist(); render(); } });
  grid.addEventListener('contextmenu', function(e){ var b = e.target.closest('.tal'); if (!b) return; e.preventDefault(); sel = b.dataset.id; rem(BY[b.dataset.id]); });
  grid.addEventListener('mouseover', function(e){ var b = e.target.closest('.tal'); if (b) showTip(b); });
  grid.addEventListener('mouseout', function(e){ if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.tal')) tip.hidden = true; });
  $('tt-plus').addEventListener('click', function(){ if (sel) add(BY[sel]); });
  $('tt-minus').addEventListener('click', function(){ if (sel) rem(BY[sel]); });
  host.querySelector('.tt-tabs').addEventListener('click', function(e){ var b = e.target.closest('[data-tree]'); if (!b) return; st.tree = +b.dataset.tree; persist(); render(); });
  function setLevel(l, rec){ st.lvl = Math.max(10, Math.min(60, l)); if (rec) { st.pts = recFor(st.lvl); var nr = ORDER.filter(function(o){ return o.stufe === st.lvl; })[0]; if (nr && BY[nr.talent]) { sel = nr.talent; st.tree = BY[nr.talent]._tree; } } persist(); render(); }
  rng.addEventListener('input', function(){ setLevel(+rng.value); });
  $('tt-lm').addEventListener('click', function(){ setLevel(st.lvl - 1); });
  $('tt-lp').addEventListener('click', function(){ setLevel(st.lvl + 1); });
  $('tt-rec').addEventListener('click', function(){ setLevel(st.lvl, true); });
  $('tt-reset').addEventListener('click', function(){ st.pts = {}; persist(); render(); });
  window.addEventListener('resize', function(){ if (document.body.contains(grid)) render(); });
  TT = { setLevel: setLevel, useOrder: function(o, kern, id, user){
    setOrder(o, kern);
    /* Beim Wechsel der Skillung (oder wenn noch nichts verteilt ist) Punkte passend zur Stufe neu setzen */
    if (user || st.sk !== id || !spent()) { st.sk = id; setLevel(st.lvl, true); } else render();
  } };
  render();
}

/* ---------- Router ---------- */
view.addEventListener('click', function(e){ var b = e.target.closest('[data-go]'); if (b) location.hash = b.dataset.go; });
function go(){
  var h = (location.hash || '').replace('#', '') || 'start';
  document.documentElement.style.setProperty('--clsraw', '#2c6232');
  TT = null;
  if (BYK[h]) { route = { v:'klasse', id:h }; renderKlasse(BYK[h]); document.title = BYK[h].name + ' · siikk-guide'; }
  else if (h.indexOf('volk-') === 0 && BYV[h.slice(5)]) { route = { v:'volk', id:h.slice(5) }; renderVolk(BYV[route.id]); }
  else if (h === 'voelker') { route = { v:'voelker' }; renderVoelker(); }
  else if (h === 'gebiete') { route = { v:'gebiete' }; renderGebiete(); }
  else if (h === 'berufe-allg') { route = { v:'berufe-allg' }; renderBerufeAllg(); }
  else if (h === 'begriffe') { route = { v:'begriffe' }; renderBegriffe(); }
  else if (h === 'addons') { route = { v:'addons' }; renderAddons(); document.title = 'siikkUI herunterladen · siikk-guide'; }
  else { route = { v:'start' }; renderStart(); }
  if (route.v !== 'klasse' && route.v !== 'addons') document.title = 'siikk-guide';
  var cr = { klasse: BYK[route.id] && BYK[route.id].name, volk: BYV[route.id] && BYV[route.id].name, voelker:'Völker', gebiete:'Leveln', 'berufe-allg':'Berufe', begriffe:'Begriffe', addons:'siikkUI Addon' }[route.v];
  document.getElementById('crumb').textContent = 'WoW: Forever' + (cr ? ' · ' + cr : ' · Klassen-Guide');
  renderSide();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', go);
go();
})();
</script>
</body></html>
