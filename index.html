{"stufe": 58, "talent": "prot_7"}, {"stufe": 59, "talent": "prot_11"}, {"stufe": 60, "talent": "prot_11"}], "rotation": [{"titel": "Ein Gegner (Verteidigungshaltung)", "schritte": ["Schildblock aktiv halten.", "Blutdurst auf Abklingzeit – macht viel Bedrohung.", "Rache, wenn möglich, sonst Rüstung zerreißen.", "Übrige Wut in Heldenhafter Stoß."]}, {"titel": "Mehrere Gegner", "schritte": ["Donnerknall und Demoralisierender Ruf (größer durch Donnernde Stimme).", "Spalten auf mehrere Ziele.", "Bei Bedarf Spott und Spöttischer Schlag."]}], "werte": "Ausdauer > Treffer > Verteidigung > Stärke > Krit (vorläufig)", "tipps": ["Nur mit guter Ausrüstung spielen, sonst lieber Schutz.", "Todeswunsch erhöht erlittenen Schaden – mit dem Heiler absprechen.", "Gut als zweiter Tank, der auch Schaden machen kann."]}]}, {"id": "paladin", "name": "Paladin", "farbe": "#F48CBA", "rollen": ["Heiler", "Tank", "Nahkampf-Schaden"], "ruestung": "Stoff, Leder, Kette, ab Stufe 40 Platte; Schilde; Buchbände im Relikt-Platz", "ressource": "Mana", "kurz": "Heiliger Krieger mit Siegeln, Segen und Auren, der heilen, tanken und im Nahkampf Schaden machen kann – in Forever erstmals auch für die Horde (Untote).", "einleitung": ["Der Paladin ist ein gepanzerter Kämpfer, der das Heilige Licht nutzt. Er trägt schwere Rüstung, heilt sich und andere und stärkt die Gruppe mit Segen und Auren.", "Kämpfen funktioniert über Siegel: Ihr aktiviert ein Siegel, das eure Schläge verstärkt, und setzt es mit Richturteil auf den Gegner frei. In Forever bleibt das Siegel dabei aktiv, und mit Heiliger Stoß gibt es schon ab Stufe 6 einen echten Angriffsknopf.", "Ihr könnt alle drei Rollen spielen: Heilig heilt, Schutz tankt (mit neuem Spott über Siegel des Furors) und Vergeltung macht Nahkampfschaden. Leveln ist langsam, aber sehr sicher – ein Paladin stirbt selten."], "staerken": ["Sehr robust beim Leveln: Platte ab 40, Selbstheilung, Gottesschild und Handauflegung (nur noch 20 Min. Abklingzeit)", "Drei spielbare Rollen; ab Stufe 40 duale Spezialisierung", "Starke Gruppen-Buffs: Segen (1 Std.), Auren, Rettung zusätzlich zum Segen", "Besonders stark gegen Untote und Dämonen (Exorzismus, Heiliger Zorn)", "Weihe ist ab Stufe 20 für alle da – brauchbarer Flächenschaden"], "schwaechen": ["Langsames Leveln, hoher Manaverbrauch ohne passende Talente", "Wenig Reichweite, kein Unterbrechungszauber, keine Verlangsamung", "Viele Fähigkeiten skalieren mit Zaubermacht – Ausrüstung ist dadurch ungewohnt gemischt", "Horde: nur Untote können Paladin werden"], "forever_neu": ["Paladin auch für die Horde: Untote können Paladin werden (Klassenquests in der Bandarion-Feste* im Flüsterwald* in Tirisfal)", "Neue Grundfähigkeit Heiliger Stoß (Stufe 6): Heiligschaden aus 50 % Waffenschaden plus Bonus", "Neues Tank-Siegel Siegel des Furors (Stufe 10): Heiligschaden pro Schlag, Absorptionsschild und Richturteil-Spott mit 10 m Reichweite", "Richturteil verbraucht das Siegel nicht mehr; Siegel verbinden gibt es nur noch über das Talent Wendung des Lichts", "Weihe (Stufe 20) und Segen der Könige sind jetzt Grundfähigkeiten statt Talente", "Rettung ist kein Segen mehr (stapelt mit einem Segen); neu: Massenrettung und Widerrufen", "Handauflegung: Abklingzeit 20 Min. statt 1 Std.; Segen halten 1 Std.", "Widerstandsauren wirken auf den ganzen Schlachtzug im Umkreis von 30 m", "Zorn der Gerechtigkeit erzeugt weniger Bedrohung", "Talentbäume stark überarbeitet: Goldmedaillen-Talente bei 11, 16, 21 und 31 Punkten (z. B. Heiliger Schock, Bollwerk des Templers, Heiliger Richter, Lichtwacht, Wendung des Lichts)", "Talente ab Stufe 10, Umskillen beim Klassenlehrer in einer Hauptstadt, duale Spezialisierung ab Stufe 40"], "voelker": [{"volk": "Mensch", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Skrupellos* (Ruthless, mehr kritische Trefferchance für Angriffe und Heilungen) hilft allen Rollen; Überlebenswille* (Will to Survive) befreit von Betäubungen; dazu Wahrnehmung und Unbeugsamkeit. Warcraft Tavern nennt Mensch die naheliegende Wahl für Vergeltung."}, {"volk": "Zwerg", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Steingestalt reinigt Blutungen, Gifte und Krankheiten und senkt körperlichen Schaden (laut Warcraft Tavern pauschal 10 %) – stark zum Tanken. Präzision des Handwerkers* (+1 % Treffer), Großwildjäger* (mehr Schaden gegen Wildtiere) und Schatzsucher."}, {"volk": "Untoter", "fraktion": "Horde", "bewertung": "gut", "warum": "Einziges Paladin-Volk der Horde. Berührung des Grabes* (5 % Chance, Gesundheit vom Ziel abzusaugen) hilft vor allem Tanks; Wille der Verlassenen befreit von Furcht, Bezauberung und Schlaf; Kannibalismus regeneriert Gesundheit und Mana."}], "specs": [{"name": "Heilig", "rolle": "Heiler", "beschreibung": "Ihr heilt mit Lichtblitz, Heiliges Licht und Heiliger Schock. Lichtinfusion verkürzt nach kritischen Treffern das nächste Heilige Licht, Lichtwacht macht Heiliger Schock zur Gruppenheilung. Als „Shockadin“ auch Schaden möglich (noch unerprobt).", "leveln": "schwach", "endspiel": "Laut Blizzard soll Heilig der stärkste Einzelziel-Heiler sein und kann nun auch Gruppen heilen. Sehr gefragt in Dungeons und Schlachtzügen."}, {"name": "Schutz", "rolle": "Tank", "beschreibung": "Schild, schnelle Einhandwaffe und Siegel des Furors. Ihr haltet Gegner mit Weihe, Heiliger Stoß und Heiliger Schild, habt mit Siegel des Furors einen echten Spott und mit Bollwerk des Templers einen großen Notfall-Schild.", "leveln": "gut", "endspiel": "Vollwertiger Tank in Dungeon und Raid, besonders stark bei Gruppen von Gegnern (Weihe). Skaliert mit Zaubermacht."}, {"name": "Vergeltung", "rolle": "Nahkampf-Schaden", "beschreibung": "Langsame Zweihandwaffe, Siegel des Befehls und Richturteil bei Abklingzeit. Champion des Lichts wandelt Intelligenz in Zaubermacht, Wendung des Lichts lässt zwei Siegel gleichzeitig wirken.", "leveln": "empfohlen", "endspiel": "Nahkampf-Schaden mit viel Gruppennutzen (Richturteile über Heiliger Richter, Segen, Auren)."}], "leveling_spec": "Vergeltung", "talente": {"baeume": [{"id": "holy", "name": "Heilig", "en": "Holy", "talente": [{"id": "holy_1", "name": "Göttliche Stärke", "en": "Divine Strength", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Erhöht eure Stärke um 2/4/6/8/10 %."}, {"id": "holy_2", "name": "Göttliche Weisheit", "en": "Divine Intellect", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht eure gesamte Intelligenz um 2/4/6/8/10 %."}, {"id": "holy_3", "name": "Heilendes Licht", "en": "Healing Light", "reihe": 2, "spalte": 1, "max": 3, "vor": null, "text": "Erhöht die Heilung von Heiliges Licht, Lichtblitz und Heiliger Schock um 4/8/12 %. In Forever von Reihe 3 nach Reihe 2 verschoben."}, {"id": "holy_4", "name": "Spiritueller Fokus", "en": "Spiritual Focus", "reihe": 2, "spalte": 2, "max": 2, "vor": null, "text": "Lichtblitz, Heiliges Licht und Lichtwacht haben eine Chance von 35/70 %, durch erlittenen Schaden keine Zauberzeit zu verlieren. Kostet nur noch 2 statt 5 Punkte."}, {"id": "holy_5", "name": "Verbesserte Siegel", "en": "Improved Seals", "reihe": 2, "spalte": 3, "max": 3, "vor": null, "text": "Erhöht den Schaden aller eurer Siegel und Richturteile um 5/10/15 % (früher nur Siegel der Rechtschaffenheit)."}, {"id": "holy_6", "name": "Unerschütterlicher Glaube", "en": "Unyielding Faith", "reihe": 2, "spalte": 4, "max": 2, "vor": null, "text": "Verkürzt die Dauer von Furcht- und Desorientierungseffekten auf euch um 15/30 %."}, {"id": "holy_7", "name": "Stimme der Wahrheit", "en": "Voice of Truth", "reihe": 3, "spalte": 1, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (11 Punkte), neue aktive Fähigkeit: macht euch 6 Sek. lang immun gegen Stille- und Unterbrechungseffekte. Abklingzeit 3 Min."}, {"id": "holy_8", "name": "Andacht", "en": "Reverence", "reihe": 3, "spalte": 2, "max": 3, "vor": null, "text": "10/20/30 % eurer Manaregeneration aus Willenskraft laufen auch während des Zauberwirkens weiter."}, {"id": "holy_9", "name": "Reinigende Macht", "en": "Purifying Power", "reihe": 3, "spalte": 3, "max": 2, "vor": null, "text": "Senkt die Manakosten von Läuterung und Läutern um 10/20 % und die Abklingzeit von Exorzismus und Heiliger Zorn um 16,5/33 %."}, {"id": "holy_10", "name": "Lichtinfusion", "en": "Infusion of Light", "reihe": 4, "spalte": 1, "max": 2, "vor": null, "text": "Kritische Treffer mit Heiliger Schock oder Lichtblitz verkürzen die Zauberzeit eures nächsten Heiligen Lichts innerhalb von 15 Sek. um 0,5/1 Sek."}, {"id": "holy_11", "name": "Illumination", "en": "Illumination", "reihe": 4, "spalte": 2, "max": 5, "vor": "holy_8", "text": "Kritische Heilungen mit Lichtblitz, Heiliges Licht, Lichtwacht oder Heiliger Schock haben eine Chance von 20/40/60/80/100 %, Mana in Höhe von 50 % der Grundkosten des Zaubers zurückzugeben. Benötigt Andacht."}, {"id": "holy_12", "name": "Göttliche Gunst", "en": "Divine Favor", "reihe": 4, "spalte": 3, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (16 Punkte), aktiv: Euer nächster Lichtblitz, euer nächstes Heiliges Licht oder euer nächster Heiliger Schock trifft garantiert kritisch."}, {"id": "holy_13", "name": "Göttliche Präzision", "en": "Divine Precision", "reihe": 5, "spalte": 1, "max": 3, "vor": "holy_14", "text": "Erhöht eure Trefferchance mit Heiligzaubern um 6/12/18 %. Benötigt Heiliger Schock."}, {"id": "holy_14", "name": "Heiliger Schock", "en": "Holy Shock", "reihe": 5, "spalte": 2, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (21 Punkte), Spontanzauber: verursacht bei einem Gegner 129–139 Heiligschaden oder heilt einen Verbündeten um 110–118 (Rang 1, höhere Ränge beim Lehrer). Abklingzeit nur noch 10 statt 30 Sek."}, {"id": "holy_15", "name": "Geweihter Boden", "en": "Consecrated Ground", "reihe": 5, "spalte": 3, "max": 2, "vor": null, "text": "Eure Heiligzauber verursachen bei den ersten 4 Gegnern, die eure Weihe betreten, 5/10 % mehr Schaden."}, {"id": "holy_16", "name": "Heilige Kraft", "en": "Holy Power", "reihe": 6, "spalte": 2, "max": 5, "vor": null, "text": "Erhöht die kritische Trefferchance von Heiliger Schock und Heiliger Stoß um 3/6/9/12/15 % und die eurer übrigen Zauber um 1/2/3/4/5 %."}, {"id": "holy_17", "name": "Lichtwacht", "en": "Light's Vigil", "reihe": 7, "spalte": 2, "max": 1, "vor": "holy_14", "text": "Goldmedaillen-Talent (31 Punkte), benötigt Heiliger Schock. 1,5 Sek. Zauberzeit, 6 Sek. Abklingzeit, hält 30 Sek.: Euer nächster Heiliger Schock auf dieses Ziel löst keine Abklingzeit aus. Auf Gegnern: zusätzlich 175–189 Heiligschaden und 75 % Manarückerstattung. Auf Verbündeten: heilt die ganze Gruppe um 315–333. Pro Gruppe kann nur ein Verbündeter Lichtwacht tragen."}]}, {"id": "protection", "name": "Schutz", "en": "Protection", "talente": [{"id": "prot_1", "name": "Zähigkeit", "en": "Toughness", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Erhöht den Rüstungswert eurer Gegenstände um 2/4/6/8/10 %. In Forever von Reihe 2 nach Reihe 1 verschoben."}, {"id": "prot_2", "name": "Verschanzen", "en": "Redoubt", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Werdet ihr getroffen, habt ihr eine Chance von 10 %, eure Blockchance für 10 Sek. oder 5 Blocks um 4/8/12/16/20 % zu erhöhen. Braucht keinen erlittenen kritischen Treffer mehr."}, {"id": "prot_3", "name": "Präzision", "en": "Precision", "reihe": 2, "spalte": 1, "max": 3, "vor": null, "text": "Erhöht eure Trefferchance mit allen Zaubern und Angriffen um 1/2/3 % (früher nur Nahkampf)."}, {"id": "prot_4", "name": "Gunst des Wächters", "en": "Guardian's Favor", "reihe": 2, "spalte": 2, "max": 2, "vor": null, "text": "Verringert die Abklingzeit von Segen des Schutzes um 60/120 Sek. und verlängert Segen der Freiheit um 3/6 Sek. (unverändert aus Classic)."}, {"id": "prot_5", "name": "Erwartung", "en": "Anticipation", "reihe": 2, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht eure Verteidigung um 4/8/12/16/20 (früher max. 10). In Forever von Reihe 3 nach Reihe 2 verschoben."}, {"id": "prot_6", "name": "Verbessertes Siegel des Furors", "en": "Improved Seal of Fury", "reihe": 3, "spalte": 1, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (11 Punkte): Wird der Absorptionsschild von Siegel des Furors vollständig verbraucht, erhaltet ihr Mana zurück – gegen höherstufige Angreifer (z. B. Raidbosse) mehr."}, {"id": "prot_7", "name": "Verbesserter Zorn der Gerechtigkeit", "en": "Improved Righteous Fury", "reihe": 3, "spalte": 2, "max": 3, "vor": null, "text": "Solange Zorn der Gerechtigkeit aktiv ist, erleidet ihr 2/4/6 % weniger Schaden. Erhöht die Bedrohung nicht mehr."}, {"id": "prot_8", "name": "Schildspezialisierung", "en": "Shield Specialization", "reihe": 3, "spalte": 3, "max": 3, "vor": null, "text": "Erhöht den Blockwert eures Schildes um bis zu 30 %. Eure Blocks haben eine Chance von bis zu 100 %, 6 % eures maximalen Manas wiederherzustellen (höchstens einmal alle 3 Sek.)."}, {"id": "prot_9", "name": "Heilige Pflicht", "en": "Sacred Duty", "reihe": 3, "spalte": 4, "max": 2, "vor": null, "text": "Erhöht eure gesamte Ausdauer um 2/4 % und verkürzt die Abklingzeit von Gottesschild, Göttlicher Schutz und Bollwerk des Templers um 30/60 Sek."}, {"id": "prot_10", "name": "Schnelles Richturteil", "en": "Swift Judgement", "reihe": 4, "spalte": 1, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (16 Punkte), neue Fähigkeit ohne Manakosten, 1 Min. Abklingzeit: Beendet sofort die Abklingzeit von Richturteil, und euer nächstes Richturteil kostet kein Mana. Ideal als zweiter Spott."}, {"id": "prot_11", "name": "Einhandwaffenspezialisierung", "en": "One-Handed Weapon Specialization", "reihe": 4, "spalte": 2, "max": 3, "vor": null, "text": "Erhöht euren Schaden mit Einhandwaffen um bis zu 10 % (bei 3/3). In Forever von Reihe 6 nach Reihe 4 verschoben, nur noch 3 statt 5 Punkte."}, {"id": "prot_12", "name": "Verbesserter Hammer der Gerechtigkeit", "en": "Improved Hammer of Justice", "reihe": 4, "spalte": 3, "max": 3, "vor": null, "text": "Verringert die Abklingzeit von Hammer der Gerechtigkeit um 5/10/15 Sek."}, {"id": "prot_13", "name": "Bollwerk des Templers", "en": "Templar's Bulwark", "reihe": 5, "spalte": 2, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (21 Punkte), Spontanzauber, 5 Min. Abklingzeit: Ein Schild absorbiert 8 Sek. lang Schaden in Höhe von 100 % eurer maximalen Gesundheit. Löst Vorahnung aus und ist während Vorahnung nicht nutzbar."}, {"id": "prot_14", "name": "Abrechnung", "en": "Reckoning", "reihe": 5, "spalte": 3, "max": 5, "vor": null, "text": "Nach einem geblockten Nahkampfangriff (Chance 8/16/24/32/40 %, höchstens alle 1,5 Sek.) oder einem erlittenen kritischen Treffer (Chance 20/40/60/80/100 %) erhaltet ihr eine Aufladung für einen zusätzlichen Angriff (bis zu 4 Aufladungen)."}, {"id": "prot_15", "name": "Eiserner Glaube", "en": "Iron Creed", "reihe": 6, "spalte": 3, "max": 5, "vor": null, "text": "Heiliger Stoß erzeugt 3/6/9/12/15 % mehr Bedrohung. Ist Zorn der Gerechtigkeit aktiv, verringert Heiliger Stoß außerdem 6 Sek. lang euren erlittenen Schaden um 2/4/6/8/10 %."}, {"id": "prot_16", "name": "Heiliger Schild", "en": "Holy Shield", "reihe": 7, "spalte": 2, "max": 1, "vor": "prot_13", "text": "Erhöht eure Blockchance 10 Sek. lang um 20 % (Classic: 30 %); jeder Block (bis zu 4 Aufladungen) verursacht Heiligschaden beim Angreifer. Benötigt jetzt Bollwerk des Templers."}]}, {"id": "retribution", "name": "Vergeltung", "en": "Retribution", "talente": [{"id": "ret_1", "name": "Segnung", "en": "Benediction", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Senkt die Manakosten aller Spontanzauber und -fähigkeiten um 2/4/6/8/10 % (früher nur Siegel und Richturteil)."}, {"id": "ret_2", "name": "Abwehr", "en": "Deflection", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht eure Parierchance um 1/2/3/4/5 %. In Forever von Reihe 2 nach Reihe 1 verschoben."}, {"id": "ret_3", "name": "Verbessertes Richturteil", "en": "Improved Judgement", "reihe": 2, "spalte": 1, "max": 2, "vor": null, "text": "Verringert die Abklingzeit von Richturteil um 1/2 Sek."}, {"id": "ret_4", "name": "Heiliges Medium", "en": "Holy Conduit", "reihe": 2, "spalte": 2, "max": 2, "vor": null, "text": "Senkt die Manakosten von Weihe, Heiliger Zorn und Exorzismus um 20/40 %."}, {"id": "ret_5", "name": "Überzeugung", "en": "Conviction", "reihe": 2, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht eure kritische Trefferchance mit Nahkampfangriffen um 1/2/3/4/5 %. In Forever von Reihe 3 nach Reihe 2 verschoben."}, {"id": "ret_6", "name": "Rechtschaffene Schwächung", "en": "Vindication", "reihe": 3, "spalte": 1, "max": 3, "vor": null, "text": "Eure Nahkampftreffer haben eine Chance, die Angriffskraft des Ziels zu senken und eure eigene Angriffskraft 30 Sek. lang um 1/2/3 % zu erhöhen."}, {"id": "ret_7", "name": "Gesegnetes Richturteil", "en": "Sanctified Judgement", "reihe": 3, "spalte": 2, "max": 3, "vor": null, "text": "Euer Richturteil hat eine Chance von bis zu 100 %, bis zu 60 % der Manakosten des ausgelösten Siegels zurückzuerstatten (Werte bei 3/3)."}, {"id": "ret_8", "name": "Siegel des Befehls", "en": "Seal of Command", "reihe": 3, "spalte": 3, "max": 1, "vor": null, "text": "Siegel für 30 Sek.: Eure Nahkampftreffer haben eine Chance, zusätzlich Heiligschaden in Höhe von 70 % des Waffenschadens zu verursachen. Das Richturteil verursacht gegen betäubte oder handlungsunfähige Ziele mehr Schaden."}, {"id": "ret_9", "name": "Streben nach Gerechtigkeit", "en": "Pursuit of Justice", "reihe": 3, "spalte": 4, "max": 2, "vor": null, "text": "Erhöht euer Bewegungstempo (auch beritten) um bis zu 15 % (früher 8 %); nicht mit anderen Tempo-Effekten stapelbar."}, {"id": "ret_10", "name": "Auge um Auge", "en": "Eye for an Eye", "reihe": 4, "spalte": 2, "max": 2, "vor": null, "text": "Erleidet ihr einen kritischen Treffer, wird 5/10 % des Schadens auf den Angreifer zurückgeworfen (früher 30 %, nur Zauber). Reihe vorläufig: laut Blizzard-Text Reihe 5, laut Talentrechnern Reihe 4."}, {"id": "ret_11", "name": "Heiliger Richter", "en": "Sacred Arbiter", "reihe": 4, "spalte": 3, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (16 Punkte): Heiliger Stoß verursacht 20 % mehr Schaden und erneuert alle Richturteil-Effekte auf dem Ziel – auch die anderer Paladine."}, {"id": "ret_12", "name": "Zweihandwaffenspezialisierung", "en": "Two-Handed Weapon Specialization", "reihe": 5, "spalte": 1, "max": 3, "vor": null, "text": "Erhöht euren Schaden mit Zweihandwaffen um bis zu 9 % bei 3/3 (vorläufiger Beta-Wert)."}, {"id": "ret_13", "name": "Rache", "en": "Vengeance", "reihe": 5, "spalte": 2, "max": 3, "vor": "ret_7", "text": "Nach einem kritischen Treffer verursacht ihr 30 Sek. lang 1/2/3 % mehr Schaden, bis zu 3-mal stapelbar (max. 9 %). Benötigt Gesegnetes Richturteil."}, {"id": "ret_14", "name": "Buße", "en": "Repentance", "reihe": 5, "spalte": 3, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (21 Punkte, früher 31): Macht einen Humanoiden bis zu 6 Sek. handlungsunfähig. Jeder Schaden beendet den Effekt."}, {"id": "ret_15", "name": "Champion des Lichts", "en": "Champion of the Light", "reihe": 6, "spalte": 2, "max": 3, "vor": null, "text": "Erhöht euren Zauberschaden um 10/20/30 % eurer Intelligenz (keine Heilung)."}, {"id": "ret_16", "name": "Rechtsvollstrecker", "en": "Instrument of Law", "reihe": 6, "spalte": 3, "max": 2, "vor": null, "text": "Verringert die Zauberzeit von Hammer des Zorns um 0,5/1 Sek. (bei 2/2 sofort) und senkt eure gesamte Bedrohung um 20 %, solange Zorn der Gerechtigkeit nicht aktiv ist."}, {"id": "ret_17", "name": "Wendung des Lichts", "en": "Twist of Light", "reihe": 7, "spalte": 2, "max": 1, "vor": null, "text": "Goldmedaillen-Talent (31 Punkte): Senkt die Manakosten eurer Siegel um 20 %. Ersetzt ihr ein Schadens-Siegel durch ein anderes, hinterlässt es ein Echo – euer nächster Nahkampfangriff löst die Effekte des alten und des neuen Siegels aus (Ersatz für das alte „Siegel verbinden“)."}]}]}, "talent_reihenfolge": [{"stufe": 10, "talent": "holy_1"}, {"stufe": 11, "talent": "holy_1"}, {"stufe": 12, "talent": "holy_1"}, {"stufe": 13, "talent": "holy_1"}, {"stufe": 14, "talent": "holy_1"}, {"stufe": 15, "talent": "holy_5"}, {"stufe": 16, "talent": "holy_5"}, {"stufe": 17, "talent": "holy_5"}, {"stufe": 18, "talent": "ret_1"}, {"stufe": 19, "talent": "ret_1"}, {"stufe": 20, "talent": "ret_1"}, {"stufe": 21, "talent": "ret_1"}, {"stufe": 22, "talent": "ret_1"}, {"stufe": 23, "talent": "ret_4"}, {"stufe": 24, "talent": "ret_3"}, {"stufe": 25, "talent": "ret_3"}, {"stufe": 26, "talent": "ret_5"}, {"stufe": 27, "talent": "ret_5"}, {"stufe": 28, "talent": "ret_9"}, {"stufe": 29, "talent": "ret_9"}, {"stufe": 30, "talent": "ret_7"}, {"stufe": 31, "talent": "ret_7"}, {"stufe": 32, "talent": "ret_7"}, {"stufe": 33, "talent": "ret_11"}, {"stufe": 34, "talent": "ret_5"}, {"stufe": 35, "talent": "ret_5"}, {"stufe": 36, "talent": "ret_5"}, {"stufe": 37, "talent": "ret_8"}, {"stufe": 38, "talent": "ret_13"}, {"stufe": 39, "talent": "ret_13"}, {"stufe": 40, "talent": "ret_13"}, {"stufe": 41, "talent": "ret_12"}, {"stufe": 42, "talent": "ret_12"}, {"stufe": 43, "talent": "ret_12"}, {"stufe": 44, "talent": "ret_6"}, {"stufe": 45, "talent": "ret_6"}, {"stufe": 46, "talent": "ret_6"}, {"stufe": 47, "talent": "ret_15"}, {"stufe": 48, "talent": "ret_15"}, {"stufe": 49, "talent": "ret_15"}, {"stufe": 50, "talent": "ret_17"}, {"stufe": 51, "talent": "holy_2"}, {"stufe": 52, "talent": "holy_2"}, {"stufe": 53, "talent": "holy_2"}, {"stufe": 54, "talent": "holy_2"}, {"stufe": 55, "talent": "holy_2"}, {"stufe": 56, "talent": "holy_4"}, {"stufe": 57, "talent": "holy_4"}, {"stufe": 58, "talent": "holy_8"}, {"stufe": 59, "talent": "holy_8"}, {"stufe": 60, "talent": "holy_8"}], "talent_endspiel": [{"name": "Heiler (Heilig, Raid/Dungeon)", "punkte": "32/14/5", "verteilung": {"holy_2": 5, "holy_3": 3, "holy_4": 2, "holy_6": 1, "holy_7": 1, "holy_8": 3, "holy_9": 2, "holy_10": 2, "holy_11": 5, "holy_12": 1, "holy_14": 1, "holy_16": 5, "holy_17": 1, "prot_1": 5, "prot_5": 5, "prot_4": 2, "prot_9": 2, "ret_1": 5}, "hinweis": "Nach Rankedboost (vorläufig): Manaökonomie (Andacht, Illumination, Segnung) und Lichtwacht als Gruppenheilung. Die drei 1-Punkt-Talente Stimme der Wahrheit, Göttliche Gunst und Heiliger Schock sind aus den Symbolen abgeleitet."}, {"name": "Tank (Schutz, Dungeon/Raid)", "punkte": "8/38/5", "verteilung": {"holy_2": 5, "holy_5": 3, "prot_1": 5, "prot_2": 5, "prot_3": 3, "prot_5": 5, "prot_7": 3, "prot_8": 3, "prot_9": 2, "prot_13": 1, "prot_14": 5, "prot_15": 5, "prot_16": 1, "ret_2": 5}, "hinweis": "Nach Rankedboost (vorläufig): Blocken, Verteidigung und Heiliger Schild. Wer mehr Mana braucht, tauscht Punkte gegen Verbessertes Siegel des Furors oder Schnelles Richturteil (zweiter Spott)."}, {"name": "Nahkampf-Schaden (Vergeltung)", "punkte": "9/8/34", "verteilung": {"holy_1": 5, "holy_2": 1, "holy_5": 3, "prot_1": 5, "prot_3": 3, "ret_1": 5, "ret_3": 2, "ret_4": 2, "ret_5": 5, "ret_6": 3, "ret_7": 3, "ret_8": 1, "ret_11": 1, "ret_12": 3, "ret_13": 3, "ret_15": 3, "ret_16": 2, "ret_17": 1}, "hinweis": "Nach Rankedboost (vorläufig): Zweihandwaffe, Siegel des Befehls plus Wendung des Lichts. Der Punkt in Siegel des Befehls ist ergänzt (die Quelle nennt 34 Punkte, listet aber nur 33)."}], "talent_hinweise": ["Stufe 10–17: Göttliche Stärke und Verbesserte Siegel in Heilig – so empfiehlt es Method; beides stärkt sofort euren Schaden mit Siegel der Rechtschaffenheit.", "Ab Stufe 18 geht es in Vergeltung: Segnung und Heiliges Medium senken die Manakosten, Streben nach Gerechtigkeit macht euch schneller (15 %), Heiliger Richter (Stufe 33) verstärkt Heiliger Stoß.", "Ab Stufe 37 Siegel des Befehls mit langsamer Zweihandwaffe; Rache, Zweihandwaffenspezialisierung und Champion des Lichts erhöhen den Schaden, Wendung des Lichts auf Stufe 50 ist der Abschluss. Die letzten 10 Punkte gehen in Heilig für Mana (Göttliche Weisheit, Andacht).", "Der Endstand entspricht dem Rankedboost-Leveling-Build (18/0/33); die Reihenfolge der Punkte ist daraus abgeleitet und vorläufig.", "Wer tanken will: Warcraft Tavern empfiehlt trotzdem, zunächst in Vergeltung zu leveln. Ab Stufe 40 könnt ihr mit der dualen Spezialisierung einen Tank- oder Heiler-Build als zweite Skillung nutzen.", "Vorläufig: Alle Talentdaten stammen aus Beta-Talentrechnern (Guild Order, wowtbc.gg) und Blizzards Klassenüberblick und können sich zum Start ändern. Die Spalten innerhalb einer Reihe sind aus der Reihenfolge der Talentrechner abgeleitet, die Reihe von Auge um Auge ist uneinheitlich angegeben.", "In älteren Beta-Versionen gab es das Talent Verbesserter Heiliger Stoß*; es fehlt in den aktuellen Talentrechnern.", "Einige deutsche Namen unveränderter Classic-Talente (z. B. Gunst des Wächters, Göttliche Stärke, Zweihandwaffenspezialisierung) konnten nicht direkt im deutschen Client geprüft werden."], "faehigkeiten": [{"name": "Siegel der Rechtschaffenheit", "en": "Seal of Righteousness", "stufe": 1, "art": "Angriff", "text": "Jeder Nahkampftreffer macht zusätzlichen Heiligschaden. Euer Standard-Siegel beim Leveln – immer aktiv halten.", "wichtig": true}, {"name": "Heiliges Licht", "en": "Holy Light", "stufe": 1, "art": "Heilung", "text": "Langsame, starke Heilung. Zum Hochheilen nach dem Kampf oder für große Treffer auf den Tank.", "wichtig": true}, {"name": "Aura der Hingabe", "en": "Devotion Aura", "stufe": 1, "art": "Buff", "text": "Erhöht die Rüstung eurer Gruppe. Gute Aura, wenn viel körperlicher Schaden reinkommt.", "wichtig": false}, {"name": "Segen der Macht", "en": "Blessing of Might", "stufe": 4, "art": "Buff", "text": "Erhöht die Angriffskraft. Segen dauern in Forever 1 Stunde. Euer Leveling-Segen als Vergelter.", "wichtig": true}, {"name": "Richturteil", "en": "Judgement", "stufe": 4, "art": "Angriff", "text": "Entlädt das aktive Siegel auf den Gegner. In Forever verbraucht es das Siegel NICHT mehr und liegt nicht auf der globalen Abklingzeit – also immer bei Abklingzeit nutzen.", "wichtig": true}, {"name": "Siegel des Kreuzfahrers", "en": "Seal of the Crusader", "stufe": 6, "art": "Buff", "text": "Siegel, dessen Richturteil das Ziel anfälliger für Heiligschaden macht. Vor langen Kämpfen einmal richten, dann zum Schadens-Siegel wechseln. (Stufe wie in Classic, vorläufig)", "wichtig": false}, {"name": "Göttlicher Schutz", "en": "Divine Protection", "stufe": 6, "art": "Schutz", "text": "Kurze Unverwundbarkeit, ihr könnt aber nicht angreifen. Notknopf, um euch danach hochzuheilen.", "wichtig": true}, {"name": "Heiliger Stoß", "en": "Holy Strike", "stufe": 6, "art": "Angriff", "text": "NEU: sofortiger Angriff, der Heiligschaden in Höhe von 50 % des Waffenschadens plus Bonus verursacht. Bei Abklingzeit nutzen – Kern jeder Rotation.", "wichtig": true}, {"name": "Hammer der Gerechtigkeit", "en": "Hammer of Justice", "stufe": 8, "art": "Kontrolle", "text": "Betäubt das Ziel (Rang 1: 3 Sek.). Für fliehende Gegner, gefährliche Zauber oder Notfälle.", "wichtig": true}, {"name": "Läutern", "en": "Purify", "stufe": 8, "art": "Heilung", "text": "Entfernt Gift und Krankheit von einem Verbündeten.", "wichtig": false}, {"name": "Segen des Schutzes", "en": "Blessing of Protection", "stufe": 10, "art": "Schutz", "text": "Macht einen Verbündeten kurz immun gegen körperlichen Schaden (löst Vorahnung aus). Rettet Stoffträger, die Gegner gezogen haben.", "wichtig": false}, {"name": "Handauflegung", "en": "Lay on Hands", "stufe": 10, "art": "Heilung", "text": "Heilt voll, kostet aber euer ganzes Mana. Abklingzeit in Forever nur noch 20 Min. statt 1 Std.", "wichtig": true}, {"name": "Siegel des Furors", "en": "Seal of Fury", "stufe": 10, "art": "Angriff", "text": "NEU, Tank-Siegel: Heiligschaden bei jedem Schlag (gut mit schnellen Waffen) und ein kleiner Absorptionsschild. Das Richturteil darauf ist ein Spott mit 10 m Reichweite.", "wichtig": true}, {"name": "Zorn der Gerechtigkeit", "en": "Righteous Fury", "stufe": 10, "art": "Haltung", "text": "Erhöht die Bedrohung eurer Heiligzauber (in Forever schwächer als in Classic). Als Tank immer an, sonst aus. (Laut Warcraft Tavern erst ab Stufe 16, vorläufig)", "wichtig": true}, {"name": "Erlösung", "en": "Redemption", "stufe": 12, "art": "Sonstiges", "text": "Belebt einen toten Spieler wieder. Gibt es über die Klassenquest auf Stufe 12.", "wichtig": false}, {"name": "Segen der Weisheit", "en": "Blessing of Wisdom", "stufe": 14, "art": "Buff", "text": "Mehr Manaregeneration (Rang 1: 40 Mana alle 5 Sek. statt 33). Für Heiler und Manaklassen.", "wichtig": false}, {"name": "Vergeltungsaura", "en": "Retribution Aura", "stufe": 16, "art": "Buff", "text": "Angreifer erleiden Heiligschaden. Die Standard-Aura beim Leveln; skaliert mit Zaubermacht.", "wichtig": true}, {"name": "Segen der Freiheit", "en": "Blessing of Freedom", "stufe": 18, "art": "Bewegung", "text": "Befreit ein Ziel von Verlangsamung und Bewegungsunfähigkeit.", "wichtig": false}, {"name": "Segen der Könige", "en": "Blessing of Kings", "stufe": 20, "art": "Buff", "text": "Erhöht alle Werte um 10 %. Jetzt für alle Paladine ab Stufe 20 (kein Talent mehr).", "wichtig": true}, {"name": "Weihe", "en": "Consecration", "stufe": 20, "art": "Angriff", "text": "Heiligt den Boden: hoher Schaden für die ersten 4 Gegner, die die Fläche betreten, wenig für weitere. Jetzt Grundfähigkeit für alle – euer Flächenschaden.", "wichtig": true}, {"name": "Exorzismus", "en": "Exorcism", "stufe": 20, "art": "Angriff", "text": "Starker Heiligschaden gegen Untote und Dämonen. Gegen diese Gegner bei Abklingzeit nutzen.", "wichtig": true}, {"name": "Lichtblitz", "en": "Flash of Light", "stufe": 20, "art": "Heilung", "text": "Schnelle, günstige Heilung. Die Haupttaste für Heiler.", "wichtig": true}, {"name": "Aura der Konzentration", "en": "Concentration Aura", "stufe": 22, "art": "Buff", "text": "Weniger Zauberverzögerung durch Schaden. Für Heiler, die viel getroffen werden.", "wichtig": false}, {"name": "Siegel der Gerechtigkeit", "en": "Seal of Justice", "stufe": 22, "art": "Kontrolle", "text": "Treffer können den Gegner kurz betäuben; das Richturteil verhindert Flucht. Vor allem für PvP.", "wichtig": false}, {"name": "Untote vertreiben", "en": "Turn Undead", "stufe": 24, "art": "Kontrolle", "text": "Lässt einen Untoten fliehen.", "wichtig": false}, {"name": "Rettung", "en": "Salvation", "stufe": 26, "art": "Buff", "text": "Senkt die Bedrohung eines Ziels (laut Conquest Capped um 30 %, 1 Std.). Ist kein Segen mehr und liegt zusätzlich zu einem Segen. Auf alle außer den Tank. Auf Stufe 60 kommt die Schlachtzugsversion Massenrettung (laut Blizzard noch nicht im Spiel, vorläufig).", "wichtig": true}, {"name": "Widerrufen", "en": "Revoke", "stufe": 26, "art": "Sonstiges", "text": "NEU: Entfernt Rettung oder Massenrettung von einem Gruppen- oder Schlachtzugsmitglied (z. B. vom Tank).", "wichtig": false}, {"name": "Aura des Schattenwiderstands", "en": "Shadow Resistance Aura", "stufe": 28, "art": "Buff", "text": "Mehr Schattenwiderstand – wirkt jetzt auf alle Schlachtzugsmitglieder im Umkreis von 30 m. Feuer- (36) und Frostwiderstandsaura (32) funktionieren genauso.", "wichtig": false}, {"name": "Göttliches Eingreifen", "en": "Divine Intervention", "stufe": 30, "art": "Schutz", "text": "Opfert euch, um einen Verbündeten 3 Min. lang zu schützen. Im Raid zur Wipe-Vorsorge auf einen Heiler.", "wichtig": false}, {"name": "Siegel des Lichts", "en": "Seal of Light", "stufe": 30, "art": "Buff", "text": "Das Richturteil darauf lässt Angriffe auf das Ziel Angreifer heilen. Nützlich in Gruppen.", "wichtig": false}, {"name": "Gottesschild", "en": "Divine Shield", "stufe": 34, "art": "Schutz", "text": "Volle Unverwundbarkeit für kurze Zeit (löst Vorahnung aus). Euer wichtigster Notknopf.", "wichtig": true}, {"name": "Siegel der Weisheit", "en": "Seal of Wisdom", "stufe": 38, "art": "Buff", "text": "Das Richturteil darauf lässt Angriffe auf das Ziel Mana zurückgeben.", "wichtig": false}, {"name": "Segen des Lichts", "en": k", "stufe": 30, "art": "Heilung", "text": "Talent (Heilig): sofortiger Heiligschaden oder Heilung, 10 Sek. Abklingzeit. Kern des Heiligpaladins.", "wichtig": true}, {"name": "Lichtwacht", "en": "Light's Vigil", "stufe": 40, "art": "Heilung", "text": "Talent (Heilig, 31 Punkte): Markiert ein Ziel; der nächste Heilige Schock darauf hat keine Abklingzeit. Auf Verbündeten zusätzlich Gruppenheilung.", "wichtig": true}, {"name": "Bollwerk des Templers", "en": "Templar's Bulwark", "stufe": 30, "art": "Schutz", "text": "Talent (Schutz): absorbiert 8 Sek. lang Schaden in Höhe eurer maximalen Gesundheit, 5 Min. Abklingzeit.", "wichtig": true}, {"name": "Heiliger Schild", "en": "Holy Shield", "stufe": 40, "art": "Schutz", "text": "Talent (Schutz): +20 % Blockchance für 10 Sek.; Blocks verursachen Heiligschaden. Als Tank dauerhaft aktiv halten.", "wichtig": true}], "rotation": [{"titel": "Leveln: ein Gegner (Vergeltung)", "schritte": ["Vor dem Kampf: Segen der Macht und Vergeltungsaura aktiv halten.", "Siegel der Rechtschaffenheit aktivieren (ab Stufe 37 mit Zweihandwaffe: Siegel des Befehls).", "Beim Heranlaufen Richturteil – das Siegel bleibt in Forever aktiv.", "Heiliger Stoß und Richturteil immer bei Abklingzeit nutzen, Siegel erneuern, wenn es ausläuft.", "Exorzismus gegen Untote und Dämonen; Hammer der Gerechtigkeit gegen fliehende Gegner.", "Zum Heilen: erst Göttlicher Schutz, dann Heiliges Licht."]}, {"titel": "Leveln: mehrere Gegner", "schritte": ["Ab Stufe 20 Weihe in die Gegnergruppe legen – sie trifft die ersten 4 Gegner hart.", "Danach normal Heiliger Stoß und Richturteil weiter nutzen.", "Heiliges Medium senkt die hohen Manakosten von Weihe."]}, {"titel": "Dungeon/Raid: Vergeltung", "schritte": ["Vor dem Pull Siegel des Kreuzfahrers und damit Richturteil auf den Boss.", "Danach Siegel des Befehls dauerhaft aktiv halten.", "Richturteil bei Abklingzeit, Heiliger Stoß bei Abklingzeit (erneuert mit Heiliger Richter alle Richturteile auf dem Ziel).", "Weihe aktiv halt "talent": "holy_16"}, {"stufe": 56, "talent": "holy_16"}, {"stufe": 57, "talent": "holy_16"}, {"stufe": 58, "talent": "holy_16"}, {"stufe": 59, "talent": "holy_16"}, {"stufe": 60, "talent": "holy_17"}], "rotation": [{"titel": "Ein Gegner (PvP)", "schritte": ["Siegel des Befehls, Richturteil beim Heranlaufen.", "Heiliger Stoß und Richturteil auf Abklingzeit.", "Göttliche Gunst plus Heiliger Schock als Schadensspitze.", "Hammer der Gerechtigkeit, dann Schaden oder Heilung."]}, {"titel": "Gruppe", "schritte": ["Lichtwacht und Heiliger Schock auf Verbündete bei Bedarf.", "Sonst Nahkampf mit Heiliger Stoß.", "Segen der Freiheit gegen Verlangsamung."]}], "werte": "Zaubermacht > Stärke > Intelligenz > Krit > Ausdauer", "tipps": ["Krit erhöhen: Heilige Kraft und Illumination wirken zusammen.", "Zum Leveln besser Vergeltung nehmen.", "Vorläufig: Werte von Heiliger Schock in Forever können sich noch ändern."]}]}, {"id": "hunter", "name": "Jäger", "farbe": "#AAD372", "rollen": ["Fernkampf-Schaden"], "ruestung": "Stoff, Leder, ab Stufe 40 Schwere Rüstung (Kette)", "ressource": "Mana (Begleiter: Fokus)", "kurz": "Fernkämpfer mit treuem Tierbegleiter, der aus großer Distanz Schaden macht und seinen Begleiter für sich tanken lässt.", "einleitung": ["Der Jäger kämpft mit Bogen, Armbrust oder Gewehr aus der Ferne. Ab Stufe 10 zähmst du ein wildes Tier, das an deiner Seite kämpft und beim Leveln die Gegner für dich festhält.", "Das macht den Jäger zu einer der einfachsten und schnellsten Klassen zum Leveln: Das Tier tankt, du schießt. In Forever wird der Begleiter mit deiner Ausrüstung stärker und du bekommst neue Talente wie Falke beschwören oder Heckenschützenschuss.", "Wichtig für Anfänger: Zwischen Nahkampf und 8 Metern kannst du gar nicht angreifen (Totzone). Halte Abstand, nutze Fallen und Verlangsamungen und kümmere dich gut um deinen Begleiter."], "staerken": ["Sehr schnelles und sicheres Leveln dank Begleiter als Tank", "Größte Reichweite aller Klassen (mit Falkenauge und Heckenschützenschuss noch mehr)", "Totstellen als Rettung, wenn etwas schiefgeht", "Fallen jetzt auch im Kampf nutzbar – starke Kontrolle mit Eiskältefalle", "Kann im Raid die Aura des Volltreffers für alle Fernkämpfer mitbringen"], "schwaechen": ["Totzone: zwischen Nahkampf und 8 m kein Angriff möglich", "Kann weder betäuben (außer per Talent) noch Zauber unterbrechen", "Begleiter muss gefüttert und gepflegt werden", "Mana geht bei langen Kämpfen schnell aus", "Keine Heil- oder Tankrolle"], "forever_neu": ["Gezielter Schuss ist für alle Jäger ab Stufe 20 Grundfähigkeit (kein Talent mehr); Verbessertes Mal des Jägers und Verbesserte Augen des Wildtiers sind ebenfalls eingebaut.", "Arkaner Schuss teilt sich keine Abklingzeit mehr mit Gezielter Schuss, dafür teilt sich Mehrfachschuss jetzt die Abklingzeit mit Gezielter Schuss.", "Fallen gehen auch im Kampf (30 Sek. Abklingzeit); Frost- und Feuerfallen haben getrennte Abklingzeiten.", "Rückzug senkt die Bedrohung doppelt so stark; Aspekt des Wildtiers gibt auch Nahkampfangriffskraft.", "Skorpidstich senkt jetzt die Trefferchance des Ziels um 2 % statt Stärke und Beweglichkeit.", "Begleiter erhalten 10 % deiner Angriffskraft und 100 % deiner kritischen Trefferchance, bekommen aber keine Werte-Buffs von Spielern mehr. Fokus regeneriert jetzt gleichmäßig.", "Jede Begleiterfamilie hat eine eigene Fähigkeit (z. B. Bär: Prankenhieb, Krokilisk: Zerstückeln, Wolf: Wutgeheul); neue Familie Fuchs mit Tanz des Täuschers; die Eule heißt jetzt Raubvogel.", "Neue Talente: Fokussiertes Feuer, Falke beschwören, Sorgfältiges Zielen, Schneller Tod, Rasche Erholung, Einsamer Wolf, Heckenschützenschuss, Verbessertes Fährtenlesen, Vorteil des Raubtiers, Einfallsreichtum, Beute aufspüren, Disziplin des Überlebenskünstlers, Streichertritt, Aufschlitzende Schläge.", "Aura des Volltreffers sitzt jetzt in Reihe 4 (21 Punkte) und gibt nur noch Distanzangriffskraft.", "Neue Werte: Krit und Treffer gelten für alle Angriffsarten, Tempo ist ein Zweitwert, Waffenkunde* (Expertise) ersetzt Waffenfertigkeits-Boni.", "Menschen können jetzt Jäger werden; neues Volk Himmelsgeborene* auf beiden Seiten. Doppelte Talentspezialisierung ab Stufe 40."], "voelker": [{"volk": "Mensch", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Neu als Jäger. Gnadenlos* (mehr kritische Trefferchance; Wert je nach Quelle 1–2 %) und Überlebenswille gegen Betäubungen. Method nennt den Menschen besonders stark."}, {"volk": "Nachtelf", "fraktion": "Allianz", "bewertung": "sehr gut", "warum": "Elunes Licht* (laut Method 15 Sek. lang +10 % Krit) und Schattenmimik zum Verstecken – gut für PvE und PvP."}, {"volk": "Zwerg", "fraktion": "Allianz", "bewertung": "gut", "warum": "Zusätzliche Trefferchance (laut Warcraft Tavern +1 %), Großwildjäger* und Steingestalt gegen Gifte, Blutungen und Krankheiten."}, {"volk": "Himmelsgeborene* (Hoher Orden)", "fraktion": "Allianz", "bewertung": "gut", "warum": "Windgesegnet* gibt Tempo; dazu Auf Luft gehen*. Neues Volk, Werte noch vorläufig."}, {"volk": "Orc", "fraktion": "Horde", "bewertung": "sehr gut", "warum": "Kochendes Blut (10 % Angriffskraft für 15 Sek.), mehr Begleiterschaden (laut Warcraft Tavern +5 %) und Zähigkeit gegen Betäubungen."}, {"volk": "Troll", "fraktion": "Horde", "bewertung": "sehr gut", "warum": "Berserker (Angriffstempo auf Knopfdruck) und Wildtierschlächter (mehr Schaden gegen Wildtiere) – stark beim Leveln."}, {"volk": "Tauren", "fraktion": "Horde", "bewertung": "gut", "warum": "Kriegsdonner (Flächenbetäubung), mehr Gesundheit und Ebenenlaufen* (Tempo ohne Benommenheit). Eher für Überleben und PvP."}, {"volk": "Himmelsgeborene* (Windformer)", "fraktion": "Horde", "bewertung": "gut", "warum": "Windgesegnet* gibt Tempo, Himmelssicht* als Zusatz. Neues Volk, Werte noch vorläufig."}], "specs": [{"name": "Tierherrschaft", "rolle": "Fernkampf-Schaden", "beschreibung": "Dein Begleiter und bis zu zwei Falken machen einen Großteil des Schadens. Sehr robust und einfach.", "leveln": "empfohlen", "endspiel": "Solider Fernkampfschaden mit Tier; laut Simulationen nah an den anderen Specs (vorläufig)."}, {"name": "Treffsicherheit", "rolle": "Fernkampf-Schaden", "beschreibung": "Klassischer Schütze mit Heckenschützenschuss, Aura des Volltreffers und optional ganz ohne Tier (Einsamer Wolf).", "leveln": "gut", "endspiel": "Raid-Schaden plus Aura des Volltreffers für alle Fernkämpfer (vorläufig)."}, {"name": "Überleben", "rolle": "Fernkampf-Schaden", "beschreibung": "Mischt Schüsse mit Nahkampf (Mungobiss, Streichertritt, Aufschlitzende Schläge) und starken Fallen.", "leveln": "gut", "endspiel": "Nahkampf-/Mischspiel und PvP; Endspiel-Wert noch unklar (vorläufig)."}], "leveling_spec": "Tierherrschaft", "talente": {"baeume": [{"id": "bm", "name": "Tierherrschaft", "en": "Beast Mastery", "talente": [{"id": "bm_1", "name": "Tödliche Aspekte", "en": "Deadly Aspects", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Mit Aspekt des Falken haben deine Fernkampfangriffe eine Chance von 2/4/6/8/10 %, 12 Sek. lang 30 % Fernkampftempo zu gewähren. Mit Aspekt des Wildtiers gilt dasselbe für Nahkampf-Autoangriffe (30 % Nahkampftempo). Ersetzt Verbesserter Aspekt des Falken."}, {"id": "bm_2", "name": "Ausdauertraining", "en": "Endurance Training", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht Gesundheit und Rüstung deines Begleiters um 3/6/9/12/15 % (enthält jetzt das alte Talent Dickes Fell)."}, {"id": "bm_3", "name": "Fokussiertes Feuer", "en": "Focused Fire", "reihe": 2, "spalte": 1, "max": 2, "vor": null, "text": "Neu: Solange dein Begleiter aktiv ist, verursachst du 1/2 % mehr Schaden."}, {"id": "bm_4", "name": "Verbesserter Aspekt des Affen", "en": "Improved Aspect of the Monkey", "reihe": 2, "spalte": 2, "max": 3, "vor": null, "text": "Erhöht den Ausweichbonus von Aspekt des Affen um 2/4/6 %. Dein Begleiter erhält zusätzlich einen Teil davon (laut Blizzard die Hälfte)."}, {"id": "bm_5", "name": "Wegfindung", "en": "Pathfinding", "reihe": 2, "spalte": 3, "max": 2, "vor": null, "text": "Erhöht den Tempobonus von Aspekt des Geparden und Aspekt des Rudels um 3/6 %. In Forever von Reihe 3 nach Reihe 2 verschoben."}, {"id": "bm_6", "name": "Verbessertes Tier wiederbeleben", "en": "Improved Revive Pet", "reihe": 2, "spalte": 4, "max": 2, "vor": null, "text": "Tier wiederbeleben: Zauberzeit −3/−6 Sek., Manakosten −20/−40 %, und dein Begleiter kehrt mit 15/30 % mehr Gesundheit zurück."}, {"id": "bm_7", "name": "Tiergeschwindigkeit", "en": "Bestial Swiftness", "reihe": 3, "spalte": 2, "max": 1, "vor": null, "text": "Erhöht das Bewegungstempo deines Begleiters um 30 %. Voraussetzung für Einschüchterung."}, {"id": "bm_8", "name": "Entfesselter Furor", "en": "Unleashed Fury", "reihe": 3, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht den Schaden deines Begleiters und deiner Falken um 3/6/9/12/15 %."}, {"id": "bm_9", "name": "Verbessertes Tier heilen", "en": "Improved Mend Pet", "reihe": 4, "spalte": 1, "max": 2, "vor": null, "text": "Tier heilen hat eine Chance von 15/30 %, einen Fluch-, Krankheits-, Magie- oder Gifteffekt vom Begleiter zu entfernen, und kostet weniger Mana (Rang 1: −10 %)."}, {"id": "bm_10", "name": "Wildheit", "en": "Ferocity", "reihe": 4, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht die kritische Trefferchance deines Begleiters und deiner Falken um 2/4/6/8/10 %."}, {"id": "bm_11", "name": "Falke beschwören", "en": "Summon Hawk", "reihe": 4, "spalte": 4, "max": 1, "vor": null, "text": "Neu (16-Punkte-Talent): Ein Falke stürzt sich auf das Ziel (Rang 1: ca. 53 körperlicher Schaden) und greift es 18 Sek. lang an. Bis zu 2 Falken gleichzeitig. Teilt sich die Abklingzeit mit Arkaner Schuss."}, {"id": "bm_12", "name": "Seelenverbindung", "en": "Spirit Bond", "reihe": 5, "spalte": 1, "max": 2, "vor": null, "text": "Solange dein Begleiter aktiv ist, regenerieren du und dein Begleiter alle 10 Sek. 1/2 % der maximalen Gesundheit."}, {"id": "bm_13", "name": "Einschüchterung", "en": "Intimidation", "reihe": 5, "spalte": 2, "max": 1, "vor": "bm_7", "text": "Der nächste erfolgreiche Angriff deines Begleiters betäubt das Ziel 3 Sek. lang, erzeugt viel Bedrohung und hat 100 % mehr kritische Trefferchance."}, {"id": "bm_14", "name": "Wildtierdisziplin", "en": "Bestial Discipline", "reihe": 5, "spalte": 4, "max": 2, "vor": null, "text": "Erhöht die Fokusregeneration deines Begleiters um 10/20 %. Außerdem laufen beim Zaubern 25/50 % deiner Manaregeneration weiter."}, {"id": "bm_15", "name": "Raserei", "en": "Frenzy", "reihe": 6, "spalte": 3, "max": 5, "vor": "bm_10", "text": "Nach einem kritischen Treffer deines Begleiters besteht eine Chance von 20/40/60/80/100 %, dass er 8 Sek. lang 30 % Angriffstempo erhält."}, {"id": "bm_16", "name": "Zorn des Wildtiers", "en": "Bestial Wrath", "reihe": 7, "spalte": 2, "max": 1, "vor": "bm_13", "text": "Dein Begleiter verursacht 18 Sek. lang 50 % mehr Schaden und lässt sich bis zu seinem Tod nicht aufhalten."}]}, {"id": "mm", "name": "Treffsicherheit", "en": "Marksmanship", "talente": [{"id": "mm_1", "name": "Falkenauge", "en": "Hawk Eye", "reihe": 1, "spalte": 1, "max": 3, "vor": null, "text": "Erhöht die Reichweite deiner Fernkampfwaffen um 2/4/6 Meter. In Forever von Reihe 3 nach Reihe 1 verschoben."}, {"id": "mm_2", "name": "Verbesserter Erschütternder Schuss", "en": "Improved Concussive Shot", "reihe": 1, "spalte": 2, "max": 5, "vor": null, "text": "Erschütternder Schuss hat eine Chance von 4/8/12/16/20 %, das Ziel 3 Sek. lang zu betäuben."}, {"id": "mm_3", "name": "Tödliche Angriffe", "en": "Lethal Attacks", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht die kritische Trefferchance ALLER Angriffe um 1/2/3/4/5 % (früher Tödliche Schüsse, nur Fernkampf)."}, {"id": "mm_4", "name": "Verbesserte Stiche*", "en": "Improved Stings", "reihe": 2, "spalte": 1, "max": 3, "vor": null, "text": "Rang 1: Schlangenbiss +6 % Schaden, Abklingzeit von Vipernbiss −2 Sek., Dauer von Skorpidstich +15 Sek. Voll ausgebaut laut Quellen etwa +20 % / −6 Sek. / +45 Sek. (vorläufig)."}, {"id": "mm_5", "name": "Effizienz", "en": "Efficiency", "reihe": 2, "spalte": 2, "max": 5, "vor": null, "text": "Senkt die Manakosten von Schüssen, Stichen und Nahkampffähigkeiten um 3/6/9/12/15 %."}, {"id": "mm_6", "name": "Sorgfältiges Zielen", "en": "Careful Aim", "reihe": 2, "spalte": 3, "max": 5, "vor": null, "text": "Neu: Erhöht deine Nah- und Fernkampfangriffskraft um 20/40/60/80/100 % deiner Intelligenz."}, {"id": "mm_7", "name": "Schneller Tod", "en": "Rapid Killing", "reihe": 3, "spalte": 1, "max": 2, "vor": null, "text": "Neu: Verkürzt die Abklingzeit von Schnellfeuer um 1/2 Min. Stirbt ein Gegner durch dich oder mit deinem Schlangenbiss, macht dein nächster Schuss innerhalb von 20 Sek. 10/20 % mehr Schaden."}, {"id": "mm_8", "name": "Verbesserter Arkaner Schuss", "en": "Improved Arcane Shot", "reihe": 3, "spalte": 2, "max": 5, "vor": null, "text": "Verkürzt die Abklingzeit von Arkaner Schuss um 0,3 Sek. je Rang (laut Talentrechner; wirkt nicht auf die mit Falke beschwören geteilte Abklingzeit, vorläufig)."}, {"id": "mm_9", "name": "Einsamer Wolf", "en": "Lone Wolf", "reihe": 3, "spalte": 4, "max": 1, "vor": null, "text": "Neu (11-Punkte-Talent): Solange du keinen aktiven Begleiter hast, verursachst du mit allen Angriffen 20 % mehr Schaden."}, {"id": "mm_10", "name": "Aura des Volltreffers", "en": "Trueshot Aura", "reihe": 4, "spalte": 2, "max": 1, "vor": null, "text": "Jetzt das 21-Punkte-Talent in Reihe 4: Erhöht die Distanzangriffskraft von Gruppen- und Schlachtzugsmitgliedern im Umkreis von 45 m (Rang 1: +30). Gibt nur noch Distanzangriffskraft. Höhere Ränge beim Lehrer."}, {"id": "mm_11", "name": "Todbringende Schüsse", "en": "Mortal Shots", "reihe": 4, "spalte": 3, "max": 5, "vor": "mm_6", "text": "Erhöht den kritischen Schadensbonus deiner Fernkampffähigkeiten um 6/12/18/24/30 %."}, {"id": "mm_12", "name": "Rasche Erholung", "en": "Rapid Recuperation", "reihe": 5, "spalte": 1, "max": 2, "vor": "mm_7", "text": "Neu: Trifft dein Schlangenbiss, laufen 15 Sek. lang 25/50 % deiner Manaregeneration beim Zaubern weiter. Beim Verbrauch von Schneller Tod sind es 50/100 %."}, {"id": "mm_13", "name": "Sperrfeuer", "en": "Barrage", "reihe": 5, "spalte": 3, "max": 3, "vor": null, "text": "Erhöht den Schaden von Mehrfachschuss, Gezielter Schuss und Salve um 3/6/9 %."}, {"id": "mm_14", "name": "Streuschuss", "en": "Scatter Shot", "reihe": 5, "spalte": 4, "max": 1, "vor": null, "text": "Kurzreichweitiger Schuss mit 50 % Waffenschaden, der das Ziel 4 Sek. lang desorientiert. Schaden bricht den Effekt."}, {"id": "mm_15", "name": "Distanzwaffenspezialisierung", "en": "Ranged Weapon Specialization", "reihe": 6, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht den Schaden deiner Fernkampfwaffen um 1/2/3/4/5 %."}, {"id": "mm_16", "name": "Heckenschützenschuss", "en": "Sniper Shot", "reihe": 7, "spalte": 2, "max": 1, "vor": "mm_10", "text": "Neu (31-Punkte-Talent): Schuss mit 45 m Reichweite, 4 Sek. Zauberzeit und 15 Sek. Abklingzeit, stärker als Gezielter Schuss (Rang 1: +160 Distanzschaden). Danach haben deine nächsten 3 Schüsse 10 Sek. lang 10 m mehr Reichweite."}]}, {"id": "sv", "name": "Überleben", "en": "Survival", "talente": [{"id": "sv_1", "name": "Verbessertes Fährtenlesen", "en": "Improved Tracking", "reihe": 1, "spalte": 1, "max": 5, "vor": null, "text": "Neu (ersetzt Monstertöten und Humanoidentöten): Erhöht deinen Schaden gegen die Kreaturenart, die du gerade aufspürst, um 1/2/3/4/5 %."}, {"id": "sv_2", "name": "Abwehr", "en": "Deflection", "reihe": 1, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht deine Parierchance (laut Talentrechner +1 % je Rang; eine andere Quelle nennt bis zu 10 % – vorläufig)."}, {"id": "sv_3", "name": "Einfangen", "en": "Entrapment", "reihe": 2, "spalte": 1, "max": 5, "vor": null, "text": "Ausgelöste Fallen halten die betroffenen Ziele jetzt immer fest. Jeder Rang verlängert die Dauer (Rang 1: 1 Sek.)."}, {"id": "sv_4", "name": "Wilde Schläge", "en": "Savage Strikes", "reihe": 2, "spalte": 2, "max": 2, "vor": null, "text": "Wirkt jetzt auf alle Nahkampfangriffe: laut Blizzard +2/4 % Nahkampfschaden, laut Talentrechner +2/4 % kritische Trefferchance (vorläufig)."}, {"id": "sv_5", "name": "Überlebenskünstler", "en": "Survivalist", "reihe": 2, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht deine maximale Gesundheit um 2/4/6/8/10 %."}, {"id": "sv_6", "name": "Verbessertes Zurechtstutzen", "en": "Improved Wing Clip", "reihe": 2, "spalte": 4, "max": 3, "vor": null, "text": "Zurechtstutzen hat eine Chance von 7/14/20 %, das Ziel 5 Sek. lang bewegungsunfähig zu machen."}, {"id": "sv_7", "name": "Geschickte Fallen", "en": "Clever Traps", "reihe": 3, "spalte": 1, "max": 2, "vor": null, "text": "Erhöht die Dauer von Eiskältefalle und Frostfalle sowie den Schaden von Feuerbrandfalle und Sprengfalle um 15/30 %."}, {"id": "sv_8", "name": "Sicherer Stand", "en": "Surefooted", "reihe": 3, "spalte": 2, "max": 3, "vor": null, "text": "Erhöht deine Trefferchance mit allen Angriffen um 1/2/3 % und verkürzt bewegungseinschränkende Effekte auf dir um 10/20/30 %."}, {"id": "sv_9", "name": "Abschreckung", "en": "Deterrence", "reihe": 3, "spalte": 3, "max": 1, "vor": null, "text": "Erhöht 10 Sek. lang deine Ausweich- und Parierchance um 25 %."}, {"id": "sv_10", "name": "Überlebenstaktik", "en": "Survival Tactics", "reihe": 4, "spalte": 1, "max": 2, "vor": null, "text": "Erhöht die Trefferchance deiner Fallen und von Totstellen (Rang 1: +5 %). Ersetzt Fallenbeherrschung."}, {"id": "sv_11", "name": "Vorteil des Raubtiers", "en": "Predator's Edge", "reihe": 4, "spalte": 2, "max": 5, "vor": null, "text": "Neu: Erhöht den kritischen Schadensbonus im Nahkampf um 6/12/18/24/30 % und den Schaden der Schildhandwaffe beim Kampf mit zwei Waffen um 10/20/30/40/50 % (nicht für automatische Angriffe)."}, {"id": "sv_12", "name": "Gegenangriff", "en": "Counterattack", "reihe": 4, "spalte": 3, "max": 1, "vor": "sv_9", "text": "Jetzt das 16-Punkte-Talent: Nach einem Parieren schlägst du mit 50 % Waffenschaden plus Zusatzschaden zu und machst das Ziel 5 Sek. lang bewegungsunfähig. Kann nicht geblockt, ausgewichen oder pariert werden."}, {"id": "sv_13", "name": "Einfallsreichtum", "en": "Resourcefulness", "reihe": 5, "spalte": 1, "max": 2, "vor": null, "text": "Neu: Senkt die Manakosten von Fallen und Nahkampffähigkeiten um 30/60 %. Kritische Treffer können 30 Sek. lang 50 % Manaregeneration beim Zaubern gewähren (Rang 1: 30 % Chance)."}, {"id": "sv_14", "name": "Beute aufspüren", "en": "Expose Prey", "reihe": 5, "spalte": 2, "max": 2, "vor": null, "text": "Neu: Angriffe auf ein Ziel mit Mal des Jägers haben eine Chance von 5/10 %, Mungobiss freizuschalten, als ob du ausgewichen wärst."}, {"id": "sv_15", "name": "Disziplin des Überlebenskünstlers", "en": "Survivalist's Discipline", "reihe": 5, "spalte": 3, "max": 2, "vor": null, "text": "Neu: Verkürzt die Abklingzeiten deiner Fallen und von Abschreckung um 20/40 %."}, {"id": "sv_16", "name": "Streichertritt", "en": "Strider Kick", "reihe": 5, "spalte": 4, "max": 1, "vor": null, "text": "Neu (21-Punkte-Talent): Sofortiger Tritt mit 100 % Waffenschaden (8 Sek. Abklingzeit), der dein Bewegungstempo 3 Sek. lang um 30 % erhöht."}, {"id": "sv_17", "name": "Blitzartige Reflexe", "en": "Lightning Reflexes", "reihe": 6, "spalte": 3, "max": 5, "vor": null, "text": "Erhöht deine Beweglichkeit um 2/4/6/8/10 % (weniger als in Classic)."}, {"id": "sv_18", "name": "Aufschlitzende Schläge", "en": "Lacerating Strikes", "reihe": 7, "spalte": 2, "max": 1, "vor": "sv_14", "text": "Neu (31-Punkte-Talent): Mungobiss verursacht zusätzlich eine Blutung, die über 21 Sek. 40 % des Mungobiss-Schadens zufügt."}]}]}, "talent_reihenfolge": [{"stufe": 10, "talent": "bm_1"}, {"stufe": 11, "talent": "bm_1"}, {"stufe": 12, "talent": "bm_1"}, {"stufe": 13, "talent": "bm_1"}, {"stufe": 14, "talent": "bm_1"}, {"stufe": 15, "talent": "bm_3"}, {"stufe": 16, "talent": "bm_3"}, {"stufe": 17, "talent": "bm_5"}, {"stufe": 18, "talent": "bm_5"}, {"stufe": 19, "talent": "bm_2"}, {"stufe": 20, "talent": "bm_8"}, {"stufe": 21, "talent": "bm_8"}, {"stufe": 22, "talent": "bm_8"}, {"stufe": 23, "talent": "bm_8"}, {"stufe": 24, "talent": "bm_8"}, {"stufe": 25, "talent": "bm_11"}, {"stufe": 26, "talent": "bm_7"}, {"stufe": 27, "talent": "bm_10"}, {"stufe": 28, "talent": "bm_10"}, {"stufe": 29, "talent": "bm_10"}, {"stufe": 30, "talent": "bm_13"}, {"stufe": 31, "talent": "bm_10"}, {"stufe": 32, "talent": "bm_10"}, {"stufe": 33, "talent": "bm_14"}, {"stufe": 34, "talent": "bm_14"}, {"stufe": 35, "talent": "bm_15"}, {"stufe": 36, "talent": "bm_15"}, {"stufe": 37, "talent": "bm_15"}, {"stufe": 38, "talent": "bm_15"}, {"stufe": 39, "talent": "bm_15"}, {"stufe": 40, "talent": "bm_16"}, {"stufe": 41, "talent": "mm_3"}, {"stufe": 42, "talent": "mm_3"}, {"stufe": 43, "talent": "mm_3"}, {"stufe": 44, "talent": "mm_3"}, {"stufe": 45, "talent": "mm_3"}, {"stufe": 46, "talent": "mm_6"}, {"stufe": 47, "talent": "mm_6"}, {"stufe": 48, "talent": "mm_6"}, {"stufe": 49, "talent": "mm_6"}, {"stufe": 50, "talent": "mm_6"}, {"stufe": 51, "talent": "mm_7"}, {"stufe": 52, "talent": "mm_7"}, {"stufe": 53, "talent": "mm_4"}, {"stufe": 54, "talent": "mm_4"}, {"stufe": 55, "talent": "mm_4"}, {"stufe": 56, "talent": "mm_10"}, {"stufe": 57, "talent": "mm_11"}, {"stufe": 58, "talent": "mm_11"}, {"stufe": 59, "talent": "mm_11"}, {"stufe": 60, "talent": "mm_11"}], "talent_endspiel": [{"name": "Raid-Schaden (Tierherrschaft)", "punkte": "31/20/0", "verteilung": {"bm_1": 5, "bm_2": 3, "bm_3": 2, "bm_8": 5, "bm_11": 1, "bm_7": 1, "bm_10": 5, "bm_13": 1, "bm_14": 2, "bm_15": 5, "bm_16": 1, "mm_3": 5, "mm_6": 5, "mm_7": 2, "mm_4": 3, "mm_10": 1, "mm_11": 4}, "hinweis": "Punkteverteilung 31/20/0 wie bei Mobalytics; einzelne Punkte selbst zusammengestellt (vorläufig). Wegfindung gegen Ausdauertraining getauscht."}, {"name": "Raid-Schaden (Treffsicherheit)", "punkte": "5/46/0", "verteilung": {"bm_1": 5, "mm_1": 3, "mm_3": 5, "mm_4": 3, "mm_5": 5, "mm_6": 5, "mm_7": 2, "mm_8": 5, "mm_9": 1, "mm_10": 1, "mm_11": 5, "mm_12": 2, "mm_13": 3, "mm_15": 5, "mm_16": 1}, "hinweis": "Aufteilung 5/46/0 nach Warcraft Tavern, ohne Tier (Einsamer Wolf). Mit Tier: Einsamer Wolf gegen 1 Punkt Verbessertes Fährtenlesen tauschen. Vorläufig."}], "talent_hinweise": ["Tierherrschaft ist beim Leveln die empfohlene Wahl (Method, Warcraft Tavern): Das Tier tankt, du schießt.", "Mit Stufe 25 hast du Falke beschwören (16. Punkt), mit 30 Einschüchterung und mit 40 Zorn des Wildtiers – genau die Meilensteine aus dem Warcraft-Tavern-Leitfaden.", "Ab Stufe 41 geht es in Treffsicherheit: Tödliche Angriffe und Sorgfältiges Zielen bringen Krit und Angriffskraft, danach Aura des Volltreffers.", "Wegfindung ist ein Komfort-Talent für schnelleres Reisen; im Raid lieber Punkte in Ausdauertraining.", "Talente umlernen kostet Gold beim Klassenlehrer in einer Hauptstadt. Ab Stufe 40 gibt es die doppelte Talentspezialisierung.", "Die Spalten-Positionen im Baum sind aus den Reihen und Voraussetzungen abgeleitet und können vom Spiel leicht abweichen (vorläufig). Werte stammen aus der Beta und können sich bis zum Start ändern."], "faehigkeiten": [{"name": "Automatischer Schuss", "en": "Auto Shot", "stufe": 1, "art": "Angriff", "text": "Schießt automatisch immer weiter auf dein Ziel. Dein wichtigster Schaden – halte ihn möglichst ohne Pause aktiv.", "wichtig": true}, {"name": "Raptorstoß", "en": "Raptor Strike", "stufe": 1, "art": "Angriff", "text": "Starker Nahkampfschlag. Nutze ihn, wenn ein Gegner direkt vor dir steht (bis 8 m kannst du nicht schießen).", "wichtig": true}, {"name": "Wildtiere aufspüren", "en": "Track Beasts", "stufe": 1, "art": "Sonstiges", "text": "Zeigt Wildtiere auf der Minikarte. Später lernst du weitere Arten (Humanoide 10, Untote 18, Verborgenes 24, Elementare 26, Dämonen 32, Riesen 40, Drachkin 50). Mit Verbessertes Fährtenlesen auch ein Schadensbonus.", "wichtig": false}, {"name": "Aspekt des Affen", "en": "Aspect of the Monkey", "stufe": 4, "art": "Haltung", "text": "+8 % Ausweichchance. Gut, wenn dich Gegner im Nahkampf schlagen, z. B. vor Stufe 10 oder beim Zähmen.", "wichtig": false}, {"name": "Schlangenbiss", "en": "Serpent Sting", "stufe": 4, "art": "Angriff", "text": "Naturschaden über 15 Sek. Auf jedes länger lebende Ziel setzen; löst mit Talenten auch Schneller Tod und Rasche Erholung aus.", "wichtig": true}, {"name": "Arkaner Schuss", "en": "Arcane Shot", "stufe": 6, "art": "Angriff", "text": "Sofortiger Arkanschaden. Teilt sich die Abklingzeit mit Falke beschwören, aber nicht mehr mit Gezielter Schuss.", "wichtig": false}, {"name": "Mal des Jägers", "en": "Hunter's Mark", "stufe": 6, "art": "Buff", "text": "Markiert das Ziel: Alle Angreifer erhalten mehr Distanzangriffskraft dagegen. Vor dem Kampf auf das Ziel legen.", "wichtig": true}, {"name": "Erschütternder Schuss", "en": "Concussive Shot", "stufe": 8, "art": "Kontrolle", "text": "Verlangsamt das Ziel 4 Sek. lang um 50 %. Zum Weglaufen und Abstand halten (Kiten).", "wichtig": false}, {"name": "Aspekt des Falken", "en": "Aspect of the Hawk", "stufe": 10, "art": "Haltung", "text": "Mehr Distanzangriffskraft. Im Kampf fast immer aktiv.", "wichtig": true}, {"name": "Wildtier zähmen", "en": "Tame Beast", "stufe": 10, "art": "Begleiter", "text": "Zähmt ein Wildtier deiner Stufe oder darunter. Du lernst es über die Klassenquest auf Stufe 10. Während des Zähmens hast du keine Rüstung – vorher Eiskältefalle legen.", "wichtig": true}, {"name": "Tier rufen", "en": "Call Pet", "stufe": 10, "art": "Begleiter", "text": "Ruft deinen Begleiter herbei; mit Tier fortschicken schickst du ihn weg.", "wichtig": false}, {"name": "Tier füttern", "en": "Feed Pet", "stufe": 10, "art": "Begleiter", "text": "Füttert den Begleiter und hält ihn zufrieden. Ein glücklicher Begleiter macht 125 % Schaden, ein unglücklicher nur 75 %.", "wichtig": false}, {"name": "Tier wiederbeleben", "en": "Revive Pet", "stufe": 10, "art": "Begleiter", "text": "Belebt den toten Begleiter wieder. Danach füttern, weil sein Tod die Zufriedenheit senkt.", "wichtig": false}, {"name": "Wildtierausbildung", "en": "Beast Training", "stufe": 10, "art": "Begleiter", "text": "Bringt deinem Begleiter Fähigkeiten bei (mit Trainingspunkten). Freigeschaltet über die Zähm-Questreihe.", "wichtig": false}, {"name": "Tier heilen", "en": "Mend Pet", "stufe": 12, "art": "Begleiter", "text": "Heilt den Begleiter über Zeit. Wichtig, wenn er beim Leveln tankt.", "wichtig": true}, {"name": "Zurechtstutzen", "en": "Wing Clip", "stufe": 12, "art": "Kontrolle", "text": "Nahkampfschlag, der das Ziel 10 Sek. lang verlangsamt. Danach Abstand gewinnen und weiterschießen.", "wichtig": false}, {"name": "Ablenkender Schuss", "en": "Distracting Shot", "stufe": 12, "art": "Sonstiges", "text": "Erzeugt Bedrohung, damit ein Gegner dich (statt einen Mitspieler) angreift. Selten nötig.", "wichtig": false}, {"name": "Adlerauge", "en": "Eagle Eye", "stufe": 14, "art": "Sonstiges", "text": "Weite Sicht in die Ferne zum Auskundschaften.", "wichtig": false}, {"name": "Augen des Wildtiers", "en": "Eyes of the Beast", "stufe": 14, "art": "Begleiter", "text": "Du steuerst deinen Begleiter direkt. Das alte Talent dazu ist jetzt Grundfähigkeit.", "wichtig": false}, {"name": "Wildtier ängstigen", "en": "Scare Beast", "stufe": 14, "art": "Kontrolle", "text": "Lässt ein Wildtier fliehen. Vorsicht: Fliehende Gegner können weitere Gegner holen.", "wichtig": false}, {"name": "Feuerbrandfalle", "en": "Immolation Trap", "stufe": 16, "art": "Angriff", "text": "Feuerfalle, die das erste Ziel 15 Sek. lang verbrennt. Fallen gehen in Forever auch im Kampf (30 Sek. Abklingzeit).", "wichtig": false}, {"name": "Mungobiss", "en": "Mongoose Bite", "stufe": 16, "art": "Angriff", "text": "Nahkampf-Gegenschlag, nachdem der Gegner deinem Angriff ausgewichen ist. Wichtig für Überleben.", "wichtig": false}, {"name": "Mehrfachschuss", "en": "Multi-Shot", "stufe": 18, "art": "Angriff", "text": "Trifft bis zu 3 Ziele. Teilt sich jetzt die Abklingzeit mit Gezielter Schuss. Nicht auf Ziele unter Schafen/Fallen nutzen.", "wichtig": true}, {"name": "Gezielter Schuss", "en": "Aimed Shot", "stufe": 20, "art": "Angriff", "text": "Starker Schuss mit Zauberzeit. In Forever für alle Jäger ab Stufe 20 (früher Talent). Auf Abklingzeit nutzen.", "wichtig": true}, {"name": "Aspekt des Geparden", "en": "Aspect of the Cheetah", "stufe": 20, "art": "Bewegung", "text": "+30 % Lauftempo. Nur zum Reisen – wirst du getroffen, bist du benommen.", "wichtig": false}, {"name": "Rückzug", "en": "Disengage", "stufe": 20, "art": "Sonstiges", "text": "Senkt deine Bedrohung (in Forever doppelt so stark). Hilft, wenn du dem Begleiter oder Tank die Gegner weggenommen hast.", "wichtig": false}, {"name": "Eiskältefalle", "en": "Freezing Trap", "stufe": 20, "art": "Kontrolle", "text": "Friert das erste Ziel ein (bis 20 Sek.); Schaden bricht das Eis. Deine wichtigste Kontrolle in Dungeons.", "wichtig": true}, {"name": "Skorpidstich", "en": "Scorpid Sting", "stufe": 22, "art": "Sonstiges", "text": "Senkt in Forever 20 Sek. lang die Trefferchance des Ziels um 2 %. Im Raid nur, wenn abgesprochen.", "wichtig": false}, {"name": "Schnellfeuer", "en": "Rapid Fire", "stufe": 26, "art": "Buff", "text": "+40 % Angriffstempo für 15 Sek. Auf Abklingzeit oder für schwere Gegner nutzen.", "wichtig": true}, {"name": "Frostfalle", "en": "Frost Trap", "stufe": 28, "art": "Kontrolle", "text": "Eisfläche, die Gegner 30 Sek. lang um 60 % verlangsamt. Zum Kiten und gegen Gruppen.", "wichtig": false}, {"name": "Aspekt des Wildtiers", "en": "Aspect of the Beast", "stufe": 30, "art": "Haltung", "text": "Gibt in Forever auch Nahkampfangriffskraft – für Überleben-Jäger im Nahkampf.", "wichtig": false}, {"name": "Totstellen", "en": "Feign Death", "stufe": 30, "art": "Schutz", "text": "Du stellst dich tot, Gegner verlieren das Interesse. Rettet dich bei zu viel Bedrohung oder wenn alles schiefgeht.", "wichtig": true}, {"name": "Sprengfalle", "en": "Explosive Trap", "stufe": 34, "art": "Angriff", "text": "Feuerfalle mit Flächenschaden in 10 m. Für Gegnergruppen.", "wichtig": false}, {"name": "Vipernbiss", "en": "Viper Sting", "stufe": 36, "art": "Sonstiges", "text": "Entzieht dem Ziel 8 Sek. lang Mana. Gegen Zauberer im PvP oder bei Bossen mit Mana.", "wichtig": false}, {"name": "Aspekt des Rudels", "en": "Aspect of the Pack", "stufe": 40, "art": "Bewegung", "text": "+30 % Lauftempo für die Gruppe; Treffer machen benommen. Nur außerhalb des Kampfes.", "wichtig": false}, {"name": "Salve", "en": "Volley", "stufe": 40, "art": "Angriff", "text": "Kanalisierter Flächenschaden (8 m) über 6 Sek. Für viele Gegner auf einem Haufen.", "wichtig": false}, {"name": "Aspekt der Wildnis", "en": "Aspect of the Wild", "stufe": 46, "art": "Buff", "text": "Naturwiderstand für die Gruppe, z. B. bei Bossen mit Naturschaden.", "wichtig": false}, {"name": "Einlullender Schuss", "en": "Tranquilizing Shot", "stufe": 60, "art": "Sonstiges", "text": "Entfernt Raserei-/Wut-Effekte vom Ziel – wichtig bei manchen Raidbossen. Laut Warcraft Tavern ab Stufe 60 beim Lehrer (vorläufig; in Classic per Buch aus dem Geschmolzenen Kern).", "wichtig": false}, {"name": "Falke beschwören", "en": "Summon Hawk", "stufe": 25, "art": "Begleiter", "text": "Talent (Tierherrschaft, 16 Punkte): Bis zu 2 Falken greifen dein Ziel je 18 Sek. lang an. Beim Leveln immer zwei Falken aktiv halten.", "wichtig": true}, {"name": "Einschüchterung", "en": "Intimidation", "stufe": 30, "art": "Kontrolle", "text": "Talent (Tierherrschaft): Dein Begleiter betäubt das Ziel 3 Sek. lang und zieht viel Bedrohung auf sich. Gut, wenn ein Gegner zu dir läuft.", "wichtig": false}, {"name": "Zorn des Wildtiers", "en": "Bestial Wrath", "stufe": 40, "art": "Begleiter", "text": "Talent (Tierherrschaft, 31 Punkte): Begleiter macht 18 Sek. lang 50 % mehr Schaden. Mit Schnellfeuer kombinieren.", "wichtig": false}, {"name": "Aura des Volltreffers", "en": "Trueshot Aura", "stufe": 25, "art": "Buff", "text": "Talent (Treffsicherheit, jetzt schon mit 21 Punkten): Mehr Distanzangriffskraft für Gruppe und Schlachtzug. Dauerhaft aktiv halten.", "wichtig": false}, {"name": "Heckenschützenschuss", "en": "Sniper Shot", "stufe": 40, "art": "Angriff", "text": "Talent (Treffsicherheit, 31 Punkte): 4 Sek. Zauberzeit, 45 m Reichweite, sehr hoher Schaden. Vor dem Kampf und auf Abklingzeit nutzen.", "wichtig": false}, {"name": "Streuschuss", "en": "Scatter Shot", "stufe": 30, "art": "Kontrolle", "text": "Talent (Treffsicherheit): Desorientiert das Ziel 4 Sek. lang – zum Abstandgewinnen oder für eine Falle.", "wichtig": false}, {"name": "Abschreckung", "en": "Deterrence", "stufe": 20, "art": "Schutz", "text": "Talent (Überleben): +25 % Ausweichen und Parieren für 10 Sek. Notfallknopf im Nahkampf.", "wichtig": false}, {"name": "Streichertritt", "en": "Strider Kick", "stufe": 30, "art": "Angriff", "text": "Talent (Überleben, 21 Punkte): Sofortiger Tritt mit 100 % Waffenschaden und kurzem Temposchub.", "wichtig": false}], "rotation": [{"titel": "Leveln vor Stufe 10 (ohne Tier)", "schritte": ["Aspekt des Affen aktiv halten.", "Mit Automatischer Schuss angreifen, Schlangenbiss setzen, Arkaner Schuss auf Abklingzeit.", "Mit Erschütternder Schuss verlangsamen und zwischendurch Abstand gewinnen (Kiten).", "Kommt der Gegner nah: Raptorstoß und Nahkampf."]}, {"titel": "Leveln Tierherrschaft (ab 10)", "schritte": ["Aspekt des Falken aktiv, Mal des Jägers aufs Ziel.", "Begleiter zuerst angreifen lassen und ein paar Sekunden Bedrohung aufbauen lassen.", "Schlangenbiss setzen, ab 25 Falke beschwören auf Abklingzeit (zwei Falken aktiv halten).", "Gezielter Schuss und Schnellfeuer auf Abklingzeit; Arkaner Schuss nur, wenn beide Falken laufen.", "Verliert das Tier die Bedrohung: Zurechtstutzen, Erschütternder Schuss oder Frostfalle und wieder Abstand.", "Tier heilen, wenn der Begleiter viel Schaden nimmt."]}, {"titel": "Dungeon/Raid: ein Ziel (Treffsicherheit, vorläufig)", "schritte": ["Feuerbrandfalle vorab an der Position des Tanks legen.", "Heckenschützenschuss vor dem Kampf und danach auf Abklingzeit.", "Schlangenbiss aufrechterhalten.", "Gezielter Schuss und Arkaner Schuss auf Abklingzeit.", "Schnellfeuer auf Abklingzeit (mit Kochendes Blut/Berserker kombinieren)."]}, {"titel": "Dungeon/Raid: mehrere Ziele (vorläufig)", "schritte": ["Sprengfalle vorab an der Tank-Position legen.", "Mehrfachschuss auf Abklingzeit.", "Schlangenbiss auf mehrere Ziele verteilen.", "Heckenschützenschuss und Arkaner Schuss auf Abklingzeit, Sprengfallen nachlegen.", "Nie auf Ziele in Eiskältefalle oder Schaf schießen."]}], "werte": [{"phase": "1-29 Leveln", "reihenfolge": "Beweglichkeit > Angriffskraft > Intelligenz > Ausdauer/Willenskraft > Rüstung"}, {"phase": "30-60 Leveln", "reihenfolge": "Beweglichkeit > Angriffskraft > Kritische Trefferchance > Intelligenz > Ausdauer/Willenskraft > Rüstung"}, {"phase": "60 Raid (vorläufig)", "reihenfolge": "Trefferchance bis 9 % (6 % bei 305 Waffenfertigkeit) > Beweglichkeit > Kritische Trefferchance > Angriffskraft > Tempo > Intelligenz"}], "werte_info": [{"wert": "Beweglichkeit", "stufe": "BiS 1", "warum": "2 Distanz- und 1 Nahkampfangriffskraft je Punkt, dazu Krit (auf 60 etwa 53 Beweglichkeit = 1 % Krit), Rüstung und Ausweichen."}, {"wert": "Trefferchance", "stufe": "BiS 1", "warum": "Gegen Raidbosse sind etwa 9 % nötig (300 Waffenfertigkeit); darüber kaum Nutzen."}, {"wert": "Kritische Trefferchance", "stufe": "gut", "warum": "Dein Begleiter übernimmt 100 % deiner Krit-Chance; stark mit Todbringende Schüsse."}, {"wert": "Angriffskraft", "stufe": "gut", "warum": "14 Angriffskraft = 1 Schaden pro Sekunde; der Begleiter erhält 10 % davon. Punkt für Punkt meist schwächer als Beweglichkeit."}, {"wert": "Tempo", "stufe": "gut", "warum": "Neuer Zweitwert: schnellere automatische Schüsse und kürzere Zauberzeit von Gezielter Schuss und Heckenschützenschuss."}, {"wert": "Waffenkunde* (Expertise)", "stufe": "gut", "warum": "Ersetzt Waffenfertigkeits-Boni; 5 Waffenfertigkeit entsprechen gegen Bosse etwa 3 % Treffer."}, {"wert": "Intelligenz", "stufe": "gut", "warum": "Mehr Mana; mit Sorgfältiges Zielen auch Angriffskraft."}, {"wert": "Willenskraft", "stufe": "schwach", "warum": "Manaregeneration; wertvoller mit Rasche Erholung oder Wildtierdisziplin."}, {"wert": "Ausdauer", "stufe": "schwach", "warum": "Mehr Gesundheit; beim Leveln nett, im Raid zweitrangig."}, {"wert": "Stärke", "stufe": "nutzlos", "warum": "Bringt Jägern kaum etwas, höchstens etwas für Nahkampf-Überleben."}], "ausruestung": {"leveln": [{"name": "Barbaric Crossbow (engl.)", "en": "Barbaric Crossbow", "stufe": 13, "platz": "Fernkampf", "woher": "Dungeon: Flammenschlund (Orgrimmar)", "warum": "Frühe Armbrust aus dem ersten Horde-Dungeon (laut Warcraft Tavern)."}, {"name": "Calibrated Blunderbuss (engl.)", "en": "Calibrated Blunderbuss", "stufe": 13, "platz": "Fernkampf", "woher": "Quest in der Halle der Thane (nur Allianz)", "warum": "Frühes Gewehr für Allianz-Jäger (laut Warcraft Tavern)."}, {"name": "Venomstrike (engl.)", "en": "Venomstrike", "stufe": 19, "platz": "Fernkampf", "woher": "Dungeon: Höhlen des Wehklagens", "warum": "Bogen mit Gift-Effekt, starkes Upgrade um Stufe 20."}, {"name": "Naga Heartpiercer (engl.)", "en": "Naga Heartpiercer", "stufe": 22, "platz": "Fernkampf", "woher": "Dungeon: Tiefschwarze Grotte", "warum": "Guter Fernkampf bis Ende 20."}, {"name": "Quilboar Blaster (engl.)", "en": "Quilboar Blaster", "stufe": 29, "platz": "Fernkampf", "woher": "Questbelohnung Kral der Klingenhauer", "warum": "Gutes Gewehr kurz vor 30."}, {"name": "Master Hunter's Bow (engl.)", "en": "Master Hunter's Bow", "stufe": 30, "platz": "Fernkampf", "woher": "Questbelohnung 'Big Game Hunter' (Schlingendorntal)", "warum": "Laut Warcraft Tavern starke Fernkampfwaffe ab 30."}, {"name": "Brawler's Leather Hood* (engl.)", "en": "Brawler's Leather Hood", "stufe": 20, "platz": "Kopf", "woher": "Lederverarbeitung", "warum": "Laut Method in der Beta BiS-Kopfteil beim Leveln (Stufe vorläufig)."}, {"name": "Dunkle Lederstiefel", "en": "Dark Leather Boots", "stufe": 20, "platz": "Füße", "woher": "Lederverarbeitung", "warum": "Günstige, gute Stiefel zum Leveln."}, {"name": "Stalker's Leather Belt* (engl.)", "en": "Stalker's Leather Belt", "stufe": 20, "platz": "Taille", "woher": "Lederverarbeitung", "warum": "Von Warcraft Tavern empfohlen (Stufe vorläufig)."}], "pre_bis": [{"platz": "Kopf", "name": "Black Dragonscale Helm* (engl.)", "en": "Black Dragonscale Helm", "woher": "Herstellung (vermutlich Lederverarbeitung) – Quelle noch nicht bestätigt"}, {"platz": "Hals", "name": "Mark of Fordring (engl.)", "en": "Mark of Fordring", "woher": "Quest in den Westlichen Pestländern (Tirion-Fordring-Questreihe)"}, {"platz": "Schultern", "name": "Truestrike Shoulders (engl.)", "en": "Truestrike Shoulders", "woher": "Dungeon: Obere Schwarzfelsspitze"}, {"platz": "Rücken", "name": "Umhang des Schwarzen Barons", "en": "Cape of the Black Baron", "woher": "Stratholme – Baron Totenschwur"}, {"platz": "Brust", "name": "Dawn Armor (engl.)", "en": "Dawn Armor", "woher": "noch nicht bekannt"}, {"platz": "Handgelenk", "name": "Beaststalker's Bindings (engl.)", "en": "Beaststalker's Bindings", "woher": "Dungeon-Set 1 (Weltdrop in Stufe-60-Dungeons)"}, {"platz": "Hände", "name": "Beaststalker's Gloves (engl.)", "en": "Beaststalker's Gloves", "woher": "Dungeon-Set 1: Stratholme"}, {"platz": "Taille", "name": "Ranger's Belt (engl.)", "en": "Ranger's Belt", "woher": "noch nicht bekannt"}, {"platz": "Beine", "name": "Beaststalker's Pants (engl.)", "en": "Beaststalker's Pants", "woher": "Dungeon-Set 1 (Schwarzfelsspitze)"}, {"platz": "Füße", "name": "Windreaver Greaves (engl.)", "en": "Windreaver Greaves", "woher": "noch nicht bekannt"}, {"platz": "Ring 1", "name": "Tarnished Elven Ring (engl.)", "en": "Tarnished Elven Ring", "woher": "Dungeon: Düsterbruc ierung", "wo": "Klassenlehrer in einer Hauptstadt"}, {"stufe": "60", "was": "Einlullender Schuss (laut Warcraft Tavern beim Lehrer, vorläufig)", "wo": "Klassenlehrer"}], "gruppe": ["Benutze Mal des Jägers auf dem Hauptziel – es hilft allen Fernkämpfern.", "Warte nach dem Pull ein paar Sekunden, bis der Tank Bedrohung aufgebaut hat.", "Stelle das Tier auf 'Passiv' oder 'Defensiv', damit es keine Gegner zieht; Knurren (Growl) in Gruppen ausschalten.", "Eiskältefalle ist deine Gruppenkontrolle: vor dem Pull legen und abgesprochene Ziele hineinziehen.", "Zu viel Bedrohung? Rückzug oder Totstellen nutzen.", "Im Raid Aura des Volltreffers (Treffsicherheit) aktiv halten; Einlullender Schuss bei Wut-Bossen.", "Wolf (Wutgeheul) oder Weitschreiter (Staubwolke) sind gute Gruppenbegleiter."], "tipps": ["Totzone: Zwischen Nahkampf und 8 m kannst du nicht angreifen. Halte Abstand oder kämpfe kurz im Nahkampf.", "Begleiter zum Leveln: Katze (viel Schaden, Biss und Klaue) oder Eber (robust, Sturmangriff). Raid: Katze oder Wolf (Wutgeheul stärkt die Gruppe).", "PvP-Begleiter: Krokilisk (Zerstückeln, −50 % Heilung), Fledermaus (Überschall), Raubvogel (Meins! entwaffnet), Windnatter (Blitzschlagatem auf 20 m). Seltene Katze 'Broken Tooth' im Ödland (sehr schnelle Angriffe).", "Neue Begleiterfamilie Fuchs mit Tanz des Täuschers* (mehr Ausweichen und Angriffstempo für 12 Sek.). Jede Familie lernt Biss oder Klaue sowie Sturzflug oder Spurt.", "Füttere deinen Begleiter regelmäßig (nicht im Kampf): Glücklich = 125 % Schaden, unglücklich = 75 %. Tier fortschicken und Tod senken die Zufriedenheit.", "Du kannst nur Tiere bis zu deiner Stufe zähmen. Drei Begleiter möglich (einer aktiv, zwei im Stall).", "Dein Begleiter bekommt 25 % deiner Erfahrung von Gegnern, aber keine Quest- oder Erholungs-EP und höchstens deine Stufe.", "Köcher (Pfeile) bzw. Munitionsbeutel (Kugeln) erhöhen dein Fernkampftempo – immer den besten tragen und genug Munition kaufen.", "Fallen gehen jetzt im Kampf: Bei Problemen Frostfalle unter dich legen und weglaufen.", "Aspekt des Geparden nur zum Reisen – jeder Treffer macht dich benommen.", "Setz dich vor dem Herbeirufen des Begleiters ans Lagerfeuer, damit auch er den Lager-Buff bekommt.", "Makro-Tipp (Warcraft Tavern): Ein Knopf für Tier heilen / Tier wiederbeleben / Tier rufen spart Platz auf der Leiste."], "quellen": [{"titel": "Blizzard: Klassen-Deep-Dive Jäger und Druide (deutsch)", "url": "https://news.blizzard.com/de-de/article/24301515"}, {"titel": "Guildorder: Forever-Talentrechner Jäger", "url": "https://guildorder.com/games/wow_forever/tools/talents/hunter"}, {"titel": "Guildorder: Forever-Talente Jäger (Tierherrschaft)", "url": "https://guildorder.com/games/wow_classic/talents/forever/hunter"}, {"titel": "warcraft.wiki.gg: Hunter abilities (Forever)", "url": "https://warcraft.wiki.gg/wiki/Hunter_abilities_(Forever)"}, {"titel": "Warcraft Tavern: Hunter Guide (Forever)", "url": "https://warcrafttavern.com/forever/guides/hunter/"}, {"titel": "Warcraft Tavern: Hunter Leveling Guide (Forever)", "url": "https://www.warcrafttavern.com/forever/guides/hunter-leveling/"}, {"titel": "Warcraft Tavern: Marksmanship Hunter Guide (Forever)", "url": "https://www.warcrafttavern.com/forever/guides/marksmanship-hunter/"}, {"titel": "Warcraft Tavern: Best Hunter Pets (Forever)", "url": "https://www.warcrafttavern.com/forever/guides/best-hunter-pets/"}, {"titel": "Warcraft Tavern: Hunter Pets Guide (Forever)", "url": "https://www.warcrafttavern.com/forever/guides/hunter-pets/"}, {"titel": "Method: WoW Forever Hunter Leveling Guide and Talents", "url": "https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents"}, {"titel": "Method: Klassen- und Völkerkombinationen", "url": "https://www.method.gg/wow-forever/all-class-and-race-combinations-in-world-of-warcraft-forever"}, {"titel": "Conquest Capped: WoW Forever Hunter Talents", "url": "https://conquestcapped.com/guides/wow-forever/wow-forever-hunter-talents/"}, {"titel"
